<script>
(function(){
  var sp=document.getElementById("hvSplash");if(!sp)return;
  var root=document.documentElement;
  root.classList.add("hv-splash");document.body.classList.add("hv-splash");

  /* 自定义底图 */
  try{
    var bg=localStorage.getItem("klara-splash-bg");
    if(bg){document.getElementById("spPhoto").style.backgroundImage="url("+bg+")";sp.classList.add("photo");}
  }catch(e){}

  /* 逐字 */
  var K="KLARA · MURADILLA",kw=document.getElementById("spK"),hh="";
  for(var i=0;i<K.length;i++){
    var ch=K[i]===" "?"&nbsp;":K[i];
    hh+='<span style="animation-delay:'+(1.3+i*0.055).toFixed(3)+'s">'+ch+'</span>';
  }
  kw.innerHTML=hh;

  /* 浮尘 */
  var dust=document.getElementById("spDust"),frag=document.createDocumentFragment();
  for(var n=0;n<16;n++){
    var e=document.createElement("i");
    var petal=n%4===0, sz=petal?(5+Math.random()*7):(2+Math.random()*2.6);
    e.className=petal?"pt":"";
    e.style.cssText="width:"+sz.toFixed(1)+"px;height:"+sz.toFixed(1)+"px;left:"+(Math.random()*100).toFixed(1)+"%;"+
      "bottom:"+(-10-Math.random()*20).toFixed(0)+"px;"+
      "animation-duration:"+(7+Math.random()*6).toFixed(1)+"s;animation-delay:"+(Math.random()*4.5).toFixed(2)+"s";
    frag.appendChild(e);
  }
  dust.appendChild(frag);

  /* 天数 */
  var ex="2027-01-09";try{ex=localStorage.getItem("klara-b1-exam")||ex;}catch(e){}
  var d=new Date(),td=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  var N=Math.round((new Date(ex+"T12:00:00")-new Date(td+"T12:00:00"))/86400000);
  var numEl=document.getElementById("spNum");

  var SAY=["女配的剧本，是她自己写的。",
           "没有谁的气运是命里就有的。",
           "你不是在等那一天。你在造那一天。",
           "今天过完，差距就定下一点。",
           "莱比锡在等你。",
           "没人看见的那些天，才是真正算数的。",
           "你走的每一步，都在把那条路踩实。"];
  var seed=parseInt(td.replace(/-/g,""),10);
  document.getElementById("spSay").textContent=
    (N===0?"就是今天。你准备了这么久。":(N<0?"考完了。等成绩的日子，我陪你等。":SAY[Math.abs(seed)%SAY.length]));

  var gone=false;
  function out(){
    if(gone)return;gone=true;
    sp.classList.add("out");
    root.classList.remove("hv-boot");
    setTimeout(function(){
      root.classList.remove("hv-splash");document.body.classList.remove("hv-splash");
      if(sp.parentNode)sp.parentNode.removeChild(sp);
      try{if(window.hvRenderHome)hvRenderHome();}catch(e){}
    },980);
  }
  sp.addEventListener("click",out);
  sp.addEventListener("touchstart",out,{passive:true});

  /* 等主线程闲下来再开始跑动画，避免被首次渲染卡住 */
  function start(){
    if(sp.classList.contains("go"))return;
    sp.classList.add("go");
    if(N<0){numEl.textContent="—";}
    else{
      var dur=1700,t0=null;
      function step(ts){
        if(!t0)t0=ts;
        var k=Math.min((ts-t0)/dur,1);
        var e=1-Math.pow(1-k,4);
        numEl.textContent=Math.round(N*e);
        if(k<1)requestAnimationFrame(step);
      }
      setTimeout(function(){requestAnimationFrame(step);},3150);
    }
    setTimeout(out,6950);
  }
  function whenIdle(){
    var go=function(){requestAnimationFrame(function(){requestAnimationFrame(start);});};
    if(window.requestIdleCallback)requestIdleCallback(go,{timeout:1400});
    else setTimeout(go,700);
  }
  if(document.readyState==="complete")setTimeout(whenIdle,120);
  else window.addEventListener("load",function(){setTimeout(whenIdle,120);});
  setTimeout(start,2600); /* 兜底：再卡也得开演 */
})();

/* 开屏底图：一键设置 */
window.hvSetSplashBg=function(){
  var inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(ev){
      var img=new Image();
      img.onload=function(){
        var W=900,H=Math.round(img.height*W/img.width);
        if(H>1600){H=1600;W=Math.round(img.width*H/img.height);}
        var c=document.createElement("canvas");c.width=W;c.height=H;
        c.getContext("2d").drawImage(img,0,0,W,H);
        var data=c.toDataURL("image/jpeg",0.78);
        try{localStorage.setItem("klara-splash-bg",data);
          if(typeof flash==="function")flash("🖼️ 开屏底图已设置，下次打开生效","earn");
        }catch(er){if(typeof flash==="function")flash("❌ 图片太大，存不下","fail");}
      };
      img.src=ev.target.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
};
window.hvClearSplashBg=function(){
  try{localStorage.removeItem("klara-splash-bg");}catch(e){}
  if(typeof flash==="function")flash("已恢复默认开屏底图","earn");
};
</script>

(function(){
  var APP_BUILD="2026-10-10-30";
  window.APP_BUILD=APP_BUILD;

  function banner(remote,note){
    if(document.getElementById("hvUpd"))return;
    var d=document.createElement("div");d.id="hvUpd";
    d.innerHTML='<div class="ic">\u2728</div><div class="tx"><b>\u6709\u65b0\u7248\u672c</b>'+
      '<span>'+(note?String(note).replace(/[<>]/g,""):"\u70b9\u4e00\u4e0b\u66f4\u65b0")+'</span></div>'+
      '<button onclick="hvApplyUpdate(\''+String(remote).replace(/[^\w\-.]/g,"")+'\')">\u66f4\u65b0</button>'+
      '<button class="x" onclick="this.parentNode.classList.remove(\'on\')">\u7a0d\u540e</button>';

    }catch(e){}

    setTimeout(function(){location.replace(base+"?v="+encodeURIComponent(v||Date.now()));},180);

    "我不怕跑得快的人，我怕一直不停的人。"
  ];
  /* 你领先：她开始失态、找借口 */
  var F_BEHIND=[
    "这两天状态不太好，先缓一缓。",
    "今天没去实验室。有些事比进度重要。",

  /* 用「差距折合成她几天的产出」来判定，而不是绝对分数 —— 绝对分数在刚起步
     的那几周永远够不着门槛。days 为负表示你落后。 */
  function feedState(){
    var r=null;try{r=S.fx&&S.fx.rival;}catch(e){}
    if(!r||r.retired)return null;
    var rate=Math.max(r.rate||20,10);

    if(days<=-0.6)return{k:"far", pool:F_FAR_AHEAD,quiet:false,tag:"她今天很高调"};
    if(days>=4)   return{k:"sil", pool:F_SILENT,   quiet:true, tag:"她安静很久了"};
    if(days>=0.6) return{k:"beh", pool:F_BEHIND,   quiet:false,tag:"她开始慌了"};
    return{k:"close",pool:F_CLOSE,quiet:false,tag:"你咬得很紧"};
  }

  function feedHtml(){

  /* 插在挑衅语之后，不改动原有渲染逻辑 */
  function mountFeed(){

     改成盯着任务页的 DOM：对手卡一出现就往里插，跟加载顺序彻底脱钩。 */
  var feedBusy=false;
  function watchFeed(){
    var host=document.getElementById("content-tasks");
    if(!host){setTimeout(watchFeed,500);return;}
    try{

      });

    }catch(e){}
    mountFeed(); rvAvApply();

    setInterval(function(){mountFeed();rvAvApply();mountNpcFeed();pityLine();mountTrophy();swapRope();artLockApply();
      if(typeof seizHuntWatch==="function")seizHuntWatch();

  /* ══════════ 8 · 扭蛋保底 ══════════
     召回券原生概率 4%，没有保底，可能几十次不出。
     加一条：连续 20 次没出召回券，第 20 次必出。 */
  var PITY_MAX=20;

  /* fx() 不是全局函数，够不着；但它返回的就是 S.fx，直接用 */
  function pityState(){
    try{
      if(typeof S==="undefined"||!S)return null;
      S.fx=S.fx||{};
      var f=S.fx;
      f.recalls=f.recalls||0;
      f.swaps=f.swaps||0;
      f.pity=f.pity||{recall:0};
      if(typeof f.pity.swap!=="number")f.pity.swap=f.pity.recall||0;
      return f;
    }catch(e){return null;}
  }

  var myFxSpin=function(){
    var f=pityState();
    var before=f?(f.recalls||0):0;
    var forced=false;
    if(f&&f.pity.swap>=PITY_MAX-1)forced=true;
    try{_origSpin.apply(this,arguments);}catch(e){return;}
    var g=pityState(); if(!g)return;
    {
      g.pity.swap=(g.pity.swap||0)+1;
      if(forced||g.pity.swap>=PITY_MAX){
        g.swaps=(g.swaps||0)+1;
        g.pity.swap=0;
        setTimeout(function(){
          try{flash("\ud83d\udd01 \u4fdd\u5e95\u89e6\u53d1\uff1a\u6362\u4eba\u5238 +1","earn");}catch(e){}
          try{if(typeof renderFx==="function")renderFx();}catch(e){}
        },1400);
      }
    }
    try{saveState();}catch(e){}
    setTimeout(pityLine,120);
  };
  var _origSpin=null;

  function pityLine(){
    try{
      var btn=document.querySelector('button[onclick="fxSpin()"]');
      if(!btn)return;
      var f=pityState(); if(!f)return;
      var left=Math.max(0,PITY_MAX-(f.pity.swap||0));
      var el=btn.parentNode.querySelector(".fx-pity");
      var txt="\ud83d\udd01 \u6362\u4eba\u5238\u4fdd\u5e95\uff1a\u8fd8\u5dee "+left+" \u6b21\u5fc5\u51fa\uff08\u5df2\u6301\u6709 "+(f.swaps||0)+" \u5f20\uff09";
      if(!el){
        btn.insertAdjacentHTML("afterend",
          '<div class="fx-pity">'+txt+'<div class="fx-pbar"><i style="width:'+
          Math.round((PITY_MAX-left)/PITY_MAX*100)+'%"></i></div></div>');
      }else{
        el.firstChild.nodeValue=txt;
        var b=el.querySelector("i"); if(b)b.style.width=Math.round((PITY_MAX-left)/PITY_MAX*100)+"%";
      }
    }catch(e){}
  }



  /* ══════════ 10 · 掠夺战况 ══════════ */
  var RV_DE={de_vocab:8,de_grammar:10,de_friends:10,de_speak:12,de_listen:8,de_write:12,
             de_read:10,de_shadow:6,de_mistakes:6,de_mock:15,de_level:200};
  var RV_FAT={diet_meal:8,exercise:10,badminton:12,no_snack:5,no_takeout:3,stretch:3,dance_t:5};

  function dayPts(day,tbl){
    try{
      var list=(S.dailyTasks&&S.dailyTasks[day])||[],sum=0;
      for(var i=0;i<list.length;i++){
        var id=list[i]; if(!(id in tbl))continue;
        var t=(typeof findTaskDef==="function")?findTaskDef(id):null;
        sum+=(t&&t.pts)?t.pts:tbl[id];
      }
      return sum;
    }catch(e){return 0;}
  }
  function dayAll(day){
    var t={}; for(var k in RV_DE)t[k]=RV_DE[k]; for(var k2 in RV_FAT)t[k2]=RV_FAT[k2];
    return dayPts(day,t);
  }

  /* 减脂独立战线：只看减脂任务，有自己的日均和连胜连败 */
  function fatRate(){
    var d=tds(),arr=[];
    for(var i=1;i<=14;i++){var g=dayPts(addD(d,-i),RV_FAT);if(g>0)arr.push(g);}
    if(arr.length<3)return 10;
    arr.sort(function(a,b){return a-b;});
    var mid=arr.length%2?arr[(arr.length-1)/2]:(arr[arr.length/2-1]+arr[arr.length/2])/2;
    return Math.max(10,Math.min(40,Math.round(mid*0.9)));
  }

  /* 近 N 天战况：赢=当天得分 >= 她的日均 */
  function warDays(n,tbl,rate){
    var d=tds(),out=[];
    for(var i=n-1;i>=0;i--){
      var day=addD(d,-i), got=dayPts(day,tbl);
      out.push({day:day,got:got,rate:rate,win:got>=rate,today:i===0});
    }
    return out;
  }
  function loseStreak(rows){
    var n=0;
    for(var i=rows.length-1;i>=0;i--){
      if(rows[i].today&&!rows[i].win)continue;   /* 今天还没过完，不算输 */
      if(rows[i].win)break; n++;
    }
    return n;
  }
  function fatStreak(){
    var r=fatRate(), rows=warDays(14,RV_FAT,r), win=0, lose=0;
    for(var i=rows.length-1;i>=0;i--){
      if(rows[i].today)continue;
      if(rows[i].win){ if(lose)break; win++; } else { if(win)break; lose++; }
    }
    return {rate:r,win:win,lose:lose,rows:rows};
  }

  /* ══════════ 11 · 战利品柜 ══════════ */
  function trophies(){
    var r=null;try{r=S.fx&&S.fx.rival;}catch(e){}
    if(!r||r.retired)return null;
    var rate=r.rate||20, rows=warDays(21,(function(){var t={};for(var k in RV_DE)t[k]=RV_DE[k];for(var k2 in RV_FAT)t[k2]=RV_FAT[k2];return t;})(),rate);
    var lost=[],backs=[];
    rows.forEach(function(x){
      if(x.today)return;
      if(x.win)backs.push({day:x.day,n:x.got-rate});
      else lost.push({day:x.day,n:rate-x.got});
    });
    lost.sort(function(a,b){return b.n-a.n;});
    return {lost:lost,backs:backs,rate:rate,
            total:lost.reduce(function(s,x){return s+x.n;},0),
            took:backs.reduce(function(s,x){return s+x.n;},0)};
  }

  function md(day){return day.slice(5).replace("-","/");}

  function trophyHtml(){

    var x='<div class="rv-loot"><div class="lt-hd">🏴 对手的战利品柜</div>';

    x+=seizHtml();
    if(t.took>0)x+='<div class="lt-back">↩ 你已经从她柜子里夺回 <b>'+t.took+'</b> 点</div>';
    var f=fatStreak();
    x+='<div class="lt-fat"><span>🔥 减脂战线</span>日均线 '+f.rate+
       (f.win?('　<b class="w">连胜 '+f.win+' 天</b>'):(f.lose?('　<b class="l">连败 '+f.lose+' 天</b>'):'　持平'))+'</div>';
    x+='<div class="lt-fatbar">';
    f.rows.slice(-7).forEach(function(d){
      var h=Math.max(6,Math.min(30,Math.round(d.got/Math.max(f.rate*1.6,1)*30)));
      x+='<i class="'+(d.today?"t":(d.win?"w":"l"))+'" style="height:'+h+'px" title="'+md(d.day)+' '+d.got+' 分"></i>';
    });
    x+='<em style="bottom:'+Math.min(30,Math.round(30/1.6))+'px"></em></div>';
    return x+'</div>';
  }

  /* 累计数字（228 / 152）看不出今天打成什么样，换成昨日战报 */
  function reportHtml(){

  /* ══════════ 13 · 抢任务 ══════════
     输一天，她从你清单里拿走分值最高的一项。被占期间照做不给分、不涨属性、不喂气运。
     解锁：做完夺气运任务解一项；连赢三天全解。 */
  function seizState(){
    try{
      if(typeof S==="undefined"||!S)return null;
      S.fx=S.fx||{}; var r=S.fx.rival; if(!r||r.retired)return null;
      r.seiz=r.seiz||{list:[],done:{},settled:"",huntSeen:false};
      return r;
    }catch(e){return null;}
  }
  function scopeTbl(){var t={};for(var k in RV_DE)t[k]=RV_DE[k];for(var k2 in RV_FAT)t[k2]=RV_FAT[k2];return t;}
  function taskName(id){
    try{var t=(typeof findTaskDef==="function")?findTaskDef(id):null;return (t&&t.name)||id;}catch(e){return id;}
  }
  function seizedIds(){
    var r=seizState(); if(!r)return [];
    return r.seiz.list.map(function(x){return x.id;});
  }
  /* 挑一项下手：分值最高、还没被占的 */
  function pickVictim(){
    var tbl=scopeTbl(), got=seizedIds(), best=null;
    for(var id in tbl){
      if(got.indexOf(id)>=0)continue;
      if(id==="de_level")continue;              /* 过级那张 200 分不抢，太伤 */
      if(!best||tbl[id]>tbl[best])best=id;
    }
    return best;
  }
  /* 每天结算一次：昨天输了就抢一项；连赢三天全解 */
  function seizSettle(){
    var r=seizState(); if(!r)return;
    var d=tds(); if(r.seiz.settled===d)return;
    r.seiz.settled=d;
    var rate=r.rate||20, tbl=scopeTbl();
    var rows=warDays(5,tbl,rate).filter(function(x){return !x.today;});
    var y=rows[rows.length-1];
    /* 连赢三天 → 全解 */
    var w=0; for(var i=rows.length-1;i>=0;i--){ if(rows[i].win)w++; else break; }
    if(w>=3&&r.seiz.list.length){
      var n=r.seiz.list.length; r.seiz.list=[];
      setTimeout(function(){try{flash("\u2694 \u8fde\u8d62\u4e09\u5929\uff0c\u593a\u56de\u88ab\u5360\u7528\u7684 "+n+" \u9879\u4efb\u52a1","earn");}catch(e){}},900);
    }else if(y&&!y.win){
      var v=pickVictim();
      if(v){
        r.seiz.list.push({id:v,name:taskName(v),day:d});
        setTimeout(function(){try{flash("\ud83c\udff4 \u5ef6\u97f3\u62a2\u8d70\u4e86\u300c"+taskName(v)+"\u300d","fail");}catch(e){}},900);
      }
    }
    try{saveState();}catch(e){}
  }
  /* 夺气运任务完成 → 解一项 */
  function seizHuntWatch(){
    var r=seizState(); if(!r)return;
    var hd=!!(r.hunt&&r.hunt.done&&r.hunt.date===tds());
    if(hd&&!r.seiz.huntSeen){
      r.seiz.huntSeen=true;
      if(r.seiz.list.length){
        var x=r.seiz.list.shift();
        try{flash("\u2694 \u593a\u56de\u300c"+x.name+"\u300d","earn");}catch(e){}
      }
      try{saveState();}catch(e){}
    }
    if(!hd&&r.seiz.huntSeen&&r.hunt&&r.hunt.date!==tds()){r.seiz.huntSeen=false;}
  }
  /* 拦住 doTask：被占的任务照做，不记账 */
  var _origDoTask=null;
  var myDoTask=function(id,name,pts,em,praise,attrMap){
    var r=seizState();
    if(r&&seizedIds().indexOf(id)>=0){
      var d=tds();
      r.seiz.done[d]=r.seiz.done[d]||[];
      if(r.seiz.done[d].indexOf(id)<0)r.seiz.done[d].push(id);
      try{saveState();}catch(e){}
      try{flash("\u2694\ufe0f \u8fd9\u9879\u88ab\u5ef6\u97f3\u5360\u7740\u3002\u4f60\u505a\u4e86\uff0c\u4f46\u8d26\u4e0d\u8bb0\u4f60\u5934\u4e0a\u3002","fail");}catch(e){}
      try{if(typeof render==="function")render();}catch(e){}
      setTimeout(mountTrophy,200);
      return;
    }
    return _origDoTask.apply(this,arguments);
  };

  function seizHtml(){
    var r=seizState(); if(!r)return "";
    var x="";
    if(r.seiz.list.length){
      x+='<div class="lt-seiz"><div class="sz-hd">\u2694\ufe0f \u88ab\u5979\u5360\u7528\u7684\u4efb\u52a1</div>';
      r.seiz.list.forEach(function(it){
        x+='<div class="sz-i"><span class="sz-n">'+esc(it.name)+'</span><span class="sz-d">'+md(it.day)+' \u8d77</span></div>';
      });
      x+='<div class="sz-tip">\u505a\u5b8c\u593a\u6c14\u8fd0\u4efb\u52a1\u89e3\u4e00\u9879\uff1b\u8fde\u8d62\u4e09\u5929\u5168\u89e3</div></div>';
    }
    var d=tds(), dn=(r.seiz.done[d]||[]);
    if(dn.length){

         dn.map(function(i){return esc(taskName(i));}).join("\u3001")+'</div>';

  /* ══════════ 14 · 临时品级（只认减脂战线） ══════════
     减脂连胜 7 天临时升一档，连败 7 天临时降一档。
     只改显示，不动 S.rank.idx —— 你真实的品级进度一个字节都不变。 */
  function tierShift(){
    try{
      var f=fatStreak();
      if(f.win>=7)return 1;

     再加上现实里的凭证，才算彻底抢光。 */
  var SEASONS=[
    {n:1,goal:"收到德国 Ausbildung 录取",key:"aus"},
    {n:2,goal:"考上医学院",key:"med"},
    {n:3,goal:"拿到行医资格",key:"appro"}

  function ropeState(){
    try{
      if(typeof S==="undefined"||!S)return null;
      S.fx=S.fx||{}; var r=S.fx.rival; if(!r)return null;
      r.rope=r.rope||{v:50,settled:"",hold:0,final:false,milestone:false,
                      season:1,won:[],truceUntil:"",peak:0};
      if(!r.rope.peak)r.rope.peak=r.rate||20;
      return r;
    }catch(e){return null;}
  }
  function seasonNow(){
    var r=ropeState(); if(!r)return SEASONS[0];
    return SEASONS[Math.min(r.rope.season-1,SEASONS.length-1)];
  }
  /* 每天结算一次：按昨天跑赢/跑输的幅度，把绳子往一边推 */
  function ropeSettle(){
    var r=ropeState(); if(!r||r.retired)return;
    var d=tds(), rp=r.rope;
    if(rp.settled===d)return;
    rp.settled=d;
    if(rp.truceUntil&&rp.truceUntil>d){try{saveState();}catch(e){} return;}  /* 休战期不打 */
    if(rp.truceUntil&&rp.truceUntil<=d&&rp.truceUntil!==""){
      /* 休战结束，她以更强的样子回来 */
      rp.truceUntil="";
      r.rate=Math.max(rp.peak, Math.round((r.rate||20)*1.15));
      rp.v=50; rp.hold=0; rp.final=false; rp.milestone=false;
      setTimeout(function(){try{flash("\ud83c\udff4 \u5ef6\u97f3\u56de\u6765\u4e86\u3002\u65e5\u5747 "+r.rate+"\u3002","fail");}catch(e){}},1000);
    }
    var rate=r.rate||20, tbl={};
    for(var k in RV_DE)tbl[k]=RV_DE[k]; for(var k2 in RV_FAT)tbl[k2]=RV_FAT[k2];
    var got=dayPts(addD(d,-1),tbl);
    var pct=(got-rate)/Math.max(rate,1);
    var mv=Math.max(-3,Math.min(3,Math.round(pct*20)/10));
    rp.v=Math.max(0,Math.min(100,Math.round((rp.v+mv)*10)/10));
    if(got>rate&&rate>rp.peak)rp.peak=rate;
    /* 终局判定 */
    if(rp.v>=100&&!rp.final){rp.final=true;rp.hold=0;
      setTimeout(function(){try{flash("\u2694\ufe0f \u7ed3\u5c40\u5f00\u59cb\uff1a\u8fde\u7eed 14 \u5929\u4e0d\u8dcc\u56de 95%","earn");}catch(e){}},1000);}
    if(rp.final){ if(rp.v>=95)rp.hold++; else {rp.hold=0;rp.final=rp.v>=100;} }
    try{saveState();}catch(e){}
  }

    tuyouyou:{n:"屠呦呦",c:"#7e9a86",posts:[
      "第 190 次失败。记录写完了，明天换一个温度。",

    musk:{n:"马斯克",c:"#6f7d8c",posts:[
      "第四次炸了。零件捡回来一半。第五次定在三周后。",
      "所有人都说做不到。我把时间表缩短了一半。",
      "今天发了一条明知道会被骂的。骂吧。东西我照做。",
      "你要做的是把问题拆到最底下那一层，然后从那儿开始算。",
      "被拒绝了三次。第四次我换了个说法，成了。",
      "今天睡在工厂地板上。不是表演，是回家来回两小时。",
      "有人问我怕不怕失败。失败是预算里的一项，怕它干嘛。",

      "有人问我为什么不找个轻松点的活。轻松的活我干不了，会死。",
      "失败了就公开说失败了。藏着的人才永远学不会。",
      "今天被嘲笑的那个想法，五年后会有人说「这不是显而易见的吗」。",
      "不要问专家行不行。专家只知道过去行不行。",
      "每天多做一点，一年之后差距是倍数，不是加法。",
      "我不怕看起来像个傻子。我怕我一辈子都是对的，但什么都没做成。",
      "今天改了三遍方案。第三遍终于比第一遍简单。",
      "时间表定得太宽松，人就会把它填满。定紧一点。",

    xiayizhou_w:{n:"夏以昼的爱人",c:"#7f8fa6",posts:[
      "他出任务那几天，家里的灯我照常开到十一点。不是等，是我本来就这个点睡。",

    lishen_w:{n:"黎深的爱人",c:"#6e8aa0",posts:[
      "他台上站了七个小时，下来第一句话是问我吃了没。我说吃了。其实没有。后来吃了。",

      "学了心脏的四个腔，德语拉丁一起背。背到第三遍才顺。",
      "他很少夸人。昨天看了我的本子，只说了一句「这个记法对」。我高兴了一整天。",
      "冷静不是天生的。是练出来的——情绪上来的时候先不说话，等十分钟。",
      "他说医生最怕的不是难，是乱。所以我先把桌子收干净。"]},
    qiyu_s:{n:"祁煜的妹妹",c:"#9b8ab8",posts:[
      "他画画的时候颜料甩了一桌子，画完人就跑了。拖地的是我。",
      "今天替他洗了碗。他说下次一定自己来。这句话我听了四百遍。",
      "他房间乱得像被抄过家，我收拾到一半找到三支没盖帽的笔。",
      "我也画了两笔。画得很丑。他凑过来看了一眼，没笑话我，说挺好。",
      "他把我的橡皮弄丢了，赔了我一整盒。多余的那些我没还。",
      "全世界都觉得他有才华。只有我知道他袜子乱扔。",
      "他说以后要开画展。我说好啊，到时候我负责扫地。",
      "放学路上他走在前面，回头看我有没有跟上。每次都回头。"]},
    wonyoung:{n:"张元英",c:"#cfa8b8",posts:[
      "面包在我前面被买完了。所以我拿到了刚出炉的那一炉。运气女神还是站我这边。",

      "今天被拍到的角度不好看。那就练到哪个角度都好看。",
      "我妈给我起英文名的时候取自胜利女神。她大概早就知道我得一直赢。",
      "努力一定会以某种形式回来，像回旋镖一样。没回来只是还没到时候。",
      "节食那天最难熬的是晚上十点。我喝了水，睡了。醒来发现也没多难。",
      "练舞练到脚底板疼。但舞台上那三分钟，疼不疼没人看得出来。",
      "好看不是天生的那部分，是我每天重复的那部分。",
      "今天拍到不好看的照片被发出来了。那就下次更好看。",
      "早上五点起来练，镜子里的人还没醒。练到第三遍她才醒。",
      "有人说我运气好。运气好的人也得天天准时到练习室。",
      "今天胃不舒服，还是把舞跳完了。跳完反而好了。",
      "我不跟任何人比。我只跟上个月的我比。",
      "被说不自然。那就练到自然为止，没别的办法。",
      "今天在车上睡着了，醒来发现头发压扁了，重新弄了一遍才下车。",
      "喜欢我的人那么多，我总不能敷衍他们。",
      "心情不好的时候我会先把脸洗干净。洗完感觉世界清楚了一点。",
      "今天的我也很棒。这句话我每天对自己说，说久了就真了。",
      "台上三分钟，台下我练了一百二十遍。这个比例我觉得很公平。",
      "不顺的事当然有。但我选择先看今天顺的那部分。"]}

      Object.keys(MEN).forEach(function(mk){

        if(!hit)return;
        var ms=seedOf(d+"|man|"+mk);

    try{
      S.fx=S.fx||{}; S.fx.cut=S.fx.cut||{};
      var THRESH={m_xy:6,m_ls:4,m_qy:3};
      var CUTLINE={
        m_xy:["夏以昼那边六天没人接航线了。我今天上了舰桥，风很大，外套是他的。",
              "执舰官今天问起一个人。我说她最近好像挺忙的。然后我们就聊别的了。"],
        m_ls:["黎医生的观摩位空了好几天。我坐了。怎么，空着的位置还能是谁的吗？",
              "他递过来一副手套，我接了。手稳不稳，是看谁天天练。"],
        m_qy:["祁煜今天等了很久没等到人，就跟我一起走了。路上他话特别多。",
              "他房间还是那么乱。这回是我收的。"]};
      var BACKLINE={m_xy:"执舰官今天没理我。",m_ls:"观摩位又不是我的名字了。",m_qy:"祁煜今天跑得比谁都快。"};
      var _all=[];for(var _k in MEN)_all.push(_k);
      var _r=(typeof rv==="function")?rv():null;
      var _cutNow=[],_backNow=[],_cutCount=0;
      _all.forEach(function(mk){
        var st=S.fx.cut[mk]=S.fx.cut[mk]||{cut:false,since:"",seen:""};
        var trig=MEN[mk].trig, gap=99;
        for(var i=0;i<=20;i++){
          var dd=addD(d,-i), done=(S.dailyTasks&&S.dailyTasks[dd])||[];
          if(trig.some(function(t){return done.indexOf(t)>=0;})){gap=i;break;}
        }
        if(gap===0&&st.cut){st.cut=false;st.since="";_backNow.push(mk);if(_r)_r.mine+=3;}
        else if(gap>=THRESH[mk]&&!st.cut){st.cut=true;st.since=d;_cutNow.push(mk);if(_r)_r.hers+=3;}
        if(st.cut)_cutCount++;
      });
      if(_cutCount===3&&S.fx.cutAll!==d){
        S.fx.cutAll=d; if(_r)_r.hers+=5;
        out.push({id:"yanyin",name:rvName(),color:"#9b8ab8",rival:true,
          text:"夏以昼带我上了舰桥。黎医生给我留了观摩位。祁煜在校门口等我。——哦对，她那边好像六天没动静了，还好吗？",
          hh:21,mm:11});
      }
      _cutNow.forEach(function(mk,i){
        var pl=CUTLINE[mk], cs=seedOf(d+"|cut|"+mk);
        out.push({id:"yanyin",name:rvName(),color:"#9b8ab8",rival:true,
          text:pl[cs%pl.length], hh:19+(i%3), mm:cs%60});
      });
      _backNow.forEach(function(mk,i){
        out.push({id:"yanyin",name:rvName(),color:"#9b8ab8",rival:true,quiet:true,
          text:BACKLINE[mk], hh:20+(i%3), mm:(i*17)%60});
      });
      if(_cutNow.length||_backNow.length)saveState();
    }catch(e){}

    /* 对手按气运差决定语气，发不发看当天种子 */
    var st=feedState();
    if(st && (base%4)!==0){
      var pool=YY_PYQ[st.k==="far"?"far":(st.k==="sil"?"sil":(st.k==="beh"?"beh":"close"))];
      var ys=seedOf(d+"|yypyq|"+st.k);
      /* 两处语料有重叠，撞上就往后挪，保证对手同一天不会说两遍同一句 */
      var cardTxt=pick(st.pool,seedOf(d+"|yy|"+st.k));
      var idx=ys%pool.length;
      for(var g=0;g<pool.length&&pool[idx]===cardTxt;g++)idx=(idx+1)%pool.length;
      out.push({id:"yanyin",name:rvName(),color:"#9b8ab8",rival:true,quiet:st.k==="sil",
        text:pool[idx], hh:8+(ys%14), mm:ys%60});
    }
    /* 到点才出现，按时间倒序 */
    var now=new Date(), cur=now.getHours()*60+now.getMinutes();
    out.sort(function(a,b){return (a.hh*60+a.mm)-(b.hh*60+b.mm);});
    var due=out.filter(function(o){return o.hh*60+o.mm<=cur;});
    /* 一条都还没到点的话，至少把最早那条放出来，别空着 */
    if(!due.length&&out.length)due=[out[0]];
    due.sort(function(a,b){return (b.hh*60+b.mm)-(a.hh*60+a.mm);});
    return due;
  }

    happy:["它尾巴摇得很快。","它在你腿边绕了两圈。","它呼噜呼噜的。"],
    love :["它整只趴到你身上了。","它觉得你最近很厉害。","它把头埋进你怀里。"]
  };

  function moodNow(){
    var h=new Date().getHours();
    if(h>=0&&h<5)return "sleep";
    if(missedYesterday())return "sulk";
    var n=streak();
    if(n>=7)return "love";
    if(n>=3)return "happy";
    return "ok";
  }

  /* ── 行为状态机 ── */
  var CAT={el:null,inner:null,bub:null,x:20,dir:1,mood:"ok",act:"sit",
           t:0,frame:0,held:0,raf:0,lastTs:0,bubT:null};

  function catBounds(){
    var st=document.getElementById("hvStage");
    var w=st?st.clientWidth:360;
    return {min:12,max:Math.max(40,Math.min(w-78,w*0.52))};
  }

  function drawCat(){
    if(!CAT.inner)return;
    var m=CAT.mood, a=CAT.act, html;
    if(a==="front")       html=sprite(FRONT,m,16,16);
    else if(m==="sulk")   html=sprite(BACK,m,16,16);
    else if(a==="walk")   html=sprite(CAT.frame?SIDE_B:SIDE_A,m,20,13);
    else if(a==="lick")   html=sprite(SIDE_LICK,m,20,13);
    else                  html=sprite(SIDE_SIT,m,20,13);
    CAT.inner.innerHTML=html;
    /* 朝左走时整只翻过来 */
    var flip=(a!=="front"&&m!=="sulk"&&CAT.dir<0)?" flip":"";
    var wag=(a!=="walk"&&(m==="happy"||m==="love"))?" wag":"";
    CAT.inner.className="ct-in"+flip+wag;
    CAT.el.style.transform="translateX("+Math.round(CAT.x)+"px)";
    if(CAT.bub)CAT.bub.style.transform="translateX("+Math.round(CAT.x)+"px)";
  }

  /* 挑下一个动作 */
  function nextAct(){
    var m=CAT.mood;
    if(m==="sleep"||m==="sulk"){CAT.act="sit";CAT.held=9999;return;}
    var r=Math.random();
    if(CAT.act==="walk"){
      CAT.act=(r<0.35)?"lick":"sit";
      CAT.held=1400+Math.random()*2600;
    }else{
      if(r<0.62){
        CAT.act="walk";
        var b=catBounds();
        /* 快走到边了就掉头 */
        if(CAT.x<=b.min+6)CAT.dir=1;
        else if(CAT.x>=b.max-6)CAT.dir=-1;
        else if(Math.random()<0.35)CAT.dir=-CAT.dir;
        CAT.held=1800+Math.random()*2800;
      }else{
        CAT.act=(r<0.8)?"lick":"sit";
        CAT.held=1500+Math.random()*2500;
      }
    }
  }

  function tick(ts){
    CAT.raf=requestAnimationFrame(tick);
    if(!CAT.el||!document.body.contains(CAT.el))return;
    var dt=CAT.lastTs?Math.min(ts-CAT.lastTs,120):16; CAT.lastTs=ts;
    CAT.held-=dt; CAT.t+=dt;
    if(CAT.act==="walk"){
      var b=catBounds();
      CAT.x+=CAT.dir*dt*0.022;              /* 约 22px/秒，慢悠悠 */
      if(CAT.x<b.min){CAT.x=b.min;CAT.dir=1;}
      if(CAT.x>b.max){CAT.x=b.max;CAT.dir=-1;}
      CAT.pawD=(CAT.pawD||0)+Math.abs(CAT.dir*dt*0.022);
      if(CAT.pawD>15){CAT.pawD=0;dropPaw(CAT.x+(CAT.dir>0?16:40),CAT.dir<0);}
      if(CAT.t>190){CAT.t=0;CAT.frame=CAT.frame?0:1;drawCat();}
      else CAT.el.style.transform="translateX("+Math.round(CAT.x)+"px)";
      if(CAT.bub)CAT.bub.style.transform="translateX("+Math.round(CAT.x)+"px)";
    }
    if(CAT.held<=0){nextAct();CAT.t=0;drawCat();}
  }

  window.hvPetCat=function(){
    if(!CAT.el)return;
    CAT.act="front"; CAT.held=3200; CAT.t=0;
    CAT.inner.classList.remove("bop"); void CAT.inner.offsetWidth; CAT.inner.classList.add("bop");
    drawCat();
    var arr=SAY[CAT.mood]||SAY.ok;
    CAT.bub.textContent=arr[Math.floor(Math.random()*arr.length)];
    CAT.bub.classList.add("on");
    clearTimeout(CAT.bubT);
    CAT.bubT=setTimeout(function(){CAT.bub.classList.remove("on");},2800);
  };

  function mountCat(){
    mountCast();
    bindHold();
    buildPetals();
    try{
      var st=document.getElementById("hvStage"); if(!st)return;
      var keepX=CAT.el?CAT.x:null;
      var o1=document.getElementById("hvCat"); if(o1)o1.remove();
      var o2=document.getElementById("hvCatBub"); if(o2)o2.remove();
      st.insertAdjacentHTML("beforeend",
        '<div class="hv-cat" id="hvCat" onclick="hvPetCat()"><div class="ct-in"></div></div>'+
        '<div class="hv-catbub" id="hvCatBub"></div>');
      CAT.el=document.getElementById("hvCat");
      CAT.inner=CAT.el.firstChild;
      CAT.bub=document.getElementById("hvCatBub");
      CAT.mood=moodNow();
      if(keepX===null){var b=catBounds();CAT.x=b.min+Math.random()*(b.max-b.min)*0.5;}
      else CAT.x=keepX;
      CAT.act="sit"; CAT.held=1200; CAT.frame=0; CAT.t=0;
      drawCat();
      if(!CAT.raf){CAT.lastTs=0;CAT.raf=requestAnimationFrame(tick);}
    }catch(e){}
  }


  /* ══════════ 3 · 今日属性播报 ══════════ */

  /* 宜 / 忌：按属性配，写得像签文而不是待办 */
  var YI={
    lang :["背单词","做一篇听力","跟读十分钟","啃一个语法点"],
    intel:["读书二十页","看一集纪录片","整理错题本"],
    sport:["出门走三十分钟","打一场羽毛球","跟一节 Pamela"],
    weight:["吃一顿减脂餐","不碰零食","晚饭七分饱"],
    health:["十二点前躺下","多喝两杯水","泡个脚"],
    life :["把拖着的那件事办了","收拾一个角落","自己做顿饭"],
    beauty:["认真护肤","练一遍体态","好好洗漱"],
    grace:["研究一套穿搭","练十分钟体态","化一次妆"],
    shameless:["开口要一次","把那条消息发出去","删掉「不好意思」再发"],
    will :["把今天的计划做完","别找借口"],
    anti_proc:["当天事当天做","先做最不想做的那件"],
    piano:["摸一会儿琴"],dance:["跳满一首"],drawing:["画十分钟"],
    speech:["练一次表达"],social:["主动找一个人说话"],lit:["写两百字"],
    cook_a:["学一道新菜"],creative:["做点没做过的"],villain:["拒绝一件不想做的事"],
    sing:["练一会儿声"]
  };
  var JI=["刷手机到忘记时间","点外卖","熬夜","说「算了」","跟自己过不去",
          "刷别人的朋友圈","一边学一边看手机","睡前翻购物软件","跟自己比昨天以外的人"];

  function castPick(){
    var best=null;
    try{
      ATTRS.forEach(function(a){
        var xp=(S.attrs&&S.attrs[a.id])||0;
        var lv=getLv(xp);
        if(lv>=LVLS.length-1)return;
        var nxt=LVLS[lv+1], need=nxt-xp;
        if(!best||need<best.need)best={a:a,lv:lv,xp:xp,nxt:nxt,need:need};
      });
    }catch(e){}
    return best;
  }

  function castHtml(){
    var b=castPick();
    if(!b)return "";
    var d=tds(), sd=seedOf(d+"|cast");
    var yi=(YI[b.a.id]||["把今天的计划做完"]);
    var y=yi[sd%yi.length], j=JI[(sd>>3)%JI.length];
    var x='<div class="hv-cast">';
    x+='<div class="cs-l1">'+b.a.em+' '+esc(b.a.name)+' <b>'+b.xp+'</b> / '+b.nxt+
       '　距 Lv.'+(b.lv+1)+' 还差 <b>'+b.need+'</b> 点</div>';
    x+='<div class="cs-l2"><span class="yi">宜</span>'+esc(y)+
       '<span class="ji">忌</span>'+esc(j)+'</div>';
    return x+'</div>';
  }

  function mountCast(){
    try{
      var w=document.querySelector("#hvStage .hv-word");
      if(!w)return;
      var h=castHtml(); if(!h)return;
      if(w.getAttribute("data-cast")===tds()&&w.querySelector(".hv-cast"))return;
      var orig=w.getAttribute("data-orig");
      if(orig===null){orig=w.innerHTML;w.setAttribute("data-orig",orig);}
      w.innerHTML=h+'<div class="cs-l3">'+orig+'</div>';
      w.setAttribute("data-cast",tds());
    }catch(e){}
  }


  /* ══════════ 4 · 爪印 ══════════ */
  var PAWS=[];
  function dropPaw(x,flip){
    try{
      var st=document.getElementById("hvStage"); if(!st)return;
      if(PAWS.length>14)return;
      var d=document.createElement("div");
      d.className="hv-paw";
      d.style.transform="translateX("+Math.round(x)+"px)";
      d.style.bottom=(178+(Math.random()<0.5?0:3))+"px";
      d.innerHTML='<svg viewBox="0 0 8 8">'+
        '<ellipse cx="4" cy="5.4" rx="2.1" ry="1.7"/>'+
        '<circle cx="1.9" cy="2.6" r="0.78"/><circle cx="4" cy="1.9" r="0.82"/><circle cx="6.1" cy="2.6" r="0.78"/>'+
        '</svg>';
      st.appendChild(d); PAWS.push(d);
      setTimeout(function(){try{d.remove();}catch(e){}
        var i=PAWS.indexOf(d); if(i>=0)PAWS.splice(i,1);},2400);
    }catch(e){}
  }

  /* 花瓣层：只建一次，靠 #hvStage.peek 控制显隐 */
  function buildPetals(){
    try{
      var st=document.getElementById("hvStage"); if(!st)return;
      if(st.querySelector(".hv-petals"))return;
      var w=document.createElement("div"); w.className="hv-petals";
      var COL=["rgba(238,198,214,.72)","rgba(245,219,230,.68)",
               "rgba(226,214,240,.62)","rgba(255,255,255,.60)"];
      var h="";
      for(var i=0;i<28;i++){
        var sz=(4+Math.random()*7).toFixed(1);
        var lf=(Math.pow(Math.random(),1.5)*72).toFixed(1);   /* 贴着图的那侧更密 */
        var tp=(Math.random()*96).toFixed(1);
        h+='<i style="width:'+sz+'px;height:'+sz+'px;left:'+lf+'%;top:'+tp+'%;'+
           'background:'+COL[i%COL.length]+';'+
           'animation-duration:'+(5.5+Math.random()*6).toFixed(1)+'s;'+
           'animation-delay:'+(Math.random()*7).toFixed(2)+'s"></i>';
      }
      w.innerHTML=h; st.appendChild(w);
    }catch(e){}
  }

  /* ══════════ 5 · 按住立绘看大美 ══════════ */
  function bindHold(){
    try{
      var img=document.querySelector("#hvStage .hv-art");
      if(!img||img.getAttribute("data-hold"))return;
      img.setAttribute("data-hold","1");
      var st=document.getElementById("hvStage");
      var lab=document.getElementById("hvHoldLab");
      if(!lab){
        st.insertAdjacentHTML("beforeend",'<div class="hv-holdlab" id="hvHoldLab"></div>');
        lab=document.getElementById("hvHoldLab");
      }
      var tmr=null,held=false,orig="",DM=null,saved=null;
      function damei(){try{return (S.rank&&S.rank.art&&S.rank.art.damei)||"";}catch(e){return "";}}
      /* 预读大美那张，拿到原始宽高，长按时才能算准矩形 */
      (function(){
        var a=damei(); if(!a)return;
        var pre=new Image();
        pre.onload=function(){DM={w:pre.naturalWidth,h:pre.naturalHeight};};
        pre.src=a;
      })();

      function start(){
        clearTimeout(tmr);
        tmr=setTimeout(function(){
          held=true;
          var a=damei();
          if(a&&artSeized()){
            lab.textContent="\ud83c\udff4 \u5927\u7f8e\u88ab\u5ef6\u97f3\u5360\u7528\u4e2d \u00b7 \u8fde\u8d62\u4e09\u5929\u593a\u56de";
            lab.classList.add("on"); held=true; return;
          }
          if(a){
            orig=img.getAttribute("src");
            img.style.opacity="0";
            setTimeout(function(){
              img.setAttribute("src",a);img.classList.add("fit");
              st.classList.add("peek");img.style.opacity="1";
            },170);
            lab.textContent="大美 · 你要成为的样子";
          }else{
            lab.textContent="还没上传「大美」立绘";
          }
          lab.classList.add("on");
        },340);
      }
      function end(){
        clearTimeout(tmr);
        if(!held)return;
        held=false;
        lab.classList.remove("on");
        if(orig){
          img.style.opacity="0";
          var o=orig; orig="";
          st.classList.remove("peek");
          setTimeout(function(){
            img.setAttribute("src",o);img.classList.remove("fit");img.style.opacity="1";
          },170);
        }
        /* 松手那一下不要误触发跳转 */
        var kill=function(e){e.stopPropagation();e.preventDefault();img.removeEventListener("click",kill,true);};
        img.addEventListener("click",kill,true);
        setTimeout(function(){img.removeEventListener("click",kill,true);},400);
      }
      img.addEventListener("pointerdown",start);
      ["pointerup","pointercancel","pointerleave"].forEach(function(ev){img.addEventListener(ev,end);});
      img.addEventListener("contextmenu",function(e){e.preventDefault();});
      img.addEventListener("dragstart",function(e){e.preventDefault();});
      img.addEventListener("selectstart",function(e){e.preventDefault();});
      try{img.setAttribute("draggable","false");}catch(e){}
    }catch(e){}
  }

  var _hr=window.hvRenderHome;
  if(typeof _hr==="function"){
    window.hvRenderHome=function(){_hr.apply(this,arguments);mountCat();};
  }else{
    var tries=0,iv=setInterval(function(){
      tries++;
      if(typeof window.hvRenderHome==="function"){
        clearInterval(iv);
        var f=window.hvRenderHome;
        window.hvRenderHome=function(){f.apply(this,arguments);mountCat();};
        mountCat();
      }
      if(tries>60)clearInterval(iv);
    },300);
  }
  /* 补偿和保底进度条要等 PITY_MAX 赋值之后再跑 */
  /* 这些都得等上面各节的变量赋值完成之后再跑 */
  setTimeout(function(){
    if(typeof window.doTask==="function"&&window.doTask!==myDoTask){
      _origDoTask=window.doTask; window.doTask=myDoTask;
    }
    try{window.__rvTierShift=tierShift;window.__rvArtSeized=artSeized;}catch(e){}
    /* 钩子挂上之后主页已经画过一遍了，重画一次让临时品级生效 */
    try{if(typeof window.hvRenderHome==="function")window.hvRenderHome();}catch(e){}
    pityCompensate();pityLine();seizSettle();seizHuntWatch();ropeSettle();ropeWinCheck();mountTrophy();swapRope();artLockApply();
  },1200);
  setTimeout(mountCat,2200);
  setTimeout(mountFeed,2400);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){setTimeout(boot,900);});
else setTimeout(boot,900);
})();
</script>
