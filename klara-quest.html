<!doctype html><html lang="zh"><head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>克拉拉养成计划</title>
<style>
html,body{height:100%;margin:0;background:linear-gradient(165deg,#f5eff0,#e6e2ee);
font-family:-apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
#w{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px;box-sizing:border-box}
h1{font-size:17px;color:#5a4548;letter-spacing:2px;margin:0 0 10px;font-weight:600}
#s{font-size:12.5px;color:#8a7276;letter-spacing:1.5px;min-height:18px;text-align:center}
#bar{width:180px;height:3px;border-radius:3px;background:#e2d9dd;margin-top:16px;overflow:hidden}
#fill{height:100%;width:0;background:#9b8ab8;transition:width .25s}
form{margin-top:22px;display:none;flex-direction:column;align-items:center}
input{width:200px;padding:9px 12px;border:1px solid #d8ccd2;border-radius:9px;background:#fff;
font-size:15px;color:#5a4548;outline:none;text-align:center}
button{margin-top:12px;padding:8px 26px;border:0;border-radius:9px;background:#9b8ab8;color:#fff;
font-size:14px;letter-spacing:2px}
#err{margin-top:10px;font-size:12px;color:#b5737d;min-height:16px}
</style></head>
<body><div id="w">
<h1>克拉拉养成计划</h1>
<div id="s">正在打开…</div>
<div id="bar"><div id="fill"></div></div>
<form id="f" onsubmit="return false"><input id="p" type="password" placeholder="密码" autocomplete="current-password"><button id="b">进入</button><div id="err"></div></form>
</div>
<script>
(function(){
"use strict";
var BUILD = "2026-10-16-4";
var SALT  = "5ea74d36cf95d52045e4cb5bc2c2b9cf";
var PKEY  = "staticrypt_passphrase";      // 沿用旧的 key，手机上存着的密码照样能用
var DBN   = "klara-quest-cache", STORE = "app";

var S = document.getElementById("s"),
    F = document.getElementById("fill"),
    FORM = document.getElementById("f"),
    PIN = document.getElementById("p"),
    BTN = document.getElementById("b"),
    ERR = document.getElementById("err");

function say(t, pct){ S.textContent = t; if(pct!=null) F.style.width = pct+"%"; }

/* ---------- IndexedDB 极简封装 ---------- */
function db(){
  return new Promise(function(res, rej){
    var r = indexedDB.open(DBN, 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore(STORE); };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
function idbGet(k){
  return db().then(function(d){
    return new Promise(function(res, rej){
      var r = d.transaction(STORE,"readonly").objectStore(STORE).get(k);
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    });
  });
}
function idbPutOnly(k, v){
  return db().then(function(d){
    return new Promise(function(res, rej){
      var tx = d.transaction(STORE,"readwrite"), os = tx.objectStore(STORE);
      var clr = os.getAllKeys();
      clr.onsuccess = function(){
        (clr.result||[]).forEach(function(old){ if(old !== k) os.delete(old); });
        os.put(v, k);
      };
      tx.oncomplete = function(){ res(true); };
      tx.onerror = function(){ rej(tx.error); };
    });
  });
}

/* ---------- 工具 ---------- */
function hexToBytes(h){
  var a = new Uint8Array(h.length/2);
  for(var i=0;i<a.length;i++) a[i] = parseInt(h.substr(i*2,2),16);
  return a;
}
var enc = new TextEncoder();

/* 和旧版完全一致的三轮哈希，只在手机上没存过密码时才会跑一次 */
function pbkdf2(pw, iter, hash){
  return crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"])
    .then(function(k){
      return crypto.subtle.deriveBits({name:"PBKDF2", hash:hash, iterations:iter, salt:enc.encode(SALT)}, k, 256);
    })
    .then(function(bits){
      var b = new Uint8Array(bits), s = "";
      for(var i=0;i<b.length;i++){ var x = b[i].toString(16); s += x.length<2 ? "0"+x : x; }
      return s;
    });
}
function hashPassword(pw){
  return pbkdf2(pw, 1000, "SHA-1")
    .then(function(h){ return pbkdf2(h, 14000, "SHA-256"); })
    .then(function(h){ return pbkdf2(h, 585000, "SHA-256"); });
}

/* ---------- 取密文 ---------- */
var binCache = null;
function getBin(){
  if(binCache) return Promise.resolve(binCache);
  say("正在取回数据…", 15);
  return fetch("app.bin?v=" + BUILD, {cache:"force-cache"})
    .then(function(r){ if(!r.ok) throw new Error("app.bin " + r.status); return r.arrayBuffer(); })
    .then(function(ab){ binCache = new Uint8Array(ab); return binCache; });
}

/* ---------- 解密：直接对字节操作，没有十六进制循环 ---------- */
function decryptWith(hashedHex){
  return getBin().then(function(bin){
    say("正在解锁…", 55);
    var iv = bin.subarray(0, 16), ct = bin.subarray(16);
    return crypto.subtle.importKey("raw", hexToBytes(hashedHex), "AES-CBC", false, ["decrypt"])
      .then(function(k){ return crypto.subtle.decrypt({name:"AES-CBC", iv:iv}, k, ct); })
      .then(function(out){
        var html = new TextDecoder().decode(new Uint8Array(out));
        if(html.lastIndexOf("<", 20) < 0) throw new Error("bad");
        return patch(html);
      });
  });
}

/* ---------- 热补丁：注入前打在解密结果上 ---------- */
var HOTFIX = '/* ── 撤回修正（临时热补丁） ──\n   源码里已经有 clmUnassign 的话就什么都不做，避免重复扣账。 */\n(function(){\n  if(typeof window.clmUnassign==="function")return;\n  var _orig=window.undoLast;\n  if(typeof _orig!=="function")return;\n  function sub(side,id,day){\n    try{\n      var c=(S.claimLog&&S.claimLog[day])||null;\n      if(!c||!c[side]||!c[side][id])return false;\n      c[side][id]--;\n      if(c[side][id]<=0)delete c[side][id];\n      return true;\n    }catch(e){return false;}\n  }\n  window.undoLast=function(){\n    var top=(S.h&&S.h[0])||null, n0=(S.h&&S.h.length)||0;\n    var r=_orig.apply(this,arguments);\n    try{\n      if(S.h.length<n0 && top && top.t==="e" && top._id){\n        var td=top.d?_dk(top.d):todayStr();\n        if(!sub("rival",top._id,td))sub("hero",top._id,td);\n        saveState();\n        try{if(typeof window.rvHuntSync==="function")window.rvHuntSync();}catch(e){}\n        try{if(typeof window.heroLock==="function")window.heroLock();}catch(e){}\n        try{render();renderDaily();}catch(e){}\n      }\n    }catch(e){}\n    return r;\n  };\n})();\n\n/* ── 一次性校正：卡顿期间点错留下的旧账 ──\n   把今天的账本删掉重算一遍（clmMigrate 会按实际完成记录重建），\n   只跑一次，跑完插旗。 */\n(function(){\n  var FLAG="kq-clm-repair-1";\n  try{ if(localStorage.getItem(FLAG))return; }catch(e){ return; }\n  function go(){\n    try{\n      if(typeof clmMigrate!=="function"||typeof todayStr!=="function")return;\n      if(typeof window.rvHuntNeed!=="function")return setTimeout(go,400);\n      var d=todayStr();\n      if(S.claimLog&&S.claimLog[d])delete S.claimLog[d];\n      clmMigrate(d);\n      saveState();\n      try{if(typeof window.rvHuntSync==="function")window.rvHuntSync();}catch(e){}\n      try{if(typeof window.heroLock==="function")window.heroLock();}catch(e){}\n      try{render();renderDaily();}catch(e){}\n      try{localStorage.setItem(FLAG,"1");}catch(e){}\n    }catch(e){}\n  }\n  setTimeout(go,900);\n})();\n';
function patch(html){
  var i = html.lastIndexOf("</body>");
  var tag = "<script>" + HOTFIX + "<\/script>";
  return i < 0 ? (html + tag) : (html.slice(0,i) + tag + html.slice(i));
}

/* ---------- 注入 ---------- */
function boot(html){
  say("就绪", 100);
  setTimeout(function(){
    document.open();
    document.write(html);
    document.close();
  }, 30);
}

/* ---------- 主流程 ---------- */
function run(){
  say("正在打开…", 5);
  idbGet("html:" + BUILD).then(function(cached){
    if(cached){ say("正在打开…", 90); boot(cached); return; }     // 命中缓存：不下载、不解密
    var saved = null;
    try{ saved = localStorage.getItem(PKEY); }catch(e){}
    if(saved) return unlock(saved, false);
    say("请输入密码", 0);
    FORM.style.display = "flex";
    PIN.focus();
  }).catch(function(){
    var saved = null;
    try{ saved = localStorage.getItem(PKEY); }catch(e){}
    if(saved) return unlock(saved, false);
    say("请输入密码", 0);
    FORM.style.display = "flex";
  });
}

function unlock(hashedHex, isNew){
  return decryptWith(hashedHex).then(function(html){
    try{ localStorage.setItem(PKEY, hashedHex); }catch(e){}
    say("正在保存到本机…", 80);
    return idbPutOnly("html:" + BUILD, html).catch(function(){}).then(function(){ boot(html); });
  }).catch(function(){
    try{ localStorage.removeItem(PKEY); }catch(e){}
    say("密码不对，重新输一次", 0);
    FORM.style.display = "flex";
    ERR.textContent = isNew ? "密码不对哦，再想想" : "";
    PIN.value = "";
    PIN.focus();
  });
}

BTN.addEventListener("click", function(){
  var pw = PIN.value;
  if(!pw) return;
  FORM.style.display = "none";
  ERR.textContent = "";
  say("正在验证密码…", 25);
  hashPassword(pw).then(function(h){ return unlock(h, true); });
});
PIN.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); BTN.click(); } });

run();
})();
</script></body></html>
