<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="克拉拉养成">
<title>克拉拉养成计划</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="icon.png.PNG">
<link rel="apple-touch-icon" href="icon.png.PNG">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Caveat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;color:#5a4a4a;font-family:'Noto Sans SC','Segoe UI',sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent;transition:background 1.5s ease,color 1.5s ease;}
body.spring{background:linear-gradient(160deg,#fdf2f0 0%,#f5e6e0 40%,#f0e0da 100%);}
body.winter{background:linear-gradient(160deg,#eef2f7 0%,#e0e6ee 40%,#d8dfe8 100%);}
button{cursor:pointer;border:none;background:none;font-family:inherit;-webkit-tap-highlight-color:transparent;}
textarea,input{font-family:inherit;-webkit-appearance:none;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(219,147,158,0.3);border-radius:4px;}
@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-20px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
@keyframes sparkle{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(219,147,158,0.3);}50%{box-shadow:0 0 40px rgba(219,147,158,0.5);}}
.bg1{position:fixed;top:-20%;right:-10%;width:500px;height:500px;border-radius:50%;pointer-events:none;transition:background 1.5s ease;}
.bg2{position:fixed;bottom:-10%;left:-10%;width:400px;height:400px;border-radius:50%;pointer-events:none;transition:background 1.5s ease;}
body.spring .bg1{background:radial-gradient(circle,rgba(219,147,158,0.08) 0%,transparent 70%);}
body.spring .bg2{background:radial-gradient(circle,rgba(199,163,163,0.06) 0%,transparent 70%);}
body.winter .bg1{background:radial-gradient(circle,rgba(147,170,200,0.1) 0%,transparent 70%);}
body.winter .bg2{background:radial-gradient(circle,rgba(160,180,200,0.08) 0%,transparent 70%);}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:14px 24px;border-radius:14px;z-index:1000;font-size:15px;font-weight:600;max-width:90vw;text-align:center;color:white;box-shadow:0 8px 32px rgba(255,255,255,0.7);animation:slideDown 0.3s ease-out;}
.toast-earn{background:linear-gradient(135deg,#7ba889,#6b9a7a);}.toast-big{background:linear-gradient(135deg,#c4868e,#d4a0a0);}.toast-redeem{background:linear-gradient(135deg,#c9a878,#d4b888);}.toast-penalty{background:linear-gradient(135deg,#c07070,#d48888);}.toast-fail{background:linear-gradient(135deg,#374151,#4b5563);}.toast-card{background:linear-gradient(135deg,#8a7a9a,#a08aaa);}
.inp{width:100%;padding:8px 12px;border-radius:8px;font-size:14px;background:rgba(255,255,255,0.6);color:#5a4a4a;border:1px solid rgba(219,147,158,0.2);outline:none;box-sizing:border-box;}
.tab-btn{flex:1;padding:10px;border-radius:10px;font-size:13px;transition:all 0.2s ease;}
.tab-active{font-weight:600;color:#fff;background:linear-gradient(135deg,rgba(219,147,158,0.3),rgba(199,163,163,0.2));}
.tab-inactive{font-weight:400;color:#a08888;background:transparent;}
.task-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;border-radius:10px;color:#5a4a4a;border:1px solid rgba(219,147,158,0.2);background:rgba(255,255,255,0.5);}
.task-btn-big{background:linear-gradient(135deg,rgba(219,147,158,0.12),rgba(199,163,163,0.08));border:1px solid rgba(219,147,158,0.25);}
.pen-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;background:rgba(210,140,140,0.06);border-radius:10px;border:1px solid rgba(210,140,140,0.15);color:#c08888;}
.pts{font-size:13px;font-weight:700;font-family:'Outfit';white-space:nowrap;margin-left:8px;}
.section-title{font-size:15px;font-weight:600;margin-bottom:10px;}
.hidden{display:none;}

/* SEASON TOGGLE BUTTON */
.season-toggle{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:12px;font-size:13px;font-weight:600;transition:all 0.5s ease;overflow:hidden;}
body.spring .season-toggle{background:linear-gradient(135deg,#8aaac4,#6a8aaa);color:#fff;}
body.winter .season-toggle{background:linear-gradient(135deg,#c4868e,#d4a0a0);color:#fff;}

/* SNOWFALL CANVAS */
#snowCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;opacity:0;transition:opacity 1.5s ease;}
#snowCanvas.active{opacity:1;}

/* SEASON TRANSITION FLASH */
@keyframes seasonFlash{0%{opacity:0;}15%{opacity:0.6;}40%{opacity:0.3;}100%{opacity:0;}}
.season-flash{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1998;pointer-events:none;animation:seasonFlash 2s ease-out forwards;}
.season-flash-winter{background:radial-gradient(circle at 50% 30%,rgba(200,220,255,0.8),rgba(180,200,230,0.4),transparent);}
.season-flash-spring{background:radial-gradient(circle at 50% 30%,rgba(255,220,210,0.7),rgba(240,200,200,0.3),transparent);}

/* PETAL FALL */
@keyframes petalDrift{0%{transform:translateY(-20px) rotate(0deg) translateX(0);opacity:0;}10%{opacity:1;}100%{transform:translateY(100vh) rotate(360deg) translateX(80px);opacity:0;}}
.petal{position:fixed;z-index:997;pointer-events:none;font-size:16px;animation:petalDrift linear forwards;}

/* WINTER THEME OVERRIDES */
body.winter .tab-active{background:linear-gradient(135deg,rgba(138,154,180,0.35),rgba(160,175,195,0.25));}
body.winter .task-btn{border-color:rgba(138,154,180,0.2);background:rgba(255,255,255,0.45);}
body.winter .task-btn-big{background:linear-gradient(135deg,rgba(138,154,180,0.12),rgba(160,175,195,0.08));border-color:rgba(138,154,180,0.25);}
body.winter .section-title{color:#6a7a8e!important;}
body.winter .pen-btn{background:rgba(140,150,170,0.06);border-color:rgba(140,150,170,0.15);color:#8a8a9a;}
body.winter .inp{border-color:rgba(138,154,180,0.2);}

@keyframes achieveSlideIn{0%{opacity:0;transform:translate(-50%,-50%) scale(0.5);}60%{transform:translate(-50%,-50%) scale(1.05);}100%{opacity:1;transform:translate(-50%,-50%) scale(1);}}
@keyframes achieveGlow{0%,100%{box-shadow:0 0 30px rgba(196,134,142,0.4);}50%{box-shadow:0 0 60px rgba(196,134,142,0.7);}}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}
@keyframes epicFlash{0%{opacity:0;}15%{opacity:0.3;}30%{opacity:0;}100%{opacity:0;}}
@keyframes shakeIt{0%,100%{transform:translateX(0);}25%,75%{transform:translateX(-3px);}50%{transform:translateX(3px);}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 8px rgba(163,176,196,0.3);}50%{box-shadow:0 0 16px rgba(163,176,196,0.5);}}
.achieve-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2000;display:flex;align-items:center;justify-content:center;}
.achieve-overlay-bg{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);}
.achieve-card{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2001;width:85vw;max-width:340px;border-radius:20px;padding:28px 24px;text-align:center;}
.achieve-card-normal{background:linear-gradient(145deg,#e8edf3,#d5dce6);border:2px solid #a3b0c4;box-shadow:0 8px 32px rgba(163,176,196,0.4);}
.achieve-card-rare{background:linear-gradient(145deg,#e8e8ef,#d8d8e2);border:2px solid #a8a8b8;box-shadow:0 8px 32px rgba(168,168,184,0.4);animation:pulseGlow 2s ease-in-out infinite;}
.achieve-card-epic{background:linear-gradient(145deg,#faf5eb,#f0e8d8);border:2px solid #d4a840;box-shadow:0 8px 32px rgba(212,168,64,0.4);animation:achieveGlow 2s ease-in-out infinite;}
.achieve-card-legend{background:linear-gradient(145deg,#f5ede8,#efe4de);border:2px solid transparent;box-shadow:0 12px 48px rgba(196,134,142,0.5);animation:achieveSlideIn 0.5s ease-out;}
.confetti-piece{position:fixed;top:-10px;z-index:2002;pointer-events:none;animation:confettiFall linear forwards;}
.epic-flash{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1999;pointer-events:none;animation:epicFlash 0.6s ease-out forwards;}
@keyframes legendLockedPulse{0%,100%{border-color:rgba(196,134,142,0.2);box-shadow:0 0 12px rgba(196,134,142,0.08);}50%{border-color:rgba(196,134,142,0.45);box-shadow:0 0 20px rgba(196,134,142,0.15);}}
@keyframes epicLockedShimmer{0%,100%{border-color:rgba(212,168,64,0.15);box-shadow:0 0 8px rgba(212,168,64,0.05);}50%{border-color:rgba(212,168,64,0.35);box-shadow:0 0 14px rgba(212,168,64,0.1);}}
@keyframes rareLockedGlow{0%,100%{border-color:rgba(168,168,184,0.15);}50%{border-color:rgba(168,168,184,0.3);}}
.ach-wall-card{padding:14px 16px;border-radius:14px;margin-bottom:10px;position:relative;overflow:hidden;}
.ach-locked-normal{background:linear-gradient(135deg,rgba(163,176,196,0.06),rgba(163,176,196,0.02));border:1px dashed rgba(163,176,196,0.25);}
.ach-locked-rare{background:linear-gradient(135deg,rgba(168,168,184,0.08),rgba(168,168,184,0.03));border:1px dashed rgba(168,168,184,0.25);animation:rareLockedGlow 3s ease-in-out infinite;}
.ach-locked-epic{background:linear-gradient(135deg,rgba(212,168,64,0.06),rgba(212,168,64,0.02));border:1px dashed rgba(212,168,64,0.2);animation:epicLockedShimmer 3s ease-in-out infinite;}
.ach-locked-legend{background:linear-gradient(135deg,rgba(196,134,142,0.08),rgba(199,163,163,0.04));border:1.5px dashed rgba(196,134,142,0.25);animation:legendLockedPulse 3s ease-in-out infinite;}
.ach-unlocked-normal{background:linear-gradient(135deg,rgba(163,176,196,0.12),rgba(163,176,196,0.06));border:1px solid rgba(163,176,196,0.3);}
.ach-unlocked-rare{background:linear-gradient(135deg,rgba(168,168,184,0.12),rgba(168,168,184,0.06));border:1px solid rgba(168,168,184,0.3);}
.ach-unlocked-epic{background:linear-gradient(135deg,rgba(212,168,64,0.1),rgba(212,168,64,0.04));border:1px solid rgba(212,168,64,0.3);}
.ach-unlocked-legend{background:linear-gradient(135deg,rgba(196,134,142,0.12),rgba(199,163,163,0.06));border:1px solid rgba(196,134,142,0.3);animation:glow 3s ease-in-out infinite;}

/* CARD FRAGMENT SYSTEM */
.card-carousel-wrap{position:relative;margin:0 0 20px;overflow:hidden;}
.card-carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:14px;padding:0 8px;}
.card-carousel::-webkit-scrollbar{display:none;}
.card-slot{flex:0 0 82vw;max-width:360px;scroll-snap-align:center;border-radius:16px;overflow:hidden;position:relative;background:#3a3035;box-shadow:0 6px 24px rgba(80,60,68,0.22);}
@keyframes cardGlow{0%,100%{box-shadow:0 6px 24px rgba(212,180,140,0.25);}50%{box-shadow:0 8px 32px rgba(212,180,140,0.45);}}
.card-slot-done{border:2px solid rgba(212,180,140,0.5);animation:cardGlow 3s ease-in-out infinite;}
.card-img-wrap{position:relative;width:100%;padding-top:133%;overflow:hidden;}
.card-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;}
.card-mask{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
.card-piece{position:absolute;background:rgba(55,45,50,0.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:opacity 0.8s ease;border:0.5px solid rgba(100,85,90,0.18);}
.card-piece.unlocked{opacity:0;backdrop-filter:none;-webkit-backdrop-filter:none;}
.card-info{padding:10px 14px;text-align:center;background:rgba(50,40,45,0.55);}
.card-info-name{font-size:14px;font-weight:600;color:rgba(230,215,210,0.88);letter-spacing:1px;margin-bottom:2px;}
.card-info-line{font-size:11px;color:rgba(199,170,165,0.6);margin-bottom:4px;}
.card-info-prog{font-family:'Outfit';font-size:13px;font-weight:700;color:rgba(219,180,175,0.85);}
.card-dots{display:flex;justify-content:center;gap:6px;padding:8px 0 2px;}
.card-dot{width:7px;height:7px;border-radius:50%;background:rgba(219,147,158,0.2);transition:all 0.3s;}
.card-dot.active{background:rgba(219,147,158,0.55);transform:scale(1.25);}
.card-lock{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;opacity:0.35;z-index:5;transition:opacity 0.5s;pointer-events:none;}
.card-lock.hide{opacity:0;}
.card-reveal-ov{position:fixed;top:0;left:0;width:100%;height:100%;z-index:3000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0);transition:background 0.5s;pointer-events:none;opacity:0;}
.card-reveal-ov.on{background:rgba(20,15,18,0.88);pointer-events:all;opacity:1;}
.card-reveal-box{position:relative;width:78vw;max-width:340px;border-radius:16px;overflow:hidden;box-shadow:0 12px 60px rgba(196,134,142,0.35);transform:scale(0.8);transition:transform 0.8s cubic-bezier(0.16,1,0.3,1);opacity:0;}
.card-reveal-ov.on .card-reveal-box{transform:scale(1);opacity:1;}
.card-reveal-img{width:100%;display:block;filter:blur(20px);transition:filter 2s ease;}
.card-reveal-img.clear{filter:blur(0);}
.card-reveal-cap{position:absolute;bottom:0;left:0;right:0;padding:20px;text-align:center;background:linear-gradient(transparent,rgba(20,15,18,0.8));opacity:0;transition:opacity 1s ease 1.5s;}
.card-reveal-ov.on .card-reveal-cap{opacity:1;}

/* DAILY PLAN */
@keyframes dpBounceIn{0%{opacity:0;transform:translateY(-15px) scale(0.9);}50%{transform:translateY(4px) scale(1.02);}100%{opacity:1;transform:translateY(0) scale(1);}}
@keyframes dpStarBurst{0%{opacity:1;transform:scale(0.5);}60%{opacity:1;transform:scale(1.3);}100%{opacity:0;transform:scale(1.8);}}
@keyframes dpCheckPop{0%{transform:scale(1);}30%{transform:scale(0.92);}60%{transform:scale(1.06);}100%{transform:scale(1);}}
@keyframes dpSparkle{0%,100%{opacity:0;transform:scale(0) rotate(0deg);}50%{opacity:1;transform:scale(1) rotate(180deg);}}
@keyframes dpFloat{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-30px);}}
.dp-wrap{margin-bottom:20px;}
.dp-msg{padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,rgba(219,147,158,0.1),rgba(199,163,163,0.06));border:1px solid rgba(219,147,158,0.2);margin-bottom:16px;font-size:13px;line-height:1.7;color:#6a5555;min-height:50px;position:relative;overflow:hidden;}
.dp-msg-loading{color:#b09898;font-style:italic;}
.dp-msg-quote{font-style:italic;color:#8a6a6e;}
.dp-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,0.55);border:1px solid rgba(219,147,158,0.15);margin-bottom:8px;position:relative;overflow:hidden;animation:dpBounceIn 0.4s ease-out;}
.dp-item.done{background:rgba(219,147,158,0.08);border-color:rgba(219,147,158,0.25);}
.dp-item.done .dp-item-name{text-decoration:line-through;color:#b09898;}
.dp-check{width:26px;height:26px;border-radius:50%;border:2px solid rgba(219,147,158,0.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.3s;font-size:13px;cursor:pointer;}
.dp-check.checked{background:linear-gradient(135deg,#c4868e,#d4a0a0);border-color:#c4868e;color:#fff;animation:dpCheckPop 0.4s ease;}
.dp-item-name{flex:1;font-size:14px;color:#5a4a4a;}
.dp-time{font-size:11px;color:#b09898;font-family:'Outfit';white-space:nowrap;}
.dp-time-input{width:48px;padding:3px 4px;border-radius:6px;font-size:11px;text-align:center;background:rgba(255,255,255,0.7);border:1px solid rgba(219,147,158,0.2);color:#6a5555;font-family:'Outfit';outline:none;}
.dp-rm{padding:2px 8px;border-radius:6px;font-size:11px;color:#c07070;background:rgba(210,140,140,0.1);cursor:pointer;flex-shrink:0;}
.dp-stars{position:absolute;top:50%;left:50%;pointer-events:none;}
.dp-star{position:absolute;width:8px;height:8px;background:#c4868e;border-radius:50%;animation:dpStarBurst 0.6s ease-out forwards;}
.dp-float-pts{position:absolute;right:14px;top:-5px;font-family:'Outfit';font-weight:700;font-size:14px;color:#c4868e;pointer-events:none;animation:dpFloat 1s ease-out forwards;}
.dp-add-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:600;color:#c4868e;background:rgba(219,147,158,0.1);border:1px solid rgba(219,147,158,0.2);cursor:pointer;transition:all 0.2s;}
.dp-add-btn:active{transform:scale(0.95);background:rgba(219,147,158,0.2);}
.dp-done-card{padding:20px;border-radius:16px;text-align:center;background:linear-gradient(145deg,rgba(219,147,158,0.12),rgba(199,163,163,0.06));border:1px solid rgba(219,147,158,0.25);margin-top:16px;animation:dpBounceIn 0.5s ease-out;}

/* PALACE TAB */
.hide-scrollbar::-webkit-scrollbar{display:none;}
.pl-flower-wrap{position:relative;width:100%;height:180px;border-radius:16px;margin-bottom:16px;overflow:hidden;}
.pl-flower-wrap canvas{width:100%;height:100%;display:block;}
.pl-header{text-align:center;padding:18px 16px 14px;background:rgba(253,250,249,0.85);backdrop-filter:blur(8px);border-radius:16px;box-shadow:0 2px 12px rgba(138,90,96,0.06);margin-bottom:16px;position:relative;overflow:hidden;}
.pl-header::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ecd4d6,#c48e93,#ecd4d6);}
.pl-header h2{font-family:'Playfair Display',serif;font-weight:400;font-size:1.25rem;color:#8a5a60;letter-spacing:2px;margin-bottom:2px;}
.pl-sub{font-family:'Caveat',cursive;font-size:0.85rem;color:#b08a8e;letter-spacing:1px;}
.pl-goal{font-size:0.72rem;color:#d6a6aa;margin-top:4px;}
.pl-stats{display:flex;justify-content:center;gap:20px;margin-top:10px;font-size:0.75rem;color:#b08a8e;}
.pl-stats b{color:#8a5a60;font-size:0.95rem;font-family:'Playfair Display',serif;}
.pl-chart-wrap{margin-top:12px;height:160px;position:relative;background:#f9f0f1;border-radius:10px;padding:8px;}
.pl-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:0 auto 16px;}
.pl-day{aspect-ratio:1;background:#fdfaf9;border:1.5px solid #ecd4d6;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Caveat',cursive;font-size:0.75rem;color:#b08a8e;cursor:pointer;transition:all 0.3s;position:relative;overflow:hidden;}
.pl-day:hover{transform:translateY(-2px);box-shadow:0 3px 10px rgba(138,90,96,0.1);}
.pl-day.active{background:linear-gradient(135deg,#c48e93,#d6a6aa);color:white;border-color:#c48e93;box-shadow:0 2px 8px rgba(196,142,147,0.3);}
.pl-day.active::after{content:'\2713';position:absolute;font-size:0.45rem;top:1px;right:2px;opacity:0.7;}
.pl-day.has-meals::before{content:'\1F37D';position:absolute;bottom:1px;right:1px;font-size:0.35rem;}
.pl-day.milestone{border-color:#c8b070;border-width:2px;}
.pl-day.milestone.active{background:linear-gradient(135deg,#c8b070,#d4c490);border-color:#c8b070;}
.pl-day.reward-cell{border-style:dashed;border-color:#e0bfc2;}
.pl-card{background:#fdfaf9;border-radius:16px;box-shadow:0 2px 12px rgba(138,90,96,0.06);padding:18px;margin-bottom:16px;position:relative;overflow:hidden;}
.pl-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ecd4d6,#d6a6aa,#ecd4d6);}
.pl-card h3{font-family:'Playfair Display',serif;font-weight:400;font-size:0.95rem;color:#8a5a60;margin-bottom:10px;letter-spacing:1px;}
.pl-reward-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:0.8rem;}
.pl-reward-label{font-family:'Caveat',cursive;font-size:0.9rem;color:#c8b070;min-width:38px;}

var currentSeason = "spring";

function winterPts(basePts){
  if(basePts<=1) return 5;
  if(basePts<=2) return 8;
  if(basePts<=3) return 10;
  if(basePts<=5) return 15;
  if(basePts<=8) return 22;
  if(basePts<=10) return 25;
  if(basePts<=12) return 30;
  if(basePts<=15) return 35;
  if(basePts<=20) return 45;
  if(basePts<=50) return 80;
  if(basePts<=100) return 140;
  if(basePts<=150) return 200;
  if(basePts<=200) return 260;
  if(basePts<=300) return 380;
  return Math.round(basePts * 1.27);
}

function seasonPts(basePts){
  return currentSeason === "winter" ? winterPts(basePts) : basePts;

const LS_KEY="klara_quest_v3";
let S={cp:0,totalEarned:0,totalSpent:0,taskCounts:{},penCounts:{},attrs:{},log:[],achievements:[],cardPieces:{},dailyPlan:{items:[],msg:"",date:""},palace:{days:{},startDate:null,startWeight:null,goalWeight:null,rewards:{d30:"",d60:"",d90:""},visionBoard:[]},phoneFund:0,apiFund:0,season:"spring"};
function initAttrs(){ATTRS.forEach(a=>{if(!S.attrs[a.id])S.attrs[a.id]=0;});}
function loadState(){try{const d=localStorage.getItem(LS_KEY);if(d){const p=JSON.parse(d);Object.assign(S,p);if(!S.taskCounts)S.taskCounts={};if(!S.penCounts)S.penCounts={};if(!S.attrs)S.attrs={};if(!S.log)S.log=[];if(!S.achievements)S.achievements=[];if(!S.cardPieces)S.cardPieces={};if(!S.dailyPlan)S.dailyPlan={items:[],msg:"",date:""};if(!S.palace)S.palace={days:{},startDate:null,startWeight:null,goalWeight:null,rewards:{d30:"",d60:"",d90:""},visionBoard:[]};if(S.phoneFund===undefined)S.phoneFund=0;if(S.apiFund===undefined)S.apiFund=0;if(!S.season)S.season="spring";currentSeason=S.season;}}catch(e){console.error(e);}initAttrs();}
function saveState(){S.season=currentSeason;try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){console.error(e);}}
function getToday(){var now=new Date();if(now.getHours()<23||(now.getHours()===23&&now.getMinutes()===0&&now.getSeconds()===0)){return now.toISOString().slice(0,10);}else{var tom=new Date(now);tom.setDate(tom.getDate()+1);return tom.toISOString().slice(0,10);}}

/* ═══════ TOAST ═══════ */
function showToast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='toast toast-'+type;t.classList.remove('hidden');clearTimeout(t._tid);t._tid=setTimeout(()=>t.classList.add('hidden'),2800);}

/* ═══════ EARN / PENALIZE / REDEEM ═══════ */
function earn(taskId){
  let task=null;
  for(const c of Object.values(TASKS)){for(const t of c.items){if(t.id===taskId){task=t;break;}}if(task)break;}
  if(!task)return;
  const sp=seasonPts(task.pts);
  S.cp+=sp;S.totalEarned+=sp;
  S.taskCounts[taskId]=(S.taskCounts[taskId]||0)+1;
  const aa=TASK_ATTRS[taskId];
  if(aa){for(const[k,v]of Object.entries(aa)){S.attrs[k]=(S.attrs[k]||0)+v;}}
  S.log.unshift({type:'earn',id:taskId,name:task.name,pts:sp,em:task.em,date:getToday(),ts:Date.now()});
  if(S.log.length>500)S.log=S.log.slice(0,500);
  saveState();
  const praise=PRAISE[taskId];
  if(sp>=100){
    showToast(`${task.em} +${sp}分！！${praise?rp(praise):'太厉害了！！！'}`,'big');
    confetti(20);
  } else if(sp>=20){
    showToast(`${task.em} +${sp}分！${praise?rp(praise):'干得漂亮！'}`,'big');
    confetti(8);
  } else {
    showToast(`${task.em} +${sp}分 ${praise?rp(praise):''}`,'earn');
  }
  tryCardDrop(sp);
  checkAchievements();
  render();
}

function penalize(penId){
  const pen=PENS.find(p=>p.id===penId);if(!pen)return;
  S.cp+=pen.pts;S.totalEarned+=pen.pts;
  S.penCounts[penId]=(S.penCounts[penId]||0)+1;
  const pa=PEN_ATTRS[penId];
  if(pa){for(const[k,v]of Object.entries(pa)){S.attrs[k]=(S.attrs[k]||0)+v;}}
  S.log.unshift({type:'pen',id:penId,name:pen.name,pts:pen.pts,em:pen.em,date:getToday(),ts:Date.now()});
  saveState();
  const msg=PEN_MSG[penId];
  showToast(`${pen.em} ${pen.pts}分 ${msg?rp(msg):''}`,'penalty');
  render();
}

function redeem(shopId){
  const item=SHOP.find(s=>s.id===shopId);if(!item)return;
  if(S.cp<item.cost){showToast('积分不够哦，继续加油！','fail');return;}
  S.cp-=item.cost;S.totalSpent+=item.cost;
  S.log.unshift({type:'redeem',id:shopId,name:item.name,pts:-item.cost,em:item.em,date:getToday(),ts:Date.now()});
  saveState();showToast(`${item.em} 兑换成功：${item.name}！`,'redeem');render();
}

/* ═══════ CARD FRAGMENTS ═══════ */
function tryCardDrop(pts){
  let chance=0;
  if(pts>=100)chance=0.5;else if(pts>=50)chance=0.3;else if(pts>=15)chance=0.12;else if(pts>=8)chance=0.06;else chance=0.03;
  if(Math.random()>chance)return;
  const incomplete=CARDS.filter(c=>{const p=S.cardPieces[c.id]||[];return p.length<c.pieces;});
  if(!incomplete.length)return;
  const card=incomplete[Math.floor(Math.random()*incomplete.length)];
  if(!S.cardPieces[card.id])S.cardPieces[card.id]=[];
  const unlocked=S.cardPieces[card.id];
  const remaining=[];
  for(let i=0;i<card.pieces;i++){if(!unlocked.includes(i))remaining.push(i);}
  if(!remaining.length)return;
  const piece=remaining[Math.floor(Math.random()*remaining.length)];
  S.cardPieces[card.id].push(piece);
  saveState();
  const total=card.pieces;const got=S.cardPieces[card.id].length;
  if(got>=total){
    setTimeout(()=>{showToast(`🃏✨ ${card.name} 卡片收集完成！！`,'card');showCardReveal(card);},500);
  } else {
    showToast(`🃏 获得 ${card.name} 碎片 [${got}/${total}]`,'card');
  }
}
function showCardReveal(card){
  const ov=document.getElementById('cardRevealOv');
  document.getElementById('crImg').src=card.img;document.getElementById('crImg').className='card-reveal-img';
  document.getElementById('crName').textContent=card.name;document.getElementById('crSub').textContent=card.sub;
  ov.classList.add('on');setTimeout(()=>{document.getElementById('crImg').classList.add('clear');},300);confetti(30);
}
function closeCardReveal(){document.getElementById('cardRevealOv').classList.remove('on');}

function confetti(n){
  const c=document.getElementById('confettiContainer');
  const colors=['#c4868e','#d4a0a0','#c9b8a8','#a07078','#d4c4a8','#8ab0a0'];

}

function renderTasks(){
  let h='';
  for(const[catKey,cat] of Object.entries(TASKS)){
    h+=`<div class="section-title" style="margin-top:16px;">${cat.label}</div>`;
    for(const t of cat.items){
      const sp=seasonPts(t.pts);
      const isBig=sp>=50;
      const winterBadge=currentSeason==="winter"&&t.pts!==sp?`<span class="winter-badge">×${(sp/t.pts).toFixed(1)}</span>`:'';
      h+=`<button class="task-btn ${isBig?'task-btn-big':''}" onclick="earn('${t.id}')" style="margin-bottom:6px;"><span style="font-size:14px;">${t.em} ${t.name}</span><span class="pts" style="color:${isBig?'#c4868e':'#a08888'}">+${sp}${winterBadge}</span></button>`;
    }
  }
  h+=`<div class="section-title" style="margin-top:20px;">😤 扣分项</div>`;
  for(const p of PENS){
    h+=`<button class="pen-btn" onclick="penalize('${p.id}')" style="margin-bottom:6px;"><span style="font-size:14px;">${p.em} ${p.name}</span><span class="pts" style="color:#c07070;">${p.pts}</span></button>`;
  }
  document.getElementById('content-tasks').innerHTML=h;
}

function drawRadar(){
  const canvas=document.getElementById('radarCanvas');if(!canvas)return;
  const ctx=canvas.getContext('2d');const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);const cx=W/2,cy=H/2-5,r=110;
  const sorted=[...ATTRS].sort((a,b)=>(S.attrs[b.id]||0)-(S.attrs[a.id]||0));
  const top8=sorted.slice(0,8);const n=top8.length;
  ctx.strokeStyle=currentSeason==='winter'?'rgba(138,154,170,0.15)':'rgba(219,147,158,0.15)';
  for(let ring=1;ring<=5;ring++){ctx.beginPath();for(let i=0;i<=n;i++){const a=-Math.PI/2+(2*Math.PI/n)*i;const rr=r*ring/5;if(i===0)ctx.moveTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));else ctx.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));}ctx.stroke();}
  for(let i=0;i<n;i++){const a=-Math.PI/2+(2*Math.PI/n)*i;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));ctx.stroke();}
  const maxXP=Math.max(...top8.map(a=>S.attrs[a.id]||0),1);
  ctx.fillStyle=currentSeason==='winter'?'rgba(138,154,170,0.2)':'rgba(219,147,158,0.2)';
  ctx.strokeStyle=currentSeason==='winter'?'rgba(138,154,170,0.6)':'rgba(219,147,158,0.6)';
  ctx.lineWidth=2;ctx.beginPath();
  for(let i=0;i<=n;i++){const idx=i%n;const a=-Math.PI/2+(2*Math.PI/n)*idx;const val=Math.min((S.attrs[top8[idx].id]||0)/maxXP,1);const rr=Math.max(r*val,8);if(i===0)ctx.moveTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));else ctx.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a));}
  ctx.fill();ctx.stroke();
  ctx.fillStyle='#5a4a4a';ctx.font='12px "Noto Sans SC"';ctx.textAlign='center';
  for(let i=0;i<n;i++){const a=-Math.PI/2+(2*Math.PI/n)*i;const lx=cx+(r+20)*Math.cos(a);const ly=cy+(r+20)*Math.sin(a);ctx.fillText(top8[i].em+' '+top8[i].name,lx,ly+4);}
}

  c+=`<div class="pl-meal-total">总计: ${totalCal} kcal</div></div>`;
  c+=`<div class="pl-ex-section"><h4>🏃 运动记录</h4>`;
  if(day.exercise){day.exercise.forEach((e,i)=>{c+=`<div class="pl-ex-row"><input type="text" value="${e.name||''}" onchange="updatePalaceEx(${d},${i},'name',this.value)" placeholder="运动"><input type="number" value="${e.min||''}" onchange="updatePalaceEx(${d},${i},'min',parseInt(this.value))" placeholder="min"><span class="unit">min</span><button class="rm" onclick="removePalaceEx(${d},${i})">✕</button></div>`;});}
  const totalMin=day.exercise?day.exercise.reduce((s,e)=>s+(e.min||0),0):0;
  c+=`<button class="pl-add-btn" style="color:#7a9a6a;border-color:#cde0cd;" onclick="addPalaceEx(${d})">+ 添加运动</button>`;
  c+=`<div class="pl-ex-total">总计: ${totalMin} 分钟</div></div>`;
  c+=`<div class="pl-day-total">净摄入: <strong>${totalCal}</strong> kcal - <strong>${totalMin*5}</strong> kcal(运动) = <strong>${totalCal-totalMin*5}</strong> kcal</div>`;
  c+=`<button class="pl-btn-save" onclick="closePalacePanel()">保 存</button>`;
  document.getElementById('plPanelContent').innerHTML=c;
  document.getElementById('plOverlay').style.display='block';
  document.getElementById('plPanel').style.display='block';
}

function closePalacePanel(){document.getElementById('plOverlay').style.display='none';document.getElementById('plPanel').style.display='none';saveState();renderPalace();}
function togglePalaceCheck(d){const k='d'+d;if(!S.palace.days[k])S.palace.days[k]={checked:false};S.palace.days[k].checked=!S.palace.days[k].checked;saveState();openPalaceDay(d);}
function updatePalaceDay(d,field,val){const k='d'+d;S.palace.days[k][field]=val;saveState();openPalaceDay(d);}
function updatePalaceMeal(d,i,field,val){const k='d'+d;S.palace.days[k].meals[i][field]=val;saveState();openPalaceDay(d);}
function addPalaceMeal(d){const k='d'+d;if(!S.palace.days[k].meals)S.palace.days[k].meals=[];S.palace.days[k].meals.push({name:'',cal:0});saveState();openPalaceDay(d);}
function removePalaceMeal(d,i){const k='d'+d;S.palace.days[k].meals.splice(i,1);saveState();openPalaceDay(d);}
function updatePalaceEx(d,i,field,val){const k='d'+d;S.palace.days[k].exercise[i][field]=val;saveState();openPalaceDay(d);}
function addPalaceEx(d){const k='d'+d;if(!S.palace.days[k].exercise)S.palace.days[k].exercise=[];S.palace.days[k].exercise.push({name:'',min:0});saveState();openPalaceDay(d);}
function removePalaceEx(d,i){const k='d'+d;S.palace.days[k].exercise.splice(i,1);saveState();openPalaceDay(d);}
function updatePalaceReward(k,val){S.palace.rewards[k]=val;saveState();}
function addVision(){const t=document.getElementById('visionText');const text=t.value.trim();if(!text)return;if(!S.palace.visionBoard)S.palace.visionBoard=[];S.palace.visionBoard.push({text});t.value='';saveState();renderPalace();}
function removeVision(i){S.palace.visionBoard.splice(i,1);saveState();renderPalace();}

function drawWeightChart(){
  const canvas=document.getElementById('weightChart');if(!canvas)return;
  const P=S.palace;const weights=[];
  for(let d=1;d<=90;d++){const k='d'+d;if(P.days[k]&&P.days[k].weight){weights.push({day:d,w:P.days[k].weight});}}
  if(weights.length<2)return;
  const labels=weights.map(w=>'D'+w.day);const data=weights.map(w=>w.w);
  new Chart(canvas,{type:'line',data:{labels,datasets:[{label:'体重(kg)',data,borderColor:'#c48e93',backgroundColor:'rgba(196,142,147,0.1)',fill:true,tension:0.3,pointRadius:4,pointBackgroundColor:'#c48e93'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},annotation:P.goalWeight?{annotations:{goalLine:{type:'line',yMin:P.goalWeight,yMax:P.goalWeight,borderColor:'rgba(120,180,120,0.5)',borderWidth:2,borderDash:[5,5],label:{display:true,content:'目标',position:'end'}}}}:{}},scales:{y:{beginAtZero:false,grid:{color:'rgba(219,147,158,0.1)'}},x:{grid:{display:false}}}}});
}

/* ═══════ TAB SWITCHING ═══════ */
function switchTab(tab){
  const tabs=['tasks','attrs','achieve','palace','shop','history','wishes'];
  tabs.forEach(t=>{
    const el=document.getElementById('content-'+t);
    const btn=document.getElementById('tab-'+t);
    if(el){if(t===tab){el.classList.remove('hidden');}else{el.classList.add('hidden');}}
    if(btn){btn.className=t===tab?'tab-btn tab-active':'tab-btn tab-inactive';}
  });
  // Daily plan always visible when tasks tab is shown
  const dp=document.getElementById('content-daily');
  if(dp){dp.style.display=tab==='tasks'?'block':'none';}
  if(tab==='palace')renderPalace();
  if(tab==='attrs')setTimeout(drawRadar,100);
}

/* ═══════ SAVE / LOAD ═══════ */
function toggleSave(){
  const p=document.getElementById('savePanel');
  document.getElementById('loadPanel').classList.add('hidden');
  p.classList.toggle('hidden');
  if(!p.classList.contains('hidden')){
    document.getElementById('saveCode').value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  }
}
function toggleLoad(){
  const p=document.getElementById('loadPanel');
  document.getElementById('savePanel').classList.add('hidden');
  p.classList.toggle('hidden');
}
function copyCode(){
  const ta=document.getElementById('saveCode');ta.select();
  try{document.execCommand('copy');showToast('✅ 存档码已复制！','earn');}catch(e){showToast('复制失败，请手动长按复制','fail');}
}
function loadSave(){
  const code=document.getElementById('loadCode').value.trim();
  if(!code){showToast('请粘贴存档码','fail');return;}
  try{
    const json=decodeURIComponent(escape(atob(code)));
    const data=JSON.parse(json);
    Object.assign(S,data);
    if(!S.season)S.season="spring";
    currentSeason=S.season;
    saveState();
    // Apply season visually
    document.body.className=currentSeason;
    if(currentSeason==='winter'){
      document.getElementById('seasonBtn').innerHTML='❄️ 冬';
      document.getElementById('headerSub').style.color='#7a8ea0';
      document.getElementById('headerTitle').style.background='linear-gradient(135deg,#8a9ab0 0%,#a0b0c0 50%,#b0bac8 100%)';
      document.getElementById('headerTitle').style.webkitBackgroundClip='text';
      document.getElementById('headerTitle').style.webkitTextFillColor='transparent';
      document.getElementById('headerDesc').style.color='#8a9aaa';
      startSnow(false);
    } else {
      document.getElementById('seasonBtn').innerHTML='🌸 春';
      document.getElementById('headerSub').style.color='#c4868e';
      document.getElementById('headerTitle').style.background='linear-gradient(135deg,#d4a0a0 0%,#d4a0a0 50%,#c9b8a8 100%)';
      document.getElementById('headerTitle').style.webkitBackgroundClip='text';
      document.getElementById('headerTitle').style.webkitTextFillColor='transparent';
      document.getElementById('headerDesc').style.color='#a08888';
    }
    render();
    showToast('✅ 存档导入成功！','earn');
    document.getElementById('loadMsg').innerHTML='<span style="color:#16a34a;">导入成功！</span>';
  }catch(e){
    showToast('存档码格式错误','fail');
    document.getElementById('loadMsg').innerHTML='<span style="color:#c07070;">格式错误，请检查</span>';
  }
}

/* ═══════ SEASON TOGGLE ═══════ */
function toggleSeason(){
  if(currentSeason==="spring"){
    currentSeason="winter";S.season="winter";
    document.body.className="winter";
    document.getElementById('seasonBtn').innerHTML='❄️ 冬';
    // Flash
    var fl=document.createElement('div');fl.className='season-flash season-flash-winter';
    document.getElementById('seasonFlashContainer').appendChild(fl);
    setTimeout(function(){fl.remove();},4500);
    // Blizzard then gentle
    startSnow(true);
    setTimeout(function(){if(currentSeason==="winter")snowIntensity=1;},6000);
    // Header colors
    document.getElementById('headerSub').style.color='#7a8ea0';
    document.getElementById('headerTitle').style.background='linear-gradient(135deg,#8a9ab0 0%,#a0b0c0 50%,#b0bac8 100%)';
    document.getElementById('headerTitle').style.webkitBackgroundClip='text';
    document.getElementById('headerTitle').style.webkitTextFillColor='transparent';
    document.getElementById('headerDesc').style.color='#8a9aaa';
    showToast('❄️ 冬季模式：寒冬里每一步都更难，分值已提升！','card');
  } else {
    currentSeason="spring";S.season="spring";
    document.body.className="spring";
    document.getElementById('seasonBtn').innerHTML='🌸 春';

    document.getElementById('seasonFlashContainer').appendChild(fl2);
    setTimeout(function(){fl2.remove();},4000);
    stopSnow();spawnPetals(25);
    document.getElementById('headerSub').style.color='#c4868e';
    document.getElementById('headerTitle').style.background='linear-gradient(135deg,#d4a0a0 0%,#d4a0a0 50%,#c9b8a8 100%)';
    document.getElementById('headerTitle').style.webkitBackgroundClip='text';
    document.getElementById('headerTitle').style.webkitTextFillColor='transparent';
    document.getElementById('headerDesc').style.color='#a08888';
    showToast('🌸 春季模式：温暖的日子回来了！','earn');
  }
  saveState();render();
}

/* ═══════ SNOWFALL ENGINE ═══════ */
var snowflakes=[];var snowCanvas,snowCtx,snowAnimId=null;var snowIntensity=0;

function initSnow(){snowCanvas=document.getElementById('snowCanvas');snowCtx=snowCanvas.getContext('2d');resizeSnowCanvas();window.addEventListener('resize',resizeSnowCanvas);}
function resizeSnowCanvas(){if(!snowCanvas)return;snowCanvas.width=window.innerWidth;snowCanvas.height=window.innerHeight;}

function spawnSnowflake(isBlizzard){
  var size=isBlizzard?(2+Math.random()*8):(1+Math.random()*5);
  return{x:Math.random()*snowCanvas.width,y:-10-Math.random()*50,size:size,
    speedY:(isBlizzard?3:0.5)+Math.random()*(isBlizzard?4:1.5),
    speedX:(Math.random()-0.5)*(isBlizzard?3:0.8),
    wobbleAmp:0.5+Math.random()*1.5,wobbleSpeed:0.01+Math.random()*0.02,
    phase:Math.random()*Math.PI*2,opacity:0.3+Math.random()*0.7,
    rotation:Math.random()*Math.PI*2,rotSpeed:(Math.random()-0.5)*0.03,
    type:Math.floor(Math.random()*3)};
}

function drawSnowflake(ctx,sf){
  ctx.save();ctx.translate(sf.x,sf.y);ctx.rotate(sf.rotation);ctx.globalAlpha=sf.opacity;
  if(sf.type===0){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,sf.size,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(200,220,240,0.3)';ctx.beginPath();ctx.arc(0,0,sf.size*1.5,0,Math.PI*2);ctx.fill();
  } else if(sf.type===1){
    ctx.fillStyle='#fff';ctx.beginPath();
    for(var i=0;i<6;i++){var a=(Math.PI/3)*i-Math.PI/2;var r1=sf.size;var r2=sf.size*0.4;
      ctx.lineTo(Math.cos(a)*r1,Math.sin(a)*r1);ctx.lineTo(Math.cos(a+Math.PI/6)*r2,Math.sin(a+Math.PI/6)*r2);}
    ctx.closePath();ctx.fill();
  } else {
    ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=sf.size*0.15;ctx.lineCap='round';
    for(var i=0;i<6;i++){var a=(Math.PI/3)*i;var len=sf.size;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*len,Math.sin(a)*len);ctx.stroke();
      var bx=Math.cos(a)*len*0.55;var by=Math.sin(a)*len*0.55;var blen=len*0.35;
      ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+Math.cos(a+0.5)*blen,by+Math.sin(a+0.5)*blen);ctx.stroke();
      ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+Math.cos(a-0.5)*blen,by+Math.sin(a-0.5)*blen);ctx.stroke();}
  }
  ctx.restore();
}

function updateSnow(time){
  if(!snowCanvas||!snowCtx)return;
  snowCtx.clearRect(0,0,snowCanvas.width,snowCanvas.height);
  if(snowIntensity===2){for(var i=0;i<3;i++)snowflakes.push(spawnSnowflake(true));}
  else if(snowIntensity===1){if(Math.random()<0.15)snowflakes.push(spawnSnowflake(false));}
  var maxFlakes=snowIntensity===2?300:40;
  if(snowflakes.length>maxFlakes)snowflakes.splice(0,snowflakes.length-maxFlakes);
  for(var i=snowflakes.length-1;i>=0;i--){
    var sf=snowflakes[i];
    sf.y+=sf.speedY;sf.x+=sf.speedX+Math.sin(time*sf.wobbleSpeed+sf.phase)*sf.wobbleAmp;sf.rotation+=sf.rotSpeed;
    if(sf.x<-20)sf.x=snowCanvas.width+20;if(sf.x>snowCanvas.width+20)sf.x=-20;
    if(sf.y>snowCanvas.height+20){snowflakes.splice(i,1);continue;}
    drawSnowflake(snowCtx,sf);
  }
  snowAnimId=requestAnimationFrame(updateSnow);
}

function startSnow(blizzard){
  if(!snowCanvas)initSnow();snowCanvas.classList.add('active');
  snowIntensity=blizzard?2:1;
  if(!snowAnimId)snowAnimId=requestAnimationFrame(updateSnow);
}
function stopSnow(){
  snowIntensity=0;
  setTimeout(function(){if(snowIntensity===0){if(snowAnimId){cancelAnimationFrame(snowAnimId);snowAnimId=null;}snowflakes=[];if(snowCanvas)snowCanvas.classList.remove('active');}},5000);
}
function spawnPetals(count){
  for(var i=0;i<count;i++){(function(i){setTimeout(function(){
    var p=document.createElement('div');p.className='petal';
    p.textContent=['🌸','🌺','💮','🏵️'][Math.floor(Math.random()*4)];
    p.style.left=(Math.random()*100)+'vw';
    p.style.animationDuration=(3+Math.random()*4)+'s';
    p.style.animationDelay=(Math.random()*0.5)+'s';
    p.style.fontSize=(10+Math.random()*10)+'px';
    document.body.appendChild(p);setTimeout(function(){p.remove();},8000);
  },i*100);})(i);}
}

/* ═══════ INIT ═══════ */
loadState();
// Apply saved season

if(currentSeason==='winter'){
  document.getElementById('seasonBtn').innerHTML='❄️ 冬';

  document.getElementById('headerTitle').style.webkitBackgroundClip='text';
  document.getElementById('headerTitle').style.webkitTextFillColor='transparent';
  document.getElementById('headerDesc').style.color='#8a9aaa';
  setTimeout(function(){startSnow(false);},500);
}
render();
switchTab('tasks');
</script>
