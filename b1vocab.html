{s:"1.3",a:"",w:"zuordnen",v:["ordnet zu","ordnete zu","hat zugeordnet"],vt:"可分动词",zh:"匹配，归类",en:"to match, assign",ex:"Ordnen Sie die Anzeigen den Personen zu.",exz:"请把广告和人对应起来。",n:"结构：jemandem（第三格）etwas（第四格）zuordnen。",lv:"m"}
];
const SEC={"1.1":"1.1 缩写","1.2":"1.2 外来词","1.3":"1.3 考试指令词"};
const LV={m:"题干必会",w:"要会写",r:"认得就行"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key=d=>d.s+"|"+d.w;
let mark={};
try{mark=JSON.parse(localStorage.getItem("b1vocab-mark")||"{}")}catch(e){mark={}}
const save=()=>{try{localStorage.setItem("b1vocab-mark",JSON.stringify(mark))}catch(e){}};
let tab="all";
try{tab=localStorage.getItem("b1vocab-tab")||"all"}catch(e){}
const $=id=>document.getElementById(id);
const gcls=a=>a?("g-"+a.split("/")[0]):"g-x";
function card(d){
const k=key(d),m=mark[k];
const art=d.a?`<span class="art de ${gcls(d.a)}">${esc(d.a)}</span>`:"";
const meta=[];
if(d.full)meta.push(`全称 <span class="de">${esc(d.full)}</span>`);
if(d.pl)meta.push(`复数 <span class="de">${esc(d.pl)}</span>`);
if(d.fem)meta.push(`女性 <span class="de">${esc(d.fem)}</span>`);
if(d.vt)meta.push(esc(d.vt));
const vf=d.v?`<div class="vf"><div><small>现在时 er/sie</small><span class="de">${esc(d.v[0])}</span></div><div><small>过去时</small><span class="de">${esc(d.v[1])}</span></div><div><small>完成时</small><span class="de">${esc(d.v[2])}</span></div></div>`:"";
return `<article class="card${m===1?" known":""}" data-k="${esc(k)}">
<div class="top">${art}<span class="w de">${esc(d.w)}</span><span class="tag lv-${d.lv}">${LV[d.lv]}</span></div>
${meta.length?`<div class="meta">${meta.join(" · ")}</div>`:""}${vf}
<div class="mean hid">${esc(d.zh)}<span class="en">${esc(d.en)}</span></div>
<p class="ex"><span class="de" style="color:var(--ink);font-size:15px">${esc(d.ex)}</span><span class="hid">${esc(d.exz)}</span></p>
${d.n?`<p class="note hid">${esc(d.n)}</p>`:""}
<div class="btns"><button data-v="1" class="${m===1?"sel":""}">认识了</button><button data-v="0" class="${m===0?"sel":""}">还不熟</button></div>
</article>`}
function draw(){
const q=$("q").value.trim().toLowerCase(),only=$("onlyNo").checked;
let html="",last="",n=0;
for(const d of D){
if(tab!=="all"&&d.s!==tab)continue;
if(only&&mark[key(d)]===1)continue;
if(q&&!(d.w+" "+d.zh+" "+(d.full||"")+" "+d.en).toLowerCase().includes(q))continue;
if(d.s!==last){html+=`<h2 class="sec">${SEC[d.s]}</h2>`;last=d.s}
html+=card(d);n++}
$("list").innerHTML=n?html:`<p class="empty">${only?"这一组全认识了，换一组吧":"没有找到"}</p>`;
stats()}
function stats(){
const ok=D.filter(d=>mark[key(d)]===1).length,no=D.filter(d=>mark[key(d)]===0).length;
$("nAll").textContent=D.length;$("nOk").textContent=ok;$("nNo").textContent=no;$("nNew").textContent=D.length-ok-no;
$("pg").style.width=(ok/D.length*100)+"%"}
function tabs(){
const t=[["all","全部"],...Object.entries(SEC)];
$("tabs").innerHTML=t.map(([k,v])=>`<button data-t="${k}" class="${k===tab?"on":""}">${v}</button>`).join("")}
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;try{localStorage.setItem("b1vocab-tab",tab)}catch(x){}tabs();draw();window.scrollTo({top:0})});
$("list").addEventListener("click",e=>{
const c=e.target.closest(".card");if(!c)return;
const b=e.target.closest("button[data-v]");
if(b){const v=+b.dataset.v,k=c.dataset.k;if(mark[k]===v)delete mark[k];else mark[k]=v;save();
c.classList.toggle("known",mark[k]===1);c.querySelectorAll("button[data-v]").forEach(x=>x.classList.toggle("sel",mark[k]===+x.dataset.v));stats();return}
if(document.body.classList.contains("hide"))c.classList.toggle("open")});
$("q").addEventListener("input",draw);
$("onlyNo").addEventListener("change",draw);
$("hide").addEventListener("change",e=>{document.body.classList.toggle("hide",e.target.checked);document.querySelectorAll(".card.open").forEach(c=>c.classList.remove("open"))});
tabs();draw();
}
</script>
