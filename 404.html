<script>

(function(){
  var p="";try{p=decodeURIComponent(location.pathname);}catch(e){p=location.pathname;}
  if(p.indexOf("\u5bf9\u8bdd\u67e5\u770b\u5668")!==-1){
    location.replace(location.pathname.replace(/[^\/]*$/,"")+encodeURIComponent("\u514b\u62c9\u62c9\u7684\u5bf9\u8bdd\u67e5\u770b\u5668_\u624b\u673a\u7248.html"));
  }
})();
</script>
