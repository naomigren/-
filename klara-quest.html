<title>克拉拉养成计划</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Caveat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{background:#fdf2f0;overflow-x:hidden;max-width:100%;}
body{min-height:100vh;width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y;position:relative;background:linear-gradient(160deg,#fdf2f0 0%,#f5e6e0 40%,#f0e0da 100%);color:#5a4a4a;font-family:'Noto Sans SC','Segoe UI',sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
button{cursor:pointer;border:none;background:none;font-family:inherit;-webkit-tap-highlight-color:transparent;}
textarea,input{font-family:inherit;-webkit-appearance:none;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:rgba(219,147,158,0.3);border-radius:4px;}
@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-20px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
@keyframes sparkle{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(219,147,158,0.3);}50%{box-shadow:0 0 40px rgba(219,147,158,0.5);}}
.bg1{position:fixed;top:-20%;right:-10%;width:500px;height:500px;background:radial-gradient(circle,rgba(219,147,158,0.08) 0%,transparent 70%);border-radius:50%;pointer-events:none;}
.bg2{position:fixed;bottom:-10%;left:-10%;width:400px;height:400px;background:radial-gradient(circle,rgba(199,163,163,0.06) 0%,transparent 70%);border-radius:50%;pointer-events:none;}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:14px 24px;border-radius:14px;z-index:1000;font-size:15px;font-weight:600;max-width:90vw;text-align:center;color:white;box-shadow:0 8px 32px rgba(255,255,255,0.7);animation:slideDown 0.3s ease-out;}
.toast-earn{background:linear-gradient(135deg,#7ba889,#6b9a7a);}.toast-big{background:linear-gradient(135deg,#c4868e,#d4a0a0);}.toast-redeem{background:linear-gradient(135deg,#c9a878,#d4b888);}.toast-penalty{background:linear-gradient(135deg,#c07070,#d48888);}.toast-fail{background:linear-gradient(135deg,#374151,#4b5563);}.toast-card{background:linear-gradient(135deg,#8a7a9a,#a08aaa);}
.inp{width:100%;padding:8px 12px;border-radius:8px;font-size:14px;background:rgba(255,255,255,0.6);color:#5a4a4a;border:1px solid rgba(219,147,158,0.2);outline:none;box-sizing:border-box;}
.tab-btn{flex:1;padding:10px;border-radius:10px;font-size:13px;transition:all 0.2s ease;}
.tab-active{font-weight:600;color:#fff;background:linear-gradient(135deg,rgba(219,147,158,0.3),rgba(199,163,163,0.2));}
.tab-inactive{font-weight:400;color:#a08888;background:transparent;}
.task-btn{display:flex;align-items:center;justify-content:space-between;width:100%;min-width:0;box-sizing:border-box;padding:12px 14px;border-radius:10px;color:#5a4a4a;border:1px solid rgba(219,147,158,0.2);background:rgba(255,255,255,0.5);}
.task-btn-big{background:linear-gradient(135deg,rgba(219,147,158,0.12),rgba(199,163,163,0.08));border:1px solid rgba(219,147,158,0.25);}
.pen-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;background:rgba(210,140,140,0.06);border-radius:10px;border:1px solid rgba(210,140,140,0.15);color:#c08888;}
.pts{font-size:13px;font-weight:700;font-family:'Outfit';white-space:nowrap;margin-left:8px;}
.section-title{font-size:15px;font-weight:600;margin-bottom:10px;}
.hidden{display:none;}
@keyframes achieveSlideIn{0%{opacity:0;transform:translate(-50%,-50%) scale(0.5);}60%{transform:translate(-50%,-50%) scale(1.05);}100%{opacity:1;transform:translate(-50%,-50%) scale(1);}}
@keyframes achieveGlow{0%,100%{box-shadow:0 0 30px rgba(196,134,142,0.4);}50%{box-shadow:0 0 60px rgba(196,134,142,0.7);}}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}
@keyframes epicFlash{0%{opacity:0;}15%{opacity:0.3;}30%{opacity:0;}100%{opacity:0;}}
@keyframes shakeIt{0%,100%{transform:translateX(0);}25%,75%{transform:translateX(-3px);}50%{transform:translateX(3px);}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 8px rgba(163,176,196,0.3);}50%{box-shadow:0 0 16px rgba(163,176,196,0.5);}}
.achieve-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2000;display:flex;align-items:center;justify-content:center;}
.achieve-overlay-bg{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);}
.achieve-card{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2001;width:85vw;max-width:340px;border-radius:20px;padding:28px 24px;text-align:center;}
.achieve-card-normal{background:linear-gradient(145deg,#e8edf3,#d5dce6);border:2px solid #a3b0c4;box-shadow:0 8px 32px rgba(163,176,196,0.4);}
.achieve-card-rare{background:linear-gradient(145deg,#e8e8ef,#d8d8e2);border:2px solid #a8a8b8;box-shadow:0 8px 32px rgba(168,168,184,0.4);animation:pulseGlow 2s ease-in-out infinite;}
.achieve-card-epic{background:linear-gradient(145deg,#faf5eb,#f0e8d8);border:2px solid #d4a840;box-shadow:0 8px 32px rgba(212,168,64,0.4);animation:achieveGlow 2s ease-in-out infinite;}
.achieve-card-legend{background:linear-gradient(145deg,#f5ede8,#efe4de);border:2px solid transparent;box-shadow:0 12px 48px rgba(196,134,142,0.5);animation:achieveSlideIn 0.5s ease-out;}
.confetti-piece{position:fixed;top:-10px;z-index:2002;pointer-events:none;animation:confettiFall linear forwards;}
.epic-flash{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1999;pointer-events:none;animation:epicFlash 0.6s ease-out forwards;}
@keyframes legendLockedPulse{0%,100%{border-color:rgba(196,134,142,0.2);box-shadow:0 0 12px rgba(196,134,142,0.08);}50%{border-color:rgba(196,134,142,0.45);box-shadow:0 0 20px rgba(196,134,142,0.15);}}
@keyframes epicLockedShimmer{0%,100%{border-color:rgba(212,168,64,0.15);box-shadow:0 0 8px rgba(212,168,64,0.05);}50%{border-color:rgba(212,168,64,0.35);box-shadow:0 0 14px rgba(212,168,64,0.1);}}

.ach-wall-card{padding:14px 16px;border-radius:14px;margin-bottom:10px;position:relative;overflow:hidden;}
.ach-locked-normal{background:linear-gradient(135deg,rgba(163,176,196,0.06),rgba(163,176,196,0.02));border:1px dashed rgba(163,176,196,0.25);}
.ach-locked-rare{background:linear-gradient(135deg,rgba(168,168,184,0.08),rgba(168,168,184,0.03));border:1px dashed rgba(168,168,184,0.25);animation:rareLockedGlow 3s ease-in-out infinite;}
.ach-locked-epic{background:linear-gradient(135deg,rgba(212,168,64,0.06),rgba(212,168,64,0.02));border:1px dashed rgba(212,168,64,0.2);animation:epicLockedShimmer 3s ease-in-out infinite;}
.ach-locked-legend{background:linear-gradient(135deg,rgba(196,134,142,0.08),rgba(199,163,163,0.04));border:1.5px dashed rgba(196,134,142,0.25);animation:legendLockedPulse 3s ease-in-out infinite;}
.ach-unlocked-normal{background:linear-gradient(135deg,rgba(163,176,196,0.12),rgba(163,176,196,0.06));border:1px solid rgba(163,176,196,0.3);}
.ach-unlocked-rare{background:linear-gradient(135deg,rgba(168,168,184,0.12),rgba(168,168,184,0.06));border:1px solid rgba(168,168,184,0.3);}
.ach-unlocked-epic{background:linear-gradient(135deg,rgba(212,168,64,0.1),rgba(212,168,64,0.04));border:1px solid rgba(212,168,64,0.3);}
.ach-unlocked-legend{background:linear-gradient(135deg,rgba(196,134,142,0.12),rgba(199,163,163,0.06));border:1px solid rgba(196,134,142,0.3);animation:glow 3s ease-in-out infinite;}

/* CARD FRAGMENT SYSTEM */
.card-carousel-wrap{position:relative;margin:0 0 20px;overflow:hidden;}
.card-carousel{display:flex;overflow-x:auto;touch-action:pan-x;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:14px;padding:0 8px;}
.card-carousel::-webkit-scrollbar{display:none;}
.card-slot{flex:0 0 82vw;max-width:360px;scroll-snap-align:center;border-radius:16px;overflow:hidden;position:relative;background:#3a3035;box-shadow:0 6px 24px rgba(80,60,68,0.22);}
@keyframes cardGlow{0%,100%{box-shadow:0 6px 24px rgba(212,180,140,0.25);}50%{box-shadow:0 8px 32px rgba(212,180,140,0.45);}}
.card-slot-done{border:2px solid rgba(212,180,140,0.5);animation:cardGlow 3s ease-in-out infinite;}
.card-img-wrap{position:relative;width:100%;padding-top:133%;overflow:hidden;}
.card-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;}
.card-mask{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
.card-piece{position:absolute;background:rgba(55,45,50,0.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:opacity 0.8s ease;border:0.5px solid rgba(100,85,90,0.18);}
.card-piece.unlocked{opacity:0;backdrop-filter:none;-webkit-backdrop-filter:none;}
.card-info{padding:10px 14px;text-align:center;background:rgba(50,40,45,0.55);}
.card-info-name{font-size:14px;font-weight:600;color:rgba(230,215,210,0.88);letter-spacing:1px;margin-bottom:2px;}
.card-info-line{font-size:11px;color:rgba(199,170,165,0.6);margin-bottom:4px;}
.card-info-prog{font-family:'Outfit';font-size:13px;font-weight:700;color:rgba(219,180,175,0.85);}
.card-dots{display:flex;justify-content:center;gap:6px;padding:8px 0 2px;}
.card-dot{width:7px;height:7px;border-radius:50%;background:rgba(219,147,158,0.2);transition:all 0.3s;}
.card-dot.active{background:rgba(219,147,158,0.55);transform:scale(1.25);}
.card-lock{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;opacity:0.35;z-index:5;transition:opacity 0.5s;pointer-events:none;}
.card-lock.hide{opacity:0;}
.card-reveal-ov{position:fixed;top:0;left:0;width:100%;height:100%;z-index:3000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0);transition:background 0.5s;pointer-events:none;opacity:0;}
.card-reveal-ov.on{background:rgba(20,15,18,0.88);pointer-events:all;opacity:1;}
.card-reveal-box{position:relative;width:78vw;max-width:340px;border-radius:16px;overflow:hidden;box-shadow:0 12px 60px rgba(196,134,142,0.35);transform:scale(0.8);transition:transform 0.8s cubic-bezier(0.16,1,0.3,1);opacity:0;}
.card-reveal-ov.on .card-reveal-box{transform:scale(1);opacity:1;}
.card-reveal-img{width:100%;display:block;filter:blur(20px);transition:filter 2s ease;}
.card-reveal-img.clear{filter:blur(0);}
.card-reveal-cap{position:absolute;bottom:0;left:0;right:0;padding:20px;text-align:center;background:linear-gradient(transparent,rgba(20,15,18,0.8));opacity:0;transition:opacity 1s ease 1.5s;}
.card-reveal-ov.on .card-reveal-cap{opacity:1;}

/* DAILY PLAN */
@keyframes dpBounceIn{0%{opacity:0;transform:translateY(-15px) scale(0.9);}50%{transform:translateY(4px) scale(1.02);}100%{opacity:1;transform:translateY(0) scale(1);}}
@keyframes dpStarBurst{0%{opacity:1;transform:scale(0.5);}60%{opacity:1;transform:scale(1.3);}100%{opacity:0;transform:scale(1.8);}}
@keyframes dpCheckPop{0%{transform:scale(1);}30%{transform:scale(0.92);}60%{transform:scale(1.06);}100%{transform:scale(1);}}
@keyframes dpSparkle{0%,100%{opacity:0;transform:scale(0) rotate(0deg);}50%{opacity:1;transform:scale(1) rotate(180deg);}}
@keyframes dpFloat{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-30px);}}
.dp-wrap{margin-bottom:20px;}
.dp-msg{padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,rgba(219,147,158,0.1),rgba(199,163,163,0.06));border:1px solid rgba(219,147,158,0.2);margin-bottom:16px;font-size:13px;line-height:1.7;color:#6a5555;min-height:50px;position:relative;overflow:hidden;}
.dp-msg-loading{color:#b09898;font-style:italic;}
.dp-msg-quote{font-style:italic;color:#8a6a6e;}
.dp-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,0.55);border:1px solid rgba(219,147,158,0.15);margin-bottom:8px;position:relative;overflow:hidden;animation:dpBounceIn 0.4s ease-out;}
.dp-item.done{background:rgba(219,147,158,0.08);border-color:rgba(219,147,158,0.25);}
.dp-item.done .dp-item-name{text-decoration:line-through;color:#b09898;}
.dp-check{width:26px;height:26px;border-radius:50%;border:2px solid rgba(219,147,158,0.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.3s;font-size:13px;cursor:pointer;}
.dp-check.checked{background:linear-gradient(135deg,#c4868e,#d4a0a0);border-color:#c4868e;color:#fff;animation:dpCheckPop 0.4s ease;}
.dp-item-name{flex:1;font-size:14px;color:#5a4a4a;}
.dp-time{font-size:11px;color:#b09898;font-family:'Outfit';white-space:nowrap;}
.dp-time-input{width:48px;padding:3px 4px;border-radius:6px;font-size:11px;text-align:center;background:rgba(255,255,255,0.7);border:1px solid rgba(219,147,158,0.2);color:#6a5555;font-family:'Outfit';outline:none;}
.dp-rm{padding:2px 8px;border-radius:6px;font-size:11px;color:#c07070;background:rgba(210,140,140,0.1);cursor:pointer;flex-shrink:0;}
.dp-stars{position:absolute;top:50%;left:50%;pointer-events:none;}
.dp-star{position:absolute;width:8px;height:8px;background:#c4868e;border-radius:50%;animation:dpStarBurst 0.6s ease-out forwards;}
.dp-float-pts{position:absolute;right:14px;top:-5px;font-family:'Outfit';font-weight:700;font-size:14px;color:#c4868e;pointer-events:none;animation:dpFloat 1s ease-out forwards;}
.dp-add-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:600;color:#c4868e;background:rgba(219,147,158,0.1);border:1px solid rgba(219,147,158,0.2);cursor:pointer;transition:all 0.2s;}
.dp-add-btn:active{transform:scale(0.95);background:rgba(219,147,158,0.2);}
.dp-done-card{padding:20px;border-radius:16px;text-align:center;background:linear-gradient(145deg,rgba(219,147,158,0.12),rgba(199,163,163,0.06));border:1px solid rgba(219,147,158,0.25);margin-top:16px;animation:dpBounceIn 0.5s ease-out;}

.hq-panel{margin-top:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(180,165,200,0.1),rgba(200,185,210,0.06));border:1px solid rgba(180,165,200,0.2);}
.hq-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:10px;font-size:12px;font-weight:600;color:#9b8ab8;background:rgba(180,165,200,0.12);border:1px solid rgba(180,165,200,0.25);cursor:pointer;transition:all 0.2s;}
.hq-btn:active{transform:scale(0.95);background:rgba(180,165,200,0.25);}
.hq-input{width:100%;padding:8px 10px;border-radius:8px;font-size:13px;background:rgba(255,255,255,0.7);border:1px solid rgba(180,165,200,0.2);color:#5a4a5a;outline:none;margin-bottom:6px;font-family:'Noto Sans SC',sans-serif;}
.hq-sel{padding:5px 8px;border-radius:8px;font-size:12px;background:rgba(255,255,255,0.7);border:1px solid rgba(180,165,200,0.2);color:#5a4a5a;outline:none;font-family:'Noto Sans SC',sans-serif;}

/* PALACE TAB */
.hide-scrollbar::-webkit-scrollbar{display:none;}
.hide-scrollbar{touch-action:pan-x;overscroll-behavior-x:contain;}
.pl-flower-wrap{position:relative;width:100%;height:180px;border-radius:16px;margin-bottom:16px;overflow:hidden;}
.pl-flower-wrap canvas{width:100%;height:100%;display:block;}
.pl-header{text-align:center;padding:18px 16px 14px;background:rgba(253,250,249,0.85);backdrop-filter:blur(8px);border-radius:16px;box-shadow:0 2px 12px rgba(138,90,96,0.06);margin-bottom:16px;position:relative;overflow:hidden;}
.pl-header::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ecd4d6,#c48e93,#ecd4d6);}
.pl-header h2{font-family:'Playfair Display',serif;font-weight:400;font-size:1.25rem;color:#8a5a60;letter-spacing:2px;margin-bottom:2px;}
.pl-sub{font-family:'Caveat',cursive;font-size:0.85rem;color:#b08a8e;letter-spacing:1px;}
.pl-goal{font-size:0.72rem;color:#d6a6aa;margin-top:4px;}
.pl-stats{display:flex;justify-content:center;gap:20px;margin-top:10px;font-size:0.75rem;color:#b08a8e;}
.pl-stats b{color:#8a5a60;font-size:0.95rem;font-family:'Playfair Display',serif;}
.pl-chart-wrap{margin-top:12px;height:160px;position:relative;background:#f9f0f1;border-radius:10px;padding:8px;}
.pl-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:0 auto 16px;}
.pl-day{aspect-ratio:1;background:#fdfaf9;border:1.5px solid #ecd4d6;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Caveat',cursive;font-size:0.75rem;color:#b08a8e;cursor:pointer;transition:all 0.3s;position:relative;overflow:hidden;}
.pl-day:hover{transform:translateY(-2px);box-shadow:0 3px 10px rgba(138,90,96,0.1);}
.pl-day.active{background:linear-gradient(135deg,#c48e93,#d6a6aa);color:white;border-color:#c48e93;box-shadow:0 2px 8px rgba(196,142,147,0.3);}
.pl-day.active::after{content:'\2713';position:absolute;font-size:0.45rem;top:1px;right:2px;opacity:0.7;}
.pl-day.has-meals::before{content:'\1F37D';position:absolute;bottom:1px;right:1px;font-size:0.35rem;}
.pl-day.milestone{border-color:#c8b070;border-width:2px;}
.pl-day.milestone.active{background:linear-gradient(135deg,#c8b070,#d4c490);border-color:#c8b070;}
.pl-day.reward-cell{border-style:dashed;border-color:#e0bfc2;}
.pl-card{background:#fdfaf9;border-radius:16px;box-shadow:0 2px 12px rgba(138,90,96,0.06);padding:18px;margin-bottom:16px;position:relative;overflow:hidden;}
.pl-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ecd4d6,#d6a6aa,#ecd4d6);}
.pl-card h3{font-family:'Playfair Display',serif;font-weight:400;font-size:0.95rem;color:#8a5a60;margin-bottom:10px;letter-spacing:1px;}
.pl-reward-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:0.8rem;}
.pl-reward-label{font-family:'Caveat',cursive;font-size:0.9rem;color:#c8b070;min-width:38px;}
.pl-reward-input{flex:1;padding:6px 10px;border:1px solid #ecd4d6;border-radius:8px;font-size:0.78rem;color:#5a3a40;background:#f9f0f1;outline:none;}
.pl-reward-input:focus{border-color:#c48e93;}
.pl-whisper-btn{width:100%;margin-top:10px;background:#e0bfc2;color:#5a3a40;border:none;padding:10px;border-radius:10px;cursor:pointer;font-size:0.78rem;}
.pl-vision-item{background:#f9f0f1;border-radius:12px;padding:12px 14px;margin-bottom:10px;position:relative;}
.pl-vision-item p{font-size:0.82rem;color:#5a3a40;line-height:1.6;}
.pl-vision-item img{width:100%;border-radius:10px;margin-top:6px;max-height:200px;object-fit:cover;}
.pl-vision-item .del-v{position:absolute;top:6px;right:8px;background:none;border:none;color:#e0bfc2;font-size:0.9rem;cursor:pointer;}
.pl-vision-add textarea{width:100%;padding:8px;border:1px solid #ecd4d6;border-radius:8px;font-size:0.78rem;color:#5a3a40;resize:none;height:40px;outline:none;margin-bottom:8px;}
.pl-img-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.pl-img-row label{font-size:0.75rem;color:#c48e93;cursor:pointer;border:1px dashed #d6a6aa;padding:4px 12px;border-radius:8px;}
.pl-img-row span{font-size:0.68rem;color:#b08a8e;}
.pl-img-row input[type="file"]{display:none;}
.pl-btn-vision{background:#d6a6aa;color:white;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:0.75rem;}
.pl-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(90,58,64,0.2);backdrop-filter:blur(4px);z-index:90;}
.pl-panel{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fdfaf9;padding:22px 20px;border-radius:16px;width:90%;max-width:400px;z-index:100;box-shadow:0 8px 40px rgba(90,58,64,0.15);max-height:85vh;overflow-y:auto;}
.pl-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#d6a6aa,#8a5a60,#d6a6aa);border-radius:16px 16px 0 0;}
.pl-panel-close{position:absolute;top:10px;right:14px;background:none;border:none;font-size:1.1rem;color:#e0bfc2;cursor:pointer;}
.pl-panel h3{font-family:'Playfair Display',serif;font-weight:400;font-size:1rem;color:#8a5a60;margin-bottom:14px;text-align:center;}
.pl-panel label{display:block;font-family:'Caveat',cursive;font-size:0.88rem;color:#b08a8e;margin:10px 0 4px;}
.pl-panel input[type="number"]{width:100%;padding:7px 10px;border:1px solid #ecd4d6;border-radius:8px;font-size:0.82rem;color:#5a3a40;background:#f9f0f1;outline:none;}
.pl-mood-row{display:flex;gap:8px;margin:6px 0 10px;font-size:1.3rem;}
.pl-mood-btn{cursor:pointer;transition:transform 0.15s;padding:2px;}
.pl-mood-btn.selected{transform:scale(1.3);filter:drop-shadow(0 2px 4px rgba(196,142,147,0.4));}
.pl-water-row{display:flex;gap:4px;margin:6px 0 10px;}
.pl-water-cup{font-size:1.1rem;cursor:pointer;opacity:0.25;transition:opacity 0.2s;}
.pl-water-cup.filled{opacity:1;}
.pl-meal-section{text-align:left;margin:10px 0;padding:10px;background:#f9f0f1;border-radius:12px;}
.pl-meal-section h4{font-family:'Caveat',cursive;font-size:0.88rem;color:#c48e93;margin-bottom:6px;}
.pl-meal-row{display:flex;gap:5px;align-items:center;margin-bottom:4px;}
.pl-meal-row input[type="text"]{flex:1;padding:5px 8px;border:1px solid #ecd4d6;border-radius:6px;font-size:0.75rem;background:white;outline:none;color:#5a3a40;}
.pl-meal-row input[type="number"]{width:52px;padding:5px 6px;border:1px solid #ecd4d6;border-radius:6px;font-size:0.75rem;text-align:center;background:white;outline:none;color:#5a3a40;}
.pl-meal-row .unit{font-size:0.6rem;color:#b08a8e;white-space:nowrap;}
.pl-meal-row .rm{background:none;border:none;color:#e0bfc2;font-size:0.85rem;cursor:pointer;padding:0 3px;}
.pl-meal-total{font-size:0.8rem;color:#c48e93;text-align:right;margin-top:4px;font-family:'Caveat',cursive;}
.pl-ex-section{text-align:left;margin:10px 0;padding:10px;background:#e8f0e8;border-radius:12px;}

.pl-ex-row{display:flex;gap:5px;align-items:center;margin-bottom:4px;}
.pl-ex-row input[type="text"]{flex:1;padding:5px 8px;border:1px solid #cde0cd;border-radius:6px;font-size:0.75rem;background:white;outline:none;color:#5a3a40;}
.pl-ex-row input[type="number"]{width:42px;padding:5px 4px;border:1px solid #cde0cd;border-radius:6px;font-size:0.75rem;text-align:center;background:white;outline:none;color:#5a3a40;}
.pl-ex-total{font-size:0.8rem;color:#7a9a6a;text-align:right;margin-top:4px;font-family:'Caveat',cursive;}
.pl-day-total{font-size:0.82rem;color:#8a5a60;margin:10px 0;padding:10px;background:#f9f0f1;border-radius:10px;text-align:center;}
.pl-day-total strong{color:#c48e93;}
.pl-btn-save{width:100%;background:#c48e93;color:white;border:none;padding:12px;border-radius:10px;cursor:pointer;font-size:0.85rem;letter-spacing:3px;margin-top:10px;}
.pl-add-btn{background:none;border:1px dashed;padding:3px 10px;font-size:0.68rem;border-radius:8px;cursor:pointer;}
.pl-whisper-ov{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(90,58,64,0.2);backdrop-filter:blur(4px);z-index:300;}
.pl-whisper-pop{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fdfaf9;padding:28px 24px;border-radius:16px;width:82%;max-width:320px;z-index:310;box-shadow:0 8px 40px rgba(90,58,64,0.18);text-align:center;}

.pl-panel{overflow-x:hidden;}
.pl-meal-row input[type="text"],.pl-ex-row input[type="text"]{min-width:0;}
.pl-ex-row{flex-wrap:wrap;row-gap:6px;}
.pl-ex-row input[type="text"]{flex:1 1 100%;}
.pl-ex-row input[type="number"]{width:56px;flex:0 0 56px;}
.pl-ex-row .unit,.pl-meal-row .unit{white-space:nowrap;}
.pl-ex-row .unit{font-size:0.65rem;color:#7a9a6a;}
.pl-meal-row input[type="number"]{flex:0 0 56px;width:56px;}

.bd-card-name{font-size:12px;color:#c8a860;letter-spacing:3px;margin-top:4px;}

.rk-foot button{flex:1;padding:8px;border-radius:9px;border:1px solid #ecd4d6;background:#fdfaf9;color:#b08a8e;font-size:0.72rem;cursor:pointer;}
.rk-artgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 18px 0;}
.rk-thumb{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
.rk-thumb img,.rk-thumb-empty{width:100%;aspect-ratio:3/4.4;object-fit:cover;object-position:top;border-radius:8px;border:1px solid #ecd4d6;}
.rk-thumb-empty{display:flex;align-items:center;justify-content:center;color:#d6a6aa;background:#f9f0f1;}
.rk-thumb span{font-size:0.62rem;color:#8a5a60;}

.rk-logrow.up span:nth-child(2){color:#7a9a6a;font-weight:700;}
.rk-logrow.down span:nth-child(2){color:#c07070;font-weight:700;}
.rk-logrow span:first-child{color:#b08a8e;}
.rk-logrow em{font-style:normal;color:#8a7a7a;text-align:right;}
#rkOverlay{display:none;position:fixed;inset:0;z-index:400;background:rgba(90,58,64,0.38);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px;}
.rk-ov-box{width:100%;max-width:340px;max-height:88vh;overflow-y:auto;background:#fdfaf9;border-radius:18px;text-align:center;padding-bottom:18px;box-shadow:0 12px 50px rgba(90,58,64,0.25);animation:rkIn .5s cubic-bezier(.2,.9,.3,1.2);}
.rk-ov-art{width:100%;aspect-ratio:3/4;max-height:52vh;overflow:hidden;border-radius:18px 18px 0 0;}
.rk-ov-art img{width:100%;height:110%;object-fit:cover;object-position:center top;display:block;}
.rk-ov-box.tier .rk-ov-art img{animation:rkReveal 1.1s ease;}

.rk-ov-name{font-family:'Playfair Display','Songti SC','STSong',serif;font-size:1.9rem;color:#8a5a60;letter-spacing:3px;margin:4px 0;}
.rk-ov-from{font-size:0.72rem;color:#b08a8e;}

@keyframes rkIn{from{opacity:0;transform:scale(.9) translateY(12px)}to{opacity:1;transform:none}}

let _cardFragQ=[];
function checkCardFragments(){
  const conds=getFragConds();
  let changed=false;
  CARD_DEFS.forEach(cd=>{
    const arr=S.cards[cd.id];
    const c=conds[cd.id];
    c.forEach((met,i)=>{
      if(met && !arr[i]){
        arr[i]=true; changed=true;
        const done=arr.filter(Boolean).length;
        if(done===cd.total){
          _cardFragQ.push({type:'full',card:cd});
        } else {
          _cardFragQ.push({type:'frag',card:cd,idx:done,total:cd.total});
        }
      }
    });
  });
  if(changed){saveState();if(currentTab==='achieve')renderAchieve();}
  if(_cardFragQ.length){processCardQ();}
}
function processCardQ(){
  if(!_cardFragQ.length)return;
  const ev=_cardFragQ.shift();
  if(ev.type==='frag'){
    flash('✨ 「'+ev.card.name+'」碎片 '+ev.idx+'/'+ev.total+' 已揭示','card');
    setTimeout(processCardQ,1200);
  } else {
    showCardReveal(ev.card);
  }
}

function stripImages(obj){var c=JSON.parse(JSON.stringify(obj));if(c.wishes){Object.keys(c.wishes).forEach(function(k){if(c.wishes[k].evidence)c.wishes[k].evidence="__IMG__";});}if(c.pyqPosts){c.pyqPosts.forEach(function(p){if(p.photos&&p.photos.length>0)p.photos=p.photos.map(function(){return"__IMG__";});});}if(c.pl&&c.pl.visionItems){c.pl.visionItems.forEach(function(v){if(v.img)v.img="__IMG__";});}if(c.rank&&c.rank.art){Object.keys(c.rank.art).forEach(function(k){if(c.rank.art[k])c.rank.art[k]="__IMG__";});}return c;}

function loadImagesFromLS(){try{var imgs=JSON.parse(localStorage.getItem("klara-quest-imgs")||"{}");if(S.wishes){Object.keys(S.wishes).forEach(function(k){if(S.wishes[k].evidence==="__IMG__"&&imgs["wish_"+k])S.wishes[k].evidence=imgs["wish_"+k];});}if(S.pyqPosts){S.pyqPosts.forEach(function(p,i){if(p.photos){p.photos=p.photos.map(function(src,j){return src==="__IMG__"&&imgs["pyq_"+i+"_"+j]?imgs["pyq_"+i+"_"+j]:src;});}});}if(S.pl&&S.pl.visionItems){S.pl.visionItems.forEach(function(v,i){if(v.img==="__IMG__"&&imgs["vision_"+i])v.img=imgs["vision_"+i];});}if(S.rank&&S.rank.art){Object.keys(S.rank.art).forEach(function(k){if(S.rank.art[k]==="__IMG__"){if(imgs["rkart_"+k])S.rank.art[k]=imgs["rkart_"+k];else delete S.rank.art[k];}});}}catch(e){}}
function encode(s){return btoa(unescape(encodeURIComponent(JSON.stringify(stripImages(s)))));}
function decode(s){try{return JSON.parse(decodeURIComponent(escape(atob(s.trim()))));}catch{return null;}}

const DE_TASKS=new Set(["de_vocab","de_grammar","de_friends","de_speak","de_listen","de_write","de_read","de_shadow","de_mistakes","de_mock","de_level"]);
function doTask(id,name,pts,em,praise,attrMap){
  var _a=TASK_ATTRS[id]||attrMap||{will:1};
  if(typeof bdIsWeek==="function"&&typeof BD_SHOP!=="undefined"&&BD_SHOP&&bdIsWeek()&&pts>0){pts=pts*2;name=name+" 🎂×2";}
  S.h.unshift({t:"e",n:name,p:pts,d:new Date().toISOString(),_id:id,_attrs:{..._a}});if(S.h.length>200)S.h.length=200;
  S.cp+=pts;S.tp+=pts;if(DE_TASKS.has(id))S.de=(S.de||0)+pts;
  applyAttrs(_a);
  const td=todayStr();if(!S.dailyTasks[td])S.dailyTasks[td]=[];S.dailyTasks[td].push(id);S.taskCounts[id]=(S.taskCounts[id]||0)+1;S.dailyPts[td]=(S.dailyPts[td]||0)+pts;
  saveState();render();const pl=PRAISE[id];const pr=pl?rp(pl):(praise||`+${pts}分！`);
  flash(pts>=100?pr:`${em} ${pr}`,pts>=100?"big":"earn");
  setTimeout(()=>{checkAchievements();checkCardFragments();},300);
}
function doPen(id,name,pts,em,attrMap){
  var _a=PEN_ATTRS[id]||attrMap||{};
  S.h.unshift({t:"p",n:name,p:pts,d:new Date().toISOString(),_id:id,_attrs:{..._a}});if(S.h.length>200)S.h.length=200;
  var _cp0=S.cp,_tp0=S.tp,_bf={};Object.keys(_a).forEach(function(k){_bf[k]=S.attrs[k]||0;});
  S.cp=Math.max(0,S.cp+pts);S.tp=Math.max(0,S.tp+pts);applyAttrs(_a);
  var _real={};Object.keys(_a).forEach(function(k){_real[k]=(S.attrs[k]||0)-_bf[k];});S.h[0]._attrs=_real;S.h[0]._cpd=S.cp-_cp0;S.h[0]._tpd=S.tp-_tp0;
  const td=todayStr();if(!S.dailyPens[td])S.dailyPens[td]=[];S.dailyPens[td].push(id);

function undoLast(){
  if(!S.h.length){flash("没有可撤回的记录！","fail");return;}
  const last=S.h[0];
  const confirmMsg="撤回「"+last.n+"」（"+(last.p>0?"+":"")+last.p+"分）？";
  if(!confirm(confirmMsg))return;
  S.h.shift();
  /* reverse points */
  if(last.t==="e"){S.cp-=last.p;S.tp-=last.p;if(DE_TASKS.has(last._id))S.de=Math.max(0,(S.de||0)-last.p);}
  else if(last.t==="p"){S.cp=Math.max(0,S.cp-(last._cpd!==undefined?last._cpd:last.p));S.tp=Math.max(0,S.tp-(last._tpd!==undefined?last._tpd:last.p));}
  else if(last.t==="r"){S.cp+=Math.abs(last.p);}
  else if(last.t==="a"){S.cp-=last.p;S.tp-=last.p;}
  else if(last.t==="hq"){S.cp-=last.p;S.tp-=last.p;}
  /* reverse attrs */
  if(last._attrs){Object.entries(last._attrs).forEach(([k,v])=>{if(S.attrs[k]!==undefined)S.attrs[k]=Math.max(0,S.attrs[k]-v);});}
  /* reverse dailyTasks/dailyPens */
  var _utd=last.d?_dk(last.d):todayStr();
  if(last.t==="e"||last.t==="hq"){S.dailyPts[_utd]=(S.dailyPts[_utd]||0)-last.p;}
  if(last._id&&last.d){const td=_utd;
    if(last.t==="e"&&S.dailyTasks[td]){const idx=S.dailyTasks[td].lastIndexOf(last._id);if(idx!==-1)S.dailyTasks[td].splice(idx,1);S.taskCounts[last._id]=Math.max(0,(S.taskCounts[last._id]||1)-1);
      try{if(td===todayStr()&&S.dailyPlan&&S.dailyPlan.items){var _pi=null;S.dailyPlan.items.forEach(function(it){if(it.taskId===last._id&&it.done&&(!_pi||(it.doneAt||"")>(_pi.doneAt||"")))_pi=it;});if(_pi){_pi.done=false;delete _pi.doneAt;}}}catch(_e){}}
    if(last.t==="p"){var _ptd=td;if(!S.dailyPens[_ptd]||!S.dailyPens[_ptd].includes(last._id)){_ptd=todayStr();}if(S.dailyPens[_ptd]){const idx=S.dailyPens[_ptd].lastIndexOf(last._id);if(idx!==-1)S.dailyPens[_ptd].splice(idx,1);}}
  }
  saveState();render();renderDaily();flash("↩️ 已撤回："+last.n,"penalty");
}

function todayStr(){var d=new Date();if(d.getHours()>=23){d.setDate(d.getDate()+1);}return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function _lk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function _dk(iso){var d=new Date(iso);if(isNaN(d))return '';if(d.getHours()>=23)d.setDate(d.getDate()+1);return _lk(d);}
function yesterdayStr(){var d=new Date();if(d.getHours()<23){d.setDate(d.getDate()-1);}return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysBetween(a,b){return Math.floor((new Date(b)-new Date(a))/86400000);}
function tList(){return S.dailyTasks[todayStr()]||[];}
function hasPenToday(id){return(S.dailyPens[todayStr()]||[]).includes(id);}
function cnt(id){return S.taskCounts[id]||0;}
function cntFear(){return["contact_teacher","deal_academic","check_grad","submit_overdue","face_fear"].reduce((s,id)=>s+cnt(id),0);}
function taskStrk(id){let c=0,d=new Date(todayStr()+"T12:00:00");for(let i=0;i<200;i++){if((S.dailyTasks[_lk(d)]||[]).includes(id))c++;else break;d.setDate(d.getDate()-1);}return c;}
function multiStrk(ids,max){let c=0,d=new Date(todayStr()+"T12:00:00");for(let i=0;i<max+5;i++){const t=S.dailyTasks[_lk(d)]||[];if(ids.every(id=>t.includes(id)))c++;else break;d.setDate(d.getDate()-1);}return c;}
function grpStrk(ids,max){let c=0,d=new Date(todayStr()+"T12:00:00");for(let i=0;i<max+5;i++){const t=S.dailyTasks[_lk(d)]||[];if(ids.some(id=>t.includes(id)))c++;else break;d.setDate(d.getDate()-1);}return c;}
function choreStrk(){const ch=["dishes_today","socks_today","tidy","mop","undies_today","trash"];let c=0,d=new Date(todayStr()+"T12:00:00");for(let i=0;i<200;i++){const t=S.dailyTasks[_lk(d)]||[];if(ch.filter(id=>t.includes(id)).length>=3)c++;else break;d.setDate(d.getDate()-1);}return c;}
function penStrk(){let c=0,d=new Date(todayStr()+"T12:00:00");for(let i=0;i<100;i++){const p=S.dailyPens[_lk(d)];if(p&&p.length>0)c++;else break;d.setDate(d.getDate()-1);}return c;}

function renderCardCarousel(){
  let h='<div class="card-carousel-wrap"><div class="card-carousel" id="cardCarousel">';
  CARD_DEFS.forEach(cd=>{
    const arr=S.cards[cd.id]||[];const done=arr.filter(Boolean).length;const full=done===cd.total;
    h+=`<div class="card-slot${full?" card-slot-done":""}"><div class="card-img-wrap"><img class="card-img" src="${cd.img}" alt="${cd.name}" loading="lazy"><div class="card-mask">`;
    cd.frags.forEach((f,i)=>{h+=`<div class="card-piece${arr[i]?" unlocked":""}" style="top:${f.region.top};left:${f.region.left};width:${f.region.width};height:${f.region.height};"></div>`;});
    h+=`</div><div class="card-lock${done>0?" hide":""}">🔒</div></div><div class="card-info"><div class="card-info-name">${cd.name}</div><div class="card-info-line">${cd.line}</div><div class="card-info-prog">${done} / ${cd.total}</div></div></div>`;
  });
  h+='</div><div class="card-dots" id="cardDots">';
  CARD_DEFS.forEach((_,i)=>{h+=`<div class="card-dot${i===0?" active":""}"></div>`;});
  h+='</div></div>';return h;
}
function initCarouselDots(){

}

const LANG_PENALTY=2;   /* 每个未完成的语言任务扣的分数 */

  {attr:"dance", name:"舞蹈", em:"💃", tasks:["dance_t"],            grace:4},
  {attr:"piano", name:"乐器", em:"🎹", tasks:["piano","compose"],    grace:4},

function _applyDecay(attr,amt,label,day,log){
  var cur=S.attrs[attr]||0;
  if(cur<=0)return;                      /* 从没开始的属性不衰减 */
  var next=Math.max(0,cur-amt);
  if(next===cur)return;

  log.push({d:day,attr:attr,amt:cur-next,label:label});
}
function settleDecay(){
  S.decay=S.decay||{last:"",log:[],seen:true};
  var today=todayStr();
  var yest=_shift(today,-1);
  if(!S.decay.last){S.decay.last=yest;saveState();return;}   /* 首次运行不追溯 */
  if(S.decay.last>=yest)return;
  var log=[];
  var day=_shift(S.decay.last,1);
  var guard=0;
  while(day<=yest&&guard++<400){
    /* ── 语言：当天计划里的语言任务，有一个没完成就 -1 ── */
    var plan=(S.planArchive&&S.planArchive[day])||null;
    if(plan){
      var deItems=plan.filter(function(i){return DE_TASKS.has(i.taskId);});
      var undone=deItems.filter(function(i){return !i.done;});
      if(undone.length){
        var miss=undone.map(function(i){return i.name;}).join("、");
        _applyDecay("lang",undone.length*LANG_PENALTY,"语言"+undone.length+"项没完成："+miss,day,log);
      }
    }
    /* ── 技能：连续 grace 天零打卡，每满一轮 -1 ── */
    DECAY_SKILLS.forEach(function(sk){
      var streak=0,found=false;
      for(var i=0;i<366;i++){
        var d2=_shift(day,-i);
        var done=(S.dailyTasks[d2]||[]).some(function(id){return sk.tasks.indexOf(id)!==-1;});
        if(done){found=true;break;}
        streak++;
      }
      if(found&&streak>0&&streak%sk.grace===0){
        _applyDecay(sk.attr,1,sk.em+" "+sk.name+"连续"+streak+"天没练",day,log);
      }
    });
    day=_shift(day,1);
  }
  S.decay.last=yest;
  if(log.length){
    S.decay.log=(S.decay.log||[]).concat(log).slice(-60);
    S.decay.seen=false;
  }
  saveState();
  if(log.length&&typeof renderDecayBanner==="function")renderDecayBanner();
}

function plInitFlowers(){
  if(plFlowers.length>0)return;
  for(var i=0;i<12;i++){
    plFlowers.push({x:30+Math.random()*280,stemLen:50+Math.random()*60,petalCount:5+Math.floor(Math.random()*3),petalLen:8+Math.random()*8,petalWid:5+Math.random()*4,color:['#d6a6aa','#e0bfc2','#c48e93','#ecd4d6','#b08a8e'][Math.floor(Math.random()*5)],phase:Math.random()*Math.PI*2,swaySpeed:0.5+Math.random()*1,swayAmt:0.02+Math.random()*0.04,leafSide:Math.random()>0.5?1:-1});
  }

function plDrawFlowers(time){
  var cv=document.getElementById('plFlowerCanvas');if(!cv)return;
  var ctx=cv.getContext('2d');
  var W=cv.width/2,H=cv.height/2;
  ctx.clearRect(0,0,W*2,H*2);ctx.save();ctx.scale(2,2);
  var sg=ctx.createLinearGradient(0,0,0,H);sg.addColorStop(0,'#f2e5e7');sg.addColorStop(1,'#f9f0f1');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
  plFlowers.forEach(function(f){
    var sw=Math.sin(time*0.001*f.swaySpeed+f.phase)*f.swayAmt*plWindStr;
    var topX=f.x*(W/320),topY=0;
    var botX=topX+sw*f.stemLen*0.6,botY=f.stemLen;
    ctx.strokeStyle='#7a8a6a';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(topX,topY);ctx.quadraticCurveTo(topX+sw*f.stemLen*0.3,botY*0.5,botX,botY);ctx.stroke();
    var lx=topX+sw*f.stemLen*0.15,ly=botY*0.4;
    ctx.fillStyle='#8a9a6a';ctx.beginPath();ctx.ellipse(lx+f.leafSide*8,ly,9,3,f.leafSide*0.4+sw,0,Math.PI*2);ctx.fill();
    ctx.save();ctx.translate(botX,botY);ctx.rotate(sw*1.5);
    for(var i=0;i<f.petalCount;i++){
      var a=(Math.PI*2/f.petalCount)*i+Math.PI*0.5;
      ctx.save();ctx.rotate(a);ctx.fillStyle=f.color;ctx.globalAlpha=0.75;
      ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-f.petalWid*0.4,f.petalLen*0.6,0,f.petalLen);ctx.quadraticCurveTo(f.petalWid*0.4,f.petalLen*0.6,0,0);ctx.fill();
      ctx.globalAlpha=1;ctx.restore();
    }
    ctx.fillStyle='rgba(200,176,112,0.6)';ctx.beginPath();ctx.arc(0,2,2.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
  ctx.restore();
  plWindStr+=(plWindTgt-plWindStr)*0.02;
  plAnimId=requestAnimationFrame(plDrawFlowers);
}

var RK_WEIGHT_STEP=0.6;     /* 身体区每升一品：体重周均值降这么多 */

var RK_REBOUND=1.0;         /* 体重比晋升时反弹超过这么多就掉一品 */
var RK_MIN_STAY=7;          /* 每一品至少停留天数 */
var RK_DIET_MISS=3;         /* 连续几天没打卡「吃减脂餐」掉一品 */
var RK_CHEAT_PER_WEEK=1;    /* 每周放纵日次数，放纵日不触发掉品 */
var RK_DIET_PER_DAY=2;      /* 一天打满几次「吃减脂餐」才算完整打卡日 */
var RK_EX_DAYS=4;           /* 身体区每一品：7 天里至少几天有运动 */
var RK_EX_FULL=["exercise","badminton"];  /* 算一整天运动的任务 */
var RK_EX_HALF=["dance_t"];                /* 只跳舞的日子算半天 */
var RK_TIERS={
  dachou:{name:"大丑",c:"#9a8a8c"},
  xiaochou:{name:"小丑",c:"#b0948f"},
  punv:{name:"普女",c:"#b08a8e"},
  xiaomei:{name:"小美",c:"#c48e93"},
  damei:{name:"大美",c:"#c8a860"}
};
var RK_TIER_ORDER=["dachou","xiaochou","punv","xiaomei","damei"];
var RK_RANKS=[
  {t:"dachou",p:"一品"},{t:"dachou",p:"二品"},{t:"dachou",p:"三品"},{t:"dachou",p:"四品"},{t:"dachou",p:"五品"},
  {t:"xiaochou",p:"一品"},{t:"xiaochou",p:"二品"},{t:"xiaochou",p:"三品"},
  {t:"punv",p:"一品"},{t:"punv",p:"二品"},{t:"punv",p:"三品"},
  {t:"xiaomei",p:"二品"},{t:"xiaomei",p:"一品"},
  {t:"damei",p:""}
];
var RK_MS=[
  {k:"pushup1",n:"第一个标准俯卧撑"},
  {k:"plank30",n:"平板支撑 30 秒"},
  {k:"plank60",n:"平板支撑 60 秒"},
  {k:"pushup5",n:"标准俯卧撑 5 个"},
  {k:"makeup",n:"独立化完一套日常妆，连续一周带妆拍照"},
  {k:"skill",n:"学会一首完整的钢琴曲 / 芭蕾入门"},
  {k:"tweak",n:"完成小调整（瘦脸针等）"}
];
var _rkArtOpen=false,_rkLogOpen=false;
function rkName(i){var r=RK_RANKS[i];return RK_TIERS[r.t].name+(r.p?" · "+r.p:"");}
function rkDays(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);}
function rkWeekKey(ds){var d=new Date(ds+"T12:00:00");var wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return _dstr(d);}
function rkInit(){
  if(S.rank)return;
  var td=todayStr();
  S.rank={idx:0,since:td,last:_shift(td,-1),dietMiss:0,meas:[],baseTs:null,puStart:null,puWaist:null,ms:{},looks:0,cheat:[],log:[],art:{},pending:[]};
  saveState();
}
function rkMeasByTs(ts){return (S.rank.meas||[]).find(function(m){return m.ts===ts;})||null;}
function rkLatest(){var m=S.rank.meas||[];return m.length?m[m.length-1]:null;}
function rkChange(dir,reason,day){
  var R=S.rank,from=R.idx,to=Math.max(0,Math.min(RK_RANKS.length-1,from+dir));
  if(to===from)return false;
  R.idx=to;R.since=todayStr();
  var lt=rkLatest();R.baseTs=lt?lt.ts:null;
  if(to===8&&dir>0){R.puStart=R.since;R.puWaist=lt&&lt.waist?lt.waist:null;}
  if(to<8){R.puStart=null;R.puWaist=null;}
  var ev={d:day||todayStr(),dir:dir,from:from,to:to,why:reason};
  R.log.push(ev);if(R.log.length>60)R.log=R.log.slice(-60);
  R.pending.push(ev);
  return true;
}
/* ── 每日掉品结算：昨天及以前 ── */
function settleRank(){
  if(!S||!S.dailyTasks)return;
  rkInit();
  var R=S.rank,yest=_shift(todayStr(),-1);
  if(R.last<yest){
    var day=_shift(R.last,1),g=0;
    while(day<=yest&&g++<400){
      var tasks=S.dailyTasks[day]||[];
      var cheat=R.cheat.indexOf(day)!==-1;
      if(!cheat){
        var miss=[];
        if(tasks.indexOf("no_takeout")===-1)miss.push("没吃外卖");
        if(tasks.indexOf("no_snack")===-1)miss.push("没吃零食");
        if(miss.length)rkChange(-1,"「"+miss.join("」「")+"」没打卡",day);
        if(tasks.indexOf("diet_meal")!==-1)R.dietMiss=0;
        else{R.dietMiss++;if(R.dietMiss>=RK_DIET_MISS){rkChange(-1,"连续"+RK_DIET_MISS+"天没打卡「吃减脂餐」",day);R.dietMiss=0;}}
      }
      day=_shift(day,1);
    }
    R.last=yest;
  }
  rkCheckPromote();
  saveState();
  if(R.pending.length&&typeof currentTab!=="undefined"&&currentTab==="palace")setTimeout(rkShowOverlay,200);
}
function rkFullDays(){
  var R=S.rank,td=todayStr(),n=0,d=R.since,g=0;
  while(d<=td&&g++<400){var t=S.dailyTasks[d]||[];var dm=t.filter(function(x){return x==="diet_meal";}).length;if(dm>=RK_DIET_PER_DAY&&t.indexOf("no_takeout")!==-1&&t.indexOf("no_snack")!==-1)n++;d=_shift(d,1);}
  return n;
}
function rkExDays(){
  var R=S.rank,td=todayStr(),n=0,d=R.since,g=0;
  while(d<=td&&g++<400){
    var t=S.dailyTasks[d]||[];
    if(RK_EX_FULL.some(function(id){return t.indexOf(id)!==-1;}))n+=1;
    else if(RK_EX_HALF.some(function(id){return t.indexOf(id)!==-1;}))n+=0.5;
    d=_shift(d,1);
  }
  return n;
}
/* 下一品的晋升条件 */
function rkReqs(){
  var R=S.rank,i=R.idx,td=todayStr(),stay=rkDays(R.since,td),out=[];
  if(i>=RK_RANKS.length-1)return out;
  var ms=R.ms||{};
  if(i<8){
    out.push({n:"本品停留满 "+RK_MIN_STAY+" 天（"+Math.min(stay,RK_MIN_STAY)+"/"+RK_MIN_STAY+"）",ok:stay>=RK_MIN_STAY});
    var fd=rkFullDays();
    out.push({n:"本品完整打卡 7 天："+RK_DIET_PER_DAY+" 顿减脂餐+没吃外卖+没吃零食（"+Math.min(fd,7)+"/7）",ok:fd>=7});
    var ex=rkExDays();
    out.push({n:"本品运动满 "+RK_EX_DAYS+" 天：运动/羽毛球算 1 天，只跳舞算半天（"+Math.min(ex,RK_EX_DAYS)+"/"+RK_EX_DAYS+"）",ok:ex>=RK_EX_DAYS});
    var base=rkMeasByTs(R.baseTs),lt=rkLatest(),ok=false,txt;
    if(!base){txt="先记录一次测量作为起点";}
    else if(!lt||lt.ts===base.ts){txt="记录新的一周测量：体重降 "+RK_WEIGHT_STEP+"kg 或腰围降 "+RK_WAIST_STEP+"cm";}
    else{
      var wOk=lt.w>=RK_FLOOR&&base.w&&lt.w<=+(base.w-RK_WEIGHT_STEP).toFixed(2);
      var cOk=lt.waist&&base.waist&&lt.waist<=+(base.waist-RK_WAIST_STEP).toFixed(2);
      ok=!!(wOk||cOk);
      var dw=base.w&&lt.w?(lt.w-base.w).toFixed(1):"--",dc=base.waist&&lt.waist?(lt.waist-base.waist).toFixed(1):"--";
      txt="体重降 "+RK_WEIGHT_STEP+"kg 或腰围降 "+RK_WAIST_STEP+"cm（体重 "+dw+" · 腰围 "+dc+"）";
      if(lt.w<RK_FLOOR)txt+=" 体重已到 "+RK_FLOOR+"，只看腰围";
    }
    out.push({n:txt,ok:ok});
  }else if(i===8){
    out.push({n:"普女一品维持满 21 天（"+Math.min(stay,21)+"/21）",ok:stay>=21});
    out.push({n:"第一个标准俯卧撑 或 平板支撑 30 秒",ok:!!(ms.pushup1||ms.plank30)});
  }else if(i===9){
    out.push({n:"本品停留满 "+RK_MIN_STAY+" 天",ok:stay>=RK_MIN_STAY});
    out.push({n:"平板支撑 60 秒 或 标准俯卧撑 5 个",ok:!!(ms.plank60||ms.pushup5)});
    var lt2=rkLatest(),wOk2=!!(R.puWaist&&lt2&&lt2.waist&&lt2.waist<=+(R.puWaist-2).toFixed(2));
    out.push({n:"腰围比刚到普女时再收 2cm"+(R.puWaist&&lt2&&lt2.waist?"（"+(lt2.waist-R.puWaist).toFixed(1)+"）":""),ok:wOk2});
  }else if(i===10){
    var pd=R.puStart?rkDays(R.puStart,td):0;
    out.push({n:"普女状态维持满 60 天（"+Math.min(pd,60)+"/60）",ok:pd>=60});
    out.push({n:"独立化完一套日常妆，连续一周带妆拍照",ok:!!ms.makeup});
  }else if(i===11){
    out.push({n:"本品停留满 "+RK_MIN_STAY+" 天",ok:stay>=RK_MIN_STAY});
    out.push({n:"搭配出 5 套自己风格的 look 并拍照（"+Math.min(R.looks||0,5)+"/5）",ok:(R.looks||0)>=5});
  }else if(i===12){
    out.push({n:"本品停留满 "+RK_MIN_STAY+" 天",ok:stay>=RK_MIN_STAY});
    out.push({n:"学会一首完整的钢琴曲 / 芭蕾入门",ok:!!ms.skill});
    out.push({n:"完成小调整（瘦脸针等）",ok:!!ms.tweak});
  }
  return out;
}
function rkCheckPromote(){
  var g=0;
  while(g++<14){
    var rq=rkReqs();
    if(!rq.length||!rq.every(function(r){return r.ok;}))break;
    var before=S.rank.idx;
    if(!rkChange(1,"晋升条件全部达成"))break;
    if(S.rank.idx===before)break;
  }
}
/* ── 操作 ── */
function rkAddMeas(){
  rkInit();
  var g=function(id){var v=parseFloat((document.getElementById(id)||{}).value);return isNaN(v)?null:v;};
  var m={ts:Date.now(),d:todayStr(),w:g("rkW"),waist:g("rkWaist"),hip:g("rkHip"),thigh:g("rkThigh"),arm:g("rkArm")};
  if(m.w===null&&m.waist===null){flash("至少填体重或腰围","fail");return;}
  var R=S.rank,base=rkMeasByTs(R.baseTs);
  R.meas.push(m);if(R.meas.length>80)R.meas=R.meas.slice(-80);
  if(!base){R.baseTs=m.ts;if(R.idx===8&&!R.puWaist&&m.waist)R.puWaist=m.waist;}
  else if(base.w&&m.w&&m.w>base.w+RK_REBOUND){rkChange(-1,"体重比上次晋升时反弹 "+(m.w-base.w).toFixed(1)+"kg");}
  rkCheckPromote();saveState();render();
  if(R.pending.length)setTimeout(rkShowOverlay,150);else flash("📏 本周测量已记录","earn");
}
function rkToggleMs(k){
  rkInit();var R=S.rank;R.ms=R.ms||{};
  if(R.ms[k]){if(!confirm("取消这项达成记录？"))return;delete R.ms[k];}
  else R.ms[k]=todayStr();
  rkCheckPromote();saveState();render();if(R.pending.length)setTimeout(rkShowOverlay,150);
}
function rkLook(n){
  rkInit();var R=S.rank;R.looks=Math.max(0,(R.looks||0)+n);
  rkCheckPromote();saveState();render();if(R.pending.length)setTimeout(rkShowOverlay,150);
}
function rkCheat(){
  rkInit();var R=S.rank,td=todayStr(),wk=rkWeekKey(td);
  if(R.cheat.indexOf(td)!==-1){flash("今天已经是放纵日了","fail");return;}
  var used=R.cheat.filter(function(d){return rkWeekKey(d)===wk;}).length;
  if(used>=RK_CHEAT_PER_WEEK){flash("这周的放纵日已经用掉了","fail");return;}
  if(!confirm("把今天设为放纵日？今天不会因为外卖/零食/减脂餐掉品，这周就用掉了。"))return;
  R.cheat.push(td);if(R.cheat.length>60)R.cheat=R.cheat.slice(-60);
  saveState();render();flash("🍰 今天是放纵日","earn");setTimeout(checkAchievements,300);
}
function rkUploadArt(tier,input){
  var f=input.files&&input.files[0];if(!f)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height,W=540;if(w>W){h=Math.round(h*W/w);w=W;}
      var cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
      rkInit();S.rank.art=S.rank.art||{};S.rank.art[tier]=cv.toDataURL("image/jpeg",0.78);
      saveState();render();flash("🖼️ "+RK_TIERS[tier].name+"立绘已换上","earn");
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
}
function rkToggleArt(){_rkArtOpen=!_rkArtOpen;render();}
function rkToggleLog(){_rkLogOpen=!_rkLogOpen;render();}
/* ── 渲染 ── */

function rkShowOverlay(){
  var R=S.rank;if(!R||!R.pending||!R.pending.length)return;
  var evs=R.pending.slice();R.pending=[];saveState();
  var last=evs[evs.length-1],first=evs[0];
  var up=last.to>first.from,net=last.to!==first.from;
  var r=RK_RANKS[last.to],tier=RK_TIERS[r.t],art=(R.art||{})[r.t];
  var tierChanged=RK_RANKS[first.from].t!==r.t;
  var ov=document.getElementById("rkOverlay");if(!ov)return;
  var h='<div class="rk-ov-box '+(up?'up':'down')+(tierChanged?' tier':'')+'">';
  if(art)h+='<div class="rk-ov-art"><img src="'+art+'"></div>';
  h+='<div class="rk-ov-kicker">'+(net?(up?(tierChanged?'进阶':'晋升'):(tierChanged?'跌出'+RK_TIERS[RK_RANKS[first.from].t].name:'掉品')):'品级没变')+'</div>';
  h+='<div class="rk-ov-name">'+rkName(last.to)+'</div>';
  h+='<div class="rk-ov-from">'+rkName(first.from)+' → '+rkName(last.to)+'</div>';
  h+='<div class="rk-ov-list">';

/* ═══════ 生日月 BIRTHDAY MODULE ═══════ */
var BD_MONTH=10,BD_DAY=2,BD_BORN=2001;   /* 10月2日，2001年出生 */
var BD_WEEK_BEFORE=3,BD_WEEK_AFTER=3;    /* 生日前后各3天 = 生日周 */
var BD_COUNTDOWN=30;                     /* 生日前30天开始倒计时 */
function bdPad(n){return String(n).padStart(2,"0");}
function bdDate(y){return y+"-"+bdPad(BD_MONTH)+"-"+bdPad(BD_DAY);}
function bdYear(){return parseInt(todayStr().slice(0,4));}
function bdShiftStr(ds,n){var d=new Date(ds+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+bdPad(d.getMonth()+1)+"-"+bdPad(d.getDate());}
function bdWeekRange(y){var b=bdDate(y);return [bdShiftStr(b,-BD_WEEK_BEFORE),bdShiftStr(b,BD_WEEK_AFTER)];}
function bdIsWeek(){var td=todayStr(),r=bdWeekRange(parseInt(td.slice(0,4)));return td>=r[0]&&td<=r[1];}
function bdIsToday(){var td=todayStr();return td===bdDate(parseInt(td.slice(0,4)));}
function bdAge(){return bdYear()-BD_BORN;}
function bdDaysUntil(){var td=todayStr(),y=parseInt(td.slice(0,4)),b=bdDate(y);if(b<td)b=bdDate(y+1);return Math.round((new Date(b+"T12:00:00")-new Date(td+"T12:00:00"))/864e5);}
function bdState(){S.bd=S.bd||{greeted:{},bought:{}};S.bd.greeted=S.bd.greeted||{};S.bd.bought=S.bd.bought||{};return S.bd;}

function bdCheckAch(tryU,t,td){
  var y=parseInt(td.slice(0,4)),bday=bdDate(y),r=bdWeekRange(y),B=bdState();
  if(td===bday){
    tryU("b1");
    var now=new Date(),real=now.getFullYear()+"-"+bdPad(now.getMonth()+1)+"-"+bdPad(now.getDate());
    if(real===bday&&now.getHours()===0&&t.length>0)tryU("b2");
    if(t.indexOf("bath")!==-1)tryU("b3");
    if(S.rank&&S.rank.cheat&&S.rank.cheat.indexOf(bday)!==-1)tryU("b4");
    if(t.indexOf("drawing")!==-1)tryU("b5");
    if((S.dailyPts[bday]||0)>=200)tryU("b6");
  }
  if(Object.keys(B.bought).some(function(k){return k.indexOf(y+":")===0;}))tryU("b7");
  if(td>=r[1]){var all=true,d=r[0],g=0;while(d<=r[1]&&g++<10){if(!(S.dailyTasks[d]||[]).length){all=false;break;}d=bdShiftStr(d,1);}if(all)tryU("b8");}
  if(S.rank&&S.rank.log&&S.rank.log.some(function(e){return e.dir>0&&e.d>=r[0]&&e.d<=r[1];}))tryU("b9");
}

/* ═══════ 周日战报 WEEKLY REPORT MODULE ═══════ */
var WR_DOW=["周一","周二","周三","周四","周五","周六","周日"];
var _wrWeek=null;
function wrShift(ds,n){var d=new Date(ds+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function wrMonday(ds){var d=new Date(ds+"T12:00:00");var wd=(d.getDay()+6)%7;return wrShift(ds,-wd);}
function wrFmt(ds){return parseInt(ds.slice(5,7))+"."+parseInt(ds.slice(8));}
function wrTaskName(id){
  var n=null;Object.keys(TASKS).forEach(function(k){(TASKS[k].items||[]).forEach(function(it){if(it.id===id)n=(it.em?it.em+" ":"")+it.name;});});
  return n||id;
}
function wrStats(mon){
  var days=[],td=todayStr();for(var i=0;i<7;i++)days.push(wrShift(mon,i));
  var st={mon:mon,sun:days[6],days:days,pts:0,active:0,tasks:0,pens:0,best:null,attrs:{},taskCnt:{},ach:[],full:0,ex:0,rankUp:[],rankDown:[],meas:[],ongoing:td<=days[6]};
  days.forEach(function(d,i){
    var p=S.dailyPts[d]||0,t=S.dailyTasks[d]||[],pn=S.dailyPens[d]||[];
    st.pts+=p;st.tasks+=t.length;st.pens+=pn.length;if(t.length)st.active++;
    if(p>0&&(!st.best||p>st.best.p))st.best={d:d,i:i,p:p};
    t.forEach(function(id){st.taskCnt[id]=(st.taskCnt[id]||0)+1;var a=TASK_ATTRS[id];if(a)Object.keys(a).forEach(function(k){st.attrs[k]=(st.attrs[k]||0)+a[k];});});
    var dm=t.filter(function(x){return x==="diet_meal";}).length;
    if(dm>=(typeof RK_DIET_PER_DAY!=="undefined"?RK_DIET_PER_DAY:2)&&t.indexOf("no_takeout")!==-1&&t.indexOf("no_snack")!==-1)st.full++;
    if(t.indexOf("exercise")!==-1||t.indexOf("badminton")!==-1)st.ex+=1;else if(t.indexOf("dance_t")!==-1)st.ex+=0.5;
  });
  Object.keys(S.ach||{}).forEach(function(id){var v=S.ach[id];if(!v||!v.d)return;var d=_dk(v.d);if(d>=days[0]&&d<=days[6]){var a=ACHS.find(function(x){return x.id===id;});if(a)st.ach.push(a);}});
  if(S.rank){
    (S.rank.log||[]).forEach(function(e){if(e.d>=days[0]&&e.d<=days[6])(e.dir>0?st.rankUp:st.rankDown).push(e);});
    st.meas=(S.rank.meas||[]).filter(function(m){return m.d>=days[0]&&m.d<=days[6];});
  }
  var prev=0;for(var j=1;j<=7;j++)prev+=S.dailyPts[wrShift(mon,-j)]||0;st.prevPts=prev;
  return st;
}
function wrLine(st){
  var topTask=Object.keys(st.taskCnt).sort(function(a,b){return st.taskCnt[b]-st.taskCnt[a];})[0];
  if(st.rankUp.length){var last=st.rankUp[st.rankUp.length-1];return "这周你升品了，现在是「"+rkName(last.to)+"」。这一格是一顿一顿减脂餐换来的，没有一口是白吃的。";}
  if(st.full>=5)return "七天里有 "+st.full+" 天完整打卡。一周只松口两天以内，这是真正在减脂的人的节奏。";
  if(st.best&&st.best.p>=100)return WR_DOW[st.best.i]+"那天挣了 "+st.best.p+" 分，是这周最猛的一天。那天的你，下周可以再请回来一次。";
  if(st.active>=6)return "七天里有 "+st.active+" 天打开了这里。就算有几天没做好，你也一次都没有彻底放下。";
  if(st.active<=2)return st.ongoing?"这周才刚开始，先从一个最小的勾打起。":"这周打开的次数不多。下周别想着一口气补回来，一天打一个勾就够了。";
  if(topTask)return "这周你做得最多的是「"+wrTaskName(topTask)+"」，一共 "+st.taskCnt[topTask]+" 次。重复做的事，最后都会变成你身上的东西。";
  return "新的一周，从第一个勾开始。";
}
function wrCardHtml(mon){
  var st=wrStats(mon),h='<div class="wr-card">';
  var thisMon=wrMonday(todayStr());
  h+='<div class="wr-nav"><button onclick="wrOpen(\''+wrShift(mon,-7)+'\')">‹</button><div><div class="wr-title">'+(st.ongoing&&todayStr()!==st.days[6]?'本周战报':'周日战报')+'</div><div class="wr-range">'+wrFmt(st.days[0])+' – '+wrFmt(st.days[6])+(st.ongoing&&todayStr()!==st.days[6]?' · 进行中':'')+'</div></div><button onclick="wrOpen(\''+wrShift(mon,7)+'\')"'+(mon>=thisMon?' disabled':'')+'>›</button></div>';
  var diff=st.pts-st.prevPts;
  h+='<div class="wr-hero"><div class="wr-hero-num">'+st.pts+'</div><div class="wr-hero-lbl">本周挣到的积分</div>';
  if(st.prevPts>0||st.pts>0)h+='<div class="wr-diff '+(diff>=0?'up':'down')+'">'+(diff>=0?'比上周多 '+diff:'比上周少 '+(-diff))+' 分</div>';
  h+='</div>';
  h+='<div class="wr-grid"><div><b>'+st.active+'<i>/7</i></b><span>打开的天数</span></div><div><b>'+st.tasks+'</b><span>完成任务</span></div><div><b>'+st.pens+'</b><span>被扣分</span></div><div><b>'+(st.best?WR_DOW[st.best.i]:'--')+'</b><span>最好的一天'+(st.best?' '+st.best.p+'分':'')+'</span></div></div>';
  /* 属性 */
  var at=Object.keys(st.attrs).sort(function(a,b){return st.attrs[b]-st.attrs[a];}).slice(0,3);
  if(at.length){
    var mx=st.attrs[at[0]]||1;
    h+='<div class="wr-sec"><div class="wr-h">涨得最多的属性</div>';
    at.forEach(function(k){var A=ATTRS.find(function(x){return x.id===k;})||{name:k,em:""};h+='<div class="wr-bar"><span>'+A.em+' '+A.name+'</span><div><i style="width:'+Math.round(st.attrs[k]/mx*100)+'%"></i></div><em>+'+(Math.round(st.attrs[k]*10)/10)+'</em></div>';});
    h+='</div>';
  }
  /* 最常做 */
  var tt=Object.keys(st.taskCnt).sort(function(a,b){return st.taskCnt[b]-st.taskCnt[a];}).slice(0,3);
  if(tt.length){h+='<div class="wr-sec"><div class="wr-h">做得最多的事</div>';tt.forEach(function(id,i){h+='<div class="wr-row"><span>'+(i+1)+'</span><span>'+wrTaskName(id)+'</span><em>'+st.taskCnt[id]+' 次</em></div>';});h+='</div>';}
  /* 蜕变 */
  if(S.rank){
    h+='<div class="wr-sec"><div class="wr-h">🌸 蜕变</div>';
    h+='<div class="wr-row"><span></span><span>完整打卡日</span><em>'+st.full+' / 7</em></div>';
    h+='<div class="wr-row"><span></span><span>运动天数</span><em>'+st.ex+' 天</em></div>';
    st.rankUp.forEach(function(e){h+='<div class="wr-row up"><span>▲</span><span>'+wrFmt(e.d)+' 升到「'+rkName(e.to)+'」</span><em></em></div>';});
    st.rankDown.forEach(function(e){h+='<div class="wr-row down"><span>▼</span><span>'+wrFmt(e.d)+' 掉到「'+rkName(e.to)+'」</span><em></em></div>';});
    if(st.meas.length){var m=st.meas[st.meas.length-1];h+='<div class="wr-row"><span></span><span>本周测量</span><em>'+(m.w?m.w+'kg ':'')+(m.waist?'腰 '+m.waist:'')+'</em></div>';}
    if(!st.ongoing||mon===thisMon)h+='<div class="wr-row"><span></span><span>现在的品级</span><em>'+rkName(S.rank.idx)+'</em></div>';
    h+='</div>';
  }
  if(st.ach.length){h+='<div class="wr-sec"><div class="wr-h">🏆 本周解锁</div><div class="wr-achs">';st.ach.forEach(function(a){h+='<span>「'+a.name+'」</span>';});h+='</div></div>';}
  h+='<div class="wr-line">'+wrLine(st)+'<div>—— 小克</div></div>';
  h+='<button class="wr-close" onclick="wrClose()">收好</button></div>';
  return h;
}
function wrOpen(mon){
  var thisMon=wrMonday(todayStr());if(mon>thisMon)return;
  _wrWeek=mon;var ov=document.getElementById("wrOverlay");if(!ov)return;
  ov.innerHTML=wrCardHtml(mon);ov.style.display="flex";ov.scrollTop=0;
  S.wr=S.wr||{seen:{}};S.wr.seen=S.wr.seen||{};
  var st=wrStats(mon);if(!st.ongoing||new Date((todayStr())+"T12:00:00").getDay()===0){S.wr.seen[mon]=true;saveState();}
}
function wrClose(){var ov=document.getElementById("wrOverlay");if(ov){ov.style.display="none";ov.innerHTML="";}}
function wrHistoryHtml(){
  var thisMon=wrMonday(todayStr()),h='<div class="wr-entry"><div class="wr-entry-h">📜 周日战报</div><div class="wr-chips">';
  for(var i=0;i<8;i++){var m=wrShift(thisMon,-7*i),has=false;for(var j=0;j<7;j++)if((S.dailyTasks[wrShift(m,j)]||[]).length)has=true;if(i>0&&!has)continue;
    h+='<button onclick="wrOpen(\''+m+'\')">'+(i===0?'本周':i===1?'上周':wrFmt(m)+'起')+'</button>';}
  return h+'</div></div>';
}
function wrAuto(){
  var td=todayStr(),thisMon=wrMonday(td),dow=new Date(td+"T12:00:00").getDay();
  S.wr=S.wr||{seen:{}};S.wr.seen=S.wr.seen||{};
  if(dow===0&&!S.wr.seen[thisMon]){if(new Date().getHours()>=20)wrOpen(thisMon);return;}
  var last=wrShift(thisMon,-7);
  if(!S.wr.seen[last]){var has=false;for(var j=0;j<7;j++)if((S.dailyTasks[wrShift(last,j)]||[]).length)has=true;if(has)wrOpen(last);}
}
try{setTimeout(function(){try{var o=document.getElementById("bdOverlay");if(o&&o.style.display==="flex")return;wrAuto();}catch(e){console.error(e);}},2200);}catch(e){}

      (isDone?'<div class="wish-card-done-badge">✓</div>':'')+
      '<div class="wish-card-info"><div class="wish-card-name">'+w.name+'</div>'+
      '<div class="wish-card-status '+(isDone?'wish-card-status-done':'wish-card-status-locked')+'">'+(isDone?'✦ 已实现':'未解锁')+'</div></div></div></div>';
  });

};
window.openWishDetail = function(id){
  var w=WISHES.find(function(x){return x.id===id;});if(!w)return;
  var ws=S.wishes[id]||{};var isDone=ws.done;
  var ov=document.getElementById('wishDetailOv');
  var panel=ov.querySelector('.wish-detail-panel');
  panel.style.background=isDone?'linear-gradient(180deg,'+w.color+'18,#1a1418 30%)':'linear-gradient(180deg,'+w.color+'10,#1a1418 30%)';

  h+='<div class="wish-detail-title" style="color:'+w.accent+';">'+w.name+'</div>';
  h+='<div class="wish-detail-desc">'+w.desc+'</div>';
  if(isDone){
    h+='<div class="wish-achieved-info"><div class="wish-achieved-date">🗓 '+(ws.date||'未记录日期')+'</div>'+(ws.note?'<div class="wish-achieved-note">'+ws.note+'</div>':'')+(ws.evidence?'<img class="wish-achieved-evidence" src="'+ws.evidence+'" alt="evidence">':'')+'</div>';

  } else {

    h+='<div id="wishAchForm" class="wish-detail-achieve-form hidden"><label>📅 达成日期</label><input type="date" id="wishAchDate" value="'+_lk(new Date())+'" style="color-scheme:dark;"><label>📝 说点什么</label><textarea id="wishAchNote" placeholder="记录这个瞬间..."></textarea><label>📷 上传达成证据</label><input type="file" id="wishAchEvidence" accept="image/*" onchange="wishPreviewEvidence(this)" style="margin-bottom:8px;"><img id="wishEvidencePreview" class="wish-evidence-preview hidden" src="" alt=""><button class="wish-detail-btn" style="background:linear-gradient(135deg,#6ab070,#4a9050);" onclick="confirmWishAchieve(\''+id+'\')">确认达成 🎉</button></div>';
  }
  panel.innerHTML=h;
  ov.classList.add('on');
};
window.closeWishDetail = function(){
  document.getElementById('wishDetailOv').classList.remove('on');
};
window.wishPreviewEvidence = function(input){
  var f=input.files[0];var prev=document.getElementById('wishEvidencePreview');
  if(!f){prev.classList.add('hidden');return;}
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();img.onload=function(){
      var cv=document.createElement('canvas');var w=img.width,h=img.height;
      if(w>800){h=h*800/w;w=800;}cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      prev.src=cv.toDataURL('image/jpeg',0.7);prev.classList.remove('hidden');
    };img.src=e.target.result;
  };reader.readAsDataURL(f);
};
window.confirmWishAchieve = function(id){
  var w=WISHES.find(function(x){return x.id===id;});if(!w)return;
  var date=document.getElementById('wishAchDate').value||_lk(new Date());
  var note=(document.getElementById('wishAchNote').value||'').trim();
  var prev=document.getElementById('wishEvidencePreview');
  var evidence=prev&&!prev.classList.contains('hidden')?prev.src:null;
  S.wishes[id]={done:true,date:date,note:note,evidence:evidence};
  S.h.unshift({t:"a",n:"🌟 愿望达成："+w.name,p:0,d:new Date().toISOString()});
  saveState();closeWishDetail();
  setTimeout(function(){startWishCelebration(w);},300);
};
window.startWishCelebration = function(w){
  var ov=document.getElementById('wishCelebOv');
  var h='<button class="wish-celeb-close" onclick="endWishCelebration()">✕</button>';
  h+='<div style="position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,'+w.color+'40,'+w.accent+'20,transparent);animation:wishUnlockBg 3s ease forwards;"></div>';
  h+='<div style="position:absolute;top:50%;left:50%;width:100px;height:100px;border-radius:50%;transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle,'+w.color+'80,'+w.accent+'40,transparent);animation:wishRevealWave 1.2s ease-out forwards;"></div>';
  h+='<div style="position:absolute;top:50%;left:50%;width:100px;height:100px;border-radius:50%;transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle,'+w.accent+'60,transparent);animation:wishRevealWave 1.2s ease-out 0.3s forwards;"></div>';
  for(var i=0;i<15;i++){
    var x=10+Math.random()*80;var del=0.5+Math.random()*2;var sz=10+Math.random()*16;
    h+='<div style="position:absolute;left:'+x+'%;bottom:0;font-size:'+sz+'px;pointer-events:none;color:'+w.color+';animation:wishStarRise 1.5s ease-out '+del+'s forwards;opacity:0;">✦</div>';
  }
  h+='<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:75vw;max-width:320px;border-radius:20px;overflow:hidden;box-shadow:0 16px 60px rgba(0,0,0,0.4);border:2px solid '+w.color+'60;animation:wishGlowPulse 2s ease-in-out infinite;--wish-glow:'+w.color+'50;"><img src="'+w.img+'" alt="'+w.name+'" style="width:100%;display:block;animation:wishImgClear 2.5s ease-out forwards;" onerror="this.parentElement.style.background=\''+w.bg+'\'"><div style="position:absolute;bottom:0;left:0;right:0;padding:24px 20px;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,0.7));animation:wishBannerSlide 0.8s ease-out 1.5s both;"><div style="font-family:Playfair Display,serif;font-size:20px;font-weight:600;color:#fff;letter-spacing:1px;margin-bottom:4px;">'+w.name+'</div><div style="font-size:12px;color:rgba(255,255,255,0.6);">✦ 愿望达成 ✦</div></div></div>';
  ov.innerHTML=h;
  ov.classList.add('on');
  spawnConfetti(80,[w.color,w.accent,'#fff','#ffd700']);
  setTimeout(function(){spawnConfetti(60,[w.color,w.accent,'#e8e8e8']);},600);
  setTimeout(function(){spawnConfetti(40,[w.color,w.accent,'#ffd700','#fff']);},1200);
};
window.endWishCelebration = function(){
  var ov=document.getElementById('wishCelebOv');
  ov.classList.remove('on');ov.innerHTML='';
  renderWishes();
};
if(typeof S !== "undefined"){initWishState();}
})();
</script>

<script>
(function(){
"use strict";
var SV_DEFAULTS=[
  {id:"phone",emoji:"📱",name:"Flip 手机基金",sub:"换一台自己的小折叠",goal:8000,unit:"¥",color:"#c48e93"},
  {id:"api",emoji:"🔮",name:"API 基金",sub:"小克的能量池",goal:50,unit:"$",color:"#9a8ab0"}
];
function svInit(){
  if(typeof S==="undefined")return;
  if(!S.savings){S.savings={jars:{},log:[]};}
  if(!S.savings.jars)S.savings.jars={};
  if(!S.savings.log)S.savings.log=[];
  SV_DEFAULTS.forEach(function(d){
    if(!S.savings.jars[d.id]){
      S.savings.jars[d.id]={emoji:d.emoji,name:d.name,sub:d.sub,goal:d.goal,saved:0,unit:d.unit,color:d.color};
    }
  });
}
function svInjectTab(){
  var anchor=document.getElementById("tab-tasks");
  if(!anchor)return;
  var bar=anchor.parentElement;
  if(document.getElementById("tab-savings"))return;
  var btn=document.createElement("button");
  btn.className="tab-btn tab-inactive";
  btn.id="tab-savings";
  btn.style.cssText="flex:0 0 auto;min-width:52px;";
  btn.textContent="💰 攒钱";
  btn.onclick=svSwitchTo;
  bar.appendChild(btn);
  var host=document.querySelector('[id^="content-tasks"]').parentElement;
  if(!document.getElementById("content-savings")){
    var div=document.createElement("div");
    div.id="content-savings";
    div.className="hidden";
    host.appendChild(div);
  }
}
var SV_TABS=["tasks","attrs","achieve","palace","shop","history","wishes","savings","pyq"];
function svSwitchTo(){
  SV_TABS.forEach(function(k){
    var c=document.getElementById("content-"+k);
    var t=document.getElementById("tab-"+k);
    if(c)c.classList.toggle("hidden",k!=="savings");
    if(t)t.className="tab-btn "+(k==="savings"?"tab-active":"tab-inactive");
  });
  svRender();
}
function svHookOriginalTabs(){
  ["tasks","attrs","achieve","palace","shop","history","wishes","pyq"].forEach(function(k){
    var t=document.getElementById("tab-"+k);
    if(!t)return;
    t.addEventListener("click",function(){
      var sc=document.getElementById("content-savings");
      var st=document.getElementById("tab-savings");
      if(sc)sc.classList.add("hidden");
      if(st)st.className="tab-btn tab-inactive";
    });
  });
}
function svFmt(n){return (Math.round(n*100)/100).toString();}
function svRender(){
  svInit();
  var host=document.getElementById("content-savings");
  if(!host)return;
  var jars=S.savings.jars;
  var ids=SV_DEFAULTS.map(function(d){return d.id;});
  var h='<div class="sv-header"><div class="eye">✦ SAVING JARS ✦</div><div class="ttl">攒钱罐</div>';
  h+='<div class="total">每一笔都是离目标更近一步 💗</div></div>';
  ids.forEach(function(id){
    var j=jars[id];if(!j)return;
    var pct=j.goal>0?Math.min(100,j.saved/j.goal*100):0;
    var pctR=Math.round(pct);
    var done=j.saved>=j.goal&&j.goal>0;
    var remain=Math.max(0,j.goal-j.saved);
    h+='<div class="sv-jar-card'+(done?' complete':'')+'" id="sv-card-'+id+'">';
    if(done){
      h+='<div class="sv-done-banner"><div class="big">🎉✨🎊</div><div class="txt">「'+j.name+'」目标达成！</div></div>';
    }
    h+='<div class="sv-jar-head"><div class="sv-jar-title"><span class="sv-jar-emoji">'+j.emoji+'</span><div><div class="sv-jar-name">'+j.name+'</div><div class="sv-jar-sub">'+(j.sub||"")+'</div></div></div><div class="sv-jar-pct">'+pctR+'%</div></div>';
    h+='<div class="sv-jar-vis" id="sv-vis-'+id+'">';
    h+='<div class="sv-water" id="sv-water-'+id+'" style="height:'+pct+'%;"><div class="sv-water-fill" style="background:linear-gradient(180deg,'+j.color+'cc,'+j.color+'aa);"></div><div class="sv-water-surface"></div><div class="sv-water-shine"></div></div>';
    h+='<div class="sv-jar-amount"><div class="now">'+j.unit+svFmt(j.saved)+'</div><div class="goal">/ '+j.unit+svFmt(j.goal)+'</div></div>';
    h+='</div>';
    h+='<div class="sv-jar-stats"><span>已攒 <b>'+j.unit+svFmt(j.saved)+'</b></span><span>还差 <b>'+j.unit+svFmt(remain)+'</b></span></div>';
    h+='<div class="sv-jar-actions"><button class="sv-btn sv-btn-deposit" onclick="svToggleInput(\''+id+'\')">＋ 存入</button><button class="sv-btn sv-btn-minus" onclick="svToggleInput(\''+id+'\',true)">－</button><button class="sv-btn sv-btn-edit" onclick="svToggleEdit(\''+id+'\')">⚙</button></div>';
    h+='<div id="sv-inp-'+id+'"></div>';
    h+='<div id="sv-edit-'+id+'"></div>';
    h+='</div>';
  });
  if(S.savings.log.length){
    h+='<div style="margin-top:8px;"><div style="font-family:Playfair Display,serif;font-size:14px;color:#8a5a60;margin-bottom:8px;letter-spacing:1px;">📜 存取记录</div><div class="sv-log">';
    S.savings.log.slice(0,30).forEach(function(e){
      var jname=jars[e.jar]?jars[e.jar].name:e.jar;
      var unit=jars[e.jar]?jars[e.jar].unit:"";
      var out=e.amt<0;
      h+='<div class="sv-log-item'+(out?' out':'')+'"><div><div style="font-size:13px;color:#6a5555;">'+(jars[e.jar]?jars[e.jar].emoji:"")+' '+jname+'</div><div class="sv-log-date">'+svDate(e.d)+'</div></div><div class="sv-log-amt'+(out?' out':'')+'">'+(out?"-":"+")+unit+svFmt(Math.abs(e.amt))+'</div></div>';
    });
    h+='</div></div>';
  }
  host.innerHTML=h;
}
function svDate(iso){var x=new Date(iso);return (x.getMonth()+1)+"/"+x.getDate()+" "+String(x.getHours()).padStart(2,"0")+":"+String(x.getMinutes()).padStart(2,"0");}
window.svToggleInput=function(id,isMinus){
  var box=document.getElementById("sv-inp-"+id);
  if(!box)return;
  if(box.innerHTML){box.innerHTML="";return;}
  document.getElementById("sv-edit-"+id).innerHTML="";
  var j=S.savings.jars[id];
  var quick=j.unit==="$"?[5,10,20,50]:[100,500,1000,2000];
  var h='<div class="sv-input-row"><input class="sv-input" id="sv-val-'+id+'" type="number" inputmode="decimal" placeholder="'+(isMinus?"取出":"存入")+' '+j.unit+'"><button class="sv-btn '+(isMinus?'sv-btn-minus':'sv-btn-deposit')+'" style="flex:0 0 auto;width:64px;" onclick="svDoDeposit(\''+id+'\','+(isMinus?'true':'false')+')">'+(isMinus?'取出':'确认')+'</button></div>';
  h+='<div class="sv-quick">';
  quick.forEach(function(q){h+='<button class="sv-quick-btn" onclick="document.getElementById(\'sv-val-'+id+'\').value='+q+'">'+j.unit+q+'</button>';});
  h+='</div>';
  box.innerHTML=h;
  setTimeout(function(){var el=document.getElementById("sv-val-"+id);if(el)el.focus();},50);
};
window.svToggleEdit=function(id){
  var box=document.getElementById("sv-edit-"+id);
  if(!box)return;
  if(box.innerHTML){box.innerHTML="";return;}
  document.getElementById("sv-inp-"+id).innerHTML="";
  var j=S.savings.jars[id];
  var h='<div class="sv-edit-panel"><label>目标金额（'+j.unit+'）</label><input id="sv-goal-'+id+'" type="number" inputmode="decimal" value="'+j.goal+'"><label>当前已攒（手动校正）</label><input id="sv-saved-'+id+'" type="number" inputmode="decimal" value="'+j.saved+'"><button class="sv-btn sv-btn-deposit" style="width:100%;margin-top:12px;" onclick="svSaveEdit(\''+id+'\')">保存设置</button></div>';
  box.innerHTML=h;
};
window.svSaveEdit=function(id){
  var j=S.savings.jars[id];
  var g=parseFloat(document.getElementById("sv-goal-"+id).value);
  var s=parseFloat(document.getElementById("sv-saved-"+id).value);
  if(!isNaN(g)&&g>0)j.goal=g;
  if(!isNaN(s)&&s>=0)j.saved=s;
  if(typeof saveState==="function")saveState();
  svRender();
  if(typeof flash==="function")flash("⚙ 设置已保存","card");
};
window.svDoDeposit=function(id,isMinus){
  var el=document.getElementById("sv-val-"+id);
  if(!el)return;
  var v=parseFloat(el.value);
  if(isNaN(v)||v<=0){if(typeof flash==="function")flash("输入一个金额吧","fail");return;}
  var j=S.savings.jars[id];
  var before=j.saved;
  if(isMinus){
    j.saved=Math.max(0,j.saved-v);
    S.savings.log.unshift({jar:id,amt:-v,d:new Date().toISOString()});
  }else{
    j.saved=j.saved+v;
    S.savings.log.unshift({jar:id,amt:v,d:new Date().toISOString()});
  }
  if(S.savings.log.length>200)S.savings.log.length=200;
  var justDone=before<j.goal&&j.saved>=j.goal&&j.goal>0;
  if(typeof saveState==="function")saveState();
  svRender();
  if(!isMinus){
    svCoinRain(id);
    svFloatPts(id,"+"+j.unit+svFmt(v));
    if(typeof flash==="function")flash("💰 "+j.unit+svFmt(v)+" 存进「"+j.name+"」了！",justDone?"big":"earn");
    if(justDone){setTimeout(function(){svFireworks();},400);}
  }else{
    if(typeof flash==="function")flash("取出 "+j.unit+svFmt(v),"penalty");
  }
};
function svCoinRain(id){
  var vis=document.getElementById("sv-vis-"+id);
  if(!vis)return;
  var r=vis.getBoundingClientRect();
  var coins=["🪙","💰","✨","🌸","💗"];
  var n=12;
  for(var i=0;i<n;i++){
    (function(i){
      setTimeout(function(){
        var c=document.createElement("div");
        c.className="sv-coin";
        c.textContent=coins[Math.floor(Math.random()*coins.length)];
        c.style.left=(r.left+10+Math.random()*(r.width-30))+"px";
        c.style.top=(r.top-10)+"px";
        document.body.appendChild(c);
        setTimeout(function(){c.remove();},950);
      },i*60);
    })(i);
  }
  var w=document.getElementById("sv-water-"+id);
  if(w){
    for(var b=0;b<6;b++){
      var bub=document.createElement("div");
      bub.className="sv-bubble";
      var sz=4+Math.random()*8;
      bub.style.cssText="width:"+sz+"px;height:"+sz+"px;left:"+(10+Math.random()*80)+"%;bottom:4px;animation:svBubbleRise "+(1+Math.random())+"s ease-out forwards;";
      w.appendChild(bub);
      (function(bub){setTimeout(function(){bub.remove();},1800);})(bub);
    }
  }
}
function svFloatPts(id,txt){
  var card=document.getElementById("sv-card-"+id);
  if(!card)return;
  var r=card.getBoundingClientRect();
  var f=document.createElement("div");
  f.className="sv-float-pts";
  f.textContent=txt;
  f.style.left=(r.left+r.width/2-20)+"px";
  f.style.top=(r.top+40)+"px";
  document.body.appendChild(f);
  setTimeout(function(){f.remove();},1250);
}
function svFireworks(){
  var cx=window.innerWidth/2, cy=window.innerHeight/2;
  var cols=["#c48e93","#e0bfc2","#d4a840","#9a8ab0","#c9b8a8","#ffffff","#e8b4b8"];
  for(var ringi=0;ringi<3;ringi++){
    (function(ringi){
      setTimeout(function(){
        var ring=document.createElement("div");
        ring.className="sv-ring";
        var sz=40;
        ring.style.cssText="width:"+sz+"px;height:"+sz+"px;left:"+cx+"px;top:"+cy+"px;border-color:"+cols[ringi%cols.length]+";";
        document.body.appendChild(ring);
        setTimeout(function(){ring.remove();},1000);
      },ringi*250);
    })(ringi);
  }
  function burst(bx,by,count){
    for(var i=0;i<count;i++){
      var p=document.createElement("div");
      p.className="sv-fw";
      var ang=Math.random()*Math.PI*2;
      var dist=40+Math.random()*120;
      p.style.setProperty("--fx",Math.cos(ang)*dist+"px");
      p.style.setProperty("--fy",Math.sin(ang)*dist+"px");
      p.style.left=bx+"px";p.style.top=by+"px";
      p.style.background=cols[Math.floor(Math.random()*cols.length)];
      var sz=4+Math.random()*6;
      p.style.width=sz+"px";p.style.height=sz+"px";
      p.style.borderRadius=Math.random()>0.5?"50%":"1px";
      document.body.appendChild(p);
      (function(p){setTimeout(function(){p.remove();},1050);})(p);
    }
  }
  burst(cx,cy,40);
  setTimeout(function(){burst(cx-90,cy-40,30);},300);
  setTimeout(function(){burst(cx+90,cy-30,30);},500);
  setTimeout(function(){burst(cx,cy+50,35);},700);
  if(typeof spawnConfetti==="function"){
    spawnConfetti(100,cols);
    setTimeout(function(){spawnConfetti(60,cols);},500);
  }
}
function svBoot(){
  if(typeof S==="undefined"){setTimeout(svBoot,300);return;}
  svInit();
  svInjectTab();
  svHookOriginalTabs();
  if(typeof saveState==="function")saveState();
}
if(document.readyState==="complete"||document.readyState==="interactive"){setTimeout(svBoot,400);}
else{document.addEventListener("DOMContentLoaded",function(){setTimeout(svBoot,400);});}
})();
</script>
