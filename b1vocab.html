<style>
/* VOICE: quiet, tender study desk; few hues, fine detail
   IDEA: a Karteikasten — index cards filed behind tabbed dividers
   PICTURE: the card box itself, tabs on top, cards below
   COLOUR+TYPE: Morandi sage ground; der dusty blue, die dusty rose, das sage; Literata for German, system CJK for Chinese
   LAYOUT: one calm column, sticky tabs, cards stack; two columns above 900px */
:root{color-scheme:light dark;
--bg:light-dark(#e7eae4,#151917);--card:light-dark(#fbfbf8,#1f2421);--ink:light-dark(#252a27,#e6e9e4);
--mute:light-dark(#6d736e,#9aa29c);--line:light-dark(#d5d9d2,#323a35);--tab:light-dark(#d9ddd5,#262c28);
--der:light-dark(#4f6f91,#8fb0d2);--die:light-dark(#a85f63,#e0a0a3);--das:light-dark(#5f8462,#9cc49f);
--acc:light-dark(#7c6a8f,#b9a6cc);--ok:light-dark(#5f8462,#9cc49f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;overflow-x:clip}
.de{font-family:Literata,Georgia,serif}
header{padding:calc(28px + env(safe-area-inset-top)) max(5vw,16px) 8px;max-width:1240px;margin:auto}
h1{font:600 clamp(30px,6vw,44px)/1.05 Literata,Georgia,serif;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 14px;font-size:15px}
.bar{height:8px;border-radius:8px;background:var(--tab);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .5s}
.stat{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mute);margin-top:8px}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.ctrl{position:sticky;top:0;padding-top:max(10px,env(safe-area-inset-top)) !important;z-index:5;background:var(--bg);padding:10px max(5vw,16px);max-width:1240px;margin:auto}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;border:0;border-radius:12px 12px 4px 4px;background:var(--tab);color:var(--ink);font:inherit;font-size:15px;padding:10px 14px;min-height:44px;cursor:pointer}
.tabs button.on{background:var(--card);box-shadow:0 -2px 0 var(--acc) inset;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.row input[type=search]{flex:1 1 180px;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:44px}
.tg{display:flex;align-items:center;gap:6px;font-size:14px;padding:8px 12px;border-radius:10px;background:var(--tab);min-height:44px;cursor:pointer;user-select:none}
.tg input{width:18px;height:18px;accent-color:var(--acc)}
.legend{font-size:13px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.legend span b{font-weight:600}
main{max-width:1240px;margin:auto;padding:6px max(5vw,16px) calc(60px + env(safe-area-inset-bottom));display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sec{grid-column:1/-1;font-weight:600;font-size:15px;line-height:1.4;color:var(--mute);margin:14px 0 0;padding-bottom:6px;border-bottom:1px solid var(--line)}
.card{background:var(--card);border-radius:14px;padding:16px 16px 12px;border:1px solid var(--line);position:relative}
.card.known{opacity:.62}
.top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.art{font-weight:600;font-size:17px}
.g-der{color:var(--der)}.g-die{color:var(--die)}.g-das{color:var(--das)}.g-x{color:var(--mute)}
.w{font-size:22px;font-weight:600;line-height:1.2}
.tags{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:12px;padding:3px 9px;border-radius:20px;white-space:nowrap;border:1px solid currentColor}
.lv-m{color:var(--die)}.lv-w{color:var(--acc)}.lv-r{color:var(--mute)}
.meta{font-size:14px;color:var(--mute);margin-top:4px}
.meta .de{color:var(--ink)}
.vf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0 2px}
.vf div{background:var(--bg);border-radius:8px;padding:6px 8px;font-size:15px}
.vf small{display:block;font-size:12px;color:var(--mute)}
.mean{margin-top:10px;font-size:17px}
.mean .en{color:var(--mute);font-size:14px;margin-left:6px}
.ex{margin:8px 0 0;font-size:15px;border-left:3px solid var(--line);padding-left:10px}
.ex span{display:block;color:var(--mute);font-size:14px}
.note{margin:8px 0 0;font-size:14px;background:light-dark(#f1eef4,#262230);border-radius:8px;padding:7px 10px}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button{flex:1;font:inherit;font-size:14px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.btns button.sel{background:var(--ink);color:var(--card);border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide .card:not(.open) .hid{filter:blur(7px);user-select:none}
.hide .card:not(.open){cursor:pointer}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
.wb{font-size:12px;padding:3px 9px;border-radius:20px;white-space:nowrap;background:light-dark(#f4e4e4,#3a2627);color:var(--die)}
.btns button.wbtn{flex:1.15}.btns button.ed{flex:none;width:48px}
.acts{display:flex;gap:8px;margin-top:8px}
.acts button{flex:1;font:inherit;font-size:15px;min-height:44px;border-radius:10px;border:0;background:var(--ink);color:var(--card);cursor:pointer}
.acts button+button{background:var(--acc)}
footer{text-align:center;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
footer button{font:inherit;font-size:14px;color:var(--mute);background:none;border:1px solid var(--line);border-radius:10px;padding:8px 16px;min-height:40px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(20,24,22,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:640px;margin:auto;background:var(--card);border-radius:18px 18px 0 0;max-height:90vh;max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease}
.sh.on{transform:none}
.sh .hd{position:sticky;top:0;background:var(--card);display:flex;align-items:center;padding:14px 0 10px;z-index:1}
.sh .hd b{font-size:18px}
.sh .hd button{margin-left:auto;font:inherit;font-size:14px;border:0;background:var(--tab);color:var(--ink);border-radius:10px;padding:8px 14px;min-height:40px;cursor:pointer}
.fm label{display:block;font-size:13px;color:var(--mute);margin-top:10px}
.fm input,.fm select,.fm textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
.fm textarea{resize:vertical}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.uml{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.uml button{font:17px Literata,Georgia,serif;min-width:40px;min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.dup{font-size:13px;color:var(--die);margin:6px 0 0;min-height:0}
.dup:empty{display:none}
.fbtn{display:flex;gap:8px;margin-top:16px}
.fbtn button,.qbtn button{flex:1;font:inherit;font-size:15px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.fbtn button.pri,.qbtn button.pri{background:var(--ink);color:var(--card);border-color:var(--ink)}
.fbtn button.danger{flex:none;padding:0 16px;color:var(--die)}
.hint{font-size:13px;color:var(--mute);margin:10px 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.chips button{font:inherit;font-size:14px;min-height:42px;padding:0 14px;border-radius:21px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chips button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chips button:disabled{opacity:.4}
.qp{font-size:13px;color:var(--mute);margin:2px 0 0}
.qk{font-size:14px;color:var(--mute);margin:18px 0 4px}
.qw{font-size:30px;font-weight:600;line-height:1.25;margin:0}
.qh{color:var(--mute);margin:6px 0 0}
.qr{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--bg)}
.qr .mean{margin-top:0}
.qbtn{display:flex;gap:8px;margin-top:16px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.qa button{font:600 20px Literata,Georgia,serif;min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.qa button.right{outline:3px solid var(--ok)}.qa button.bad{opacity:.45;text-decoration:line-through}
.qf{margin-top:12px;font-size:15px;font-weight:600}
.qf.ok{color:var(--ok)}.qf.no{color:var(--die)}
.qend{text-align:center;padding:10px 0}
.qend b{font-size:40px;font-family:Literata,Georgia,serif}
.bk textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

const save=()=>st("b1vocab-mark",mark),saveMine=()=>st("b1vocab-mine",mine),saveWrong=()=>st("b1vocab-wrong",wrong);
const ALL=()=>D.concat(mine);
const today=()=>{const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")};
const NOUN=a=>a==="der"||a==="die"||a==="das";
let tab="all";
try{tab=localStorage.getItem("b1vocab-tab")||"all"}catch(e){}
if(tab!=="all"&&tab!=="wrong"&&!SEC[tab])tab="all";
const $=id=>document.getElementById(id);
const gcls=a=>a?("g-"+a.split("/")[0]):"g-x";
function card(d){
const k=key(d),m=mark[k],wr=wrong[k];
const art=d.a?`<span class="art de ${gcls(d.a)}">${esc(d.a)}</span>`:"";
const meta=[];
if(d.full)meta.push(`全称 <span class="de">${esc(d.full)}</span>`);
if(d.pl)meta.push(`复数 <span class="de">${esc(d.pl)}</span>`);
if(d.fem)meta.push(`女性 <span class="de">${esc(d.fem)}</span>`);
if(d.vt)meta.push(esc(d.vt));
const vf=d.v?`<div class="vf"><div><small>现在时 er/sie</small><span class="de">${esc(d.v[0])}</span></div><div><small>过去时</small><span class="de">${esc(d.v[1])}</span></div><div><small>完成时</small><span class="de">${esc(d.v[2])}</span></div></div>`:"";
const tg=[];
if(wr)tg.push(`<span class="wb">错 ${wr.n} 次${wr.art?" · 冠词":""}${wr.s?` · 已连对 ${wr.s}`:""}</span>`);
if(d.id)tg.push(`<span class="tag lv-r">我加的</span>`);
if(d.lv)tg.push(`<span class="tag lv-${d.lv}">${LV[d.lv]}</span>`);
return `<article class="card${m===1?" known":""}" data-k="${esc(k)}">
<div class="top">${art}<span class="w de">${esc(d.w)}</span><span class="tags">${tg.join("")}</span></div>
${meta.length?`<div class="meta">${meta.join(" · ")}</div>`:""}${vf}
<div class="mean hid">${esc(d.zh)}${d.en?`<span class="en">${esc(d.en)}</span>`:""}</div>
${d.ex?`<p class="ex"><span class="de" style="color:var(--ink);font-size:15px">${esc(d.ex)}</span>${d.exz?`<span class="hid">${esc(d.exz)}</span>`:""}</p>`:""}
${d.n?`<p class="note hid">${esc(d.n)}</p>`:""}
<div class="btns"><button data-v="1" class="${m===1?"sel":""}">认识了</button><button data-v="0" class="${m===0?"sel":""}">还不熟</button><button data-x="w" class="wbtn">${wr?"移出错题本":"进错题本"}</button>${d.id?`<button data-x="e" class="ed" aria-label="修改">改</button>`:""}</div>
</article>`}
function draw(){
const q=$("q").value.trim().toLowerCase(),only=$("onlyNo").checked;
let list=ALL(),html="",last="",n=0;
if(tab==="wrong")list=list.filter(d=>wrong[key(d)]).sort((a,b)=>wrong[key(b)].n-wrong[key(a)].n);
for(const d of list){
if(tab!=="all"&&tab!=="wrong"&&d.s!==tab)continue;
if(only&&mark[key(d)]===1)continue;
if(q&&!(d.w+" "+d.zh+" "+(d.full||"")+" "+(d.en||"")).toLowerCase().includes(q))continue;
if(tab==="wrong"){if(!last){html+=`<h2 class="sec">错题本 · 错得越多越靠前 · 小测里连对两次自动出本</h2>`;last="w"}}
else if(d.s!==last){html+=`<h2 class="sec">${SEC[d.s]}</h2>`;last=d.s}
html+=card(d);n++}
let em=only?"这一组全认识了，换一组吧":"没有找到";
if(!q&&!only&&tab==="mine")em="还没有自己加的词。点上面「＋ 加生词」，把今天碰到的第一个放进来";
if(!q&&!only&&tab==="wrong")em="错题本是空的。做一轮小测，错的会自己跑进来";
$("list").innerHTML=n?html:`<p class="empty">${em}</p>`;
stats()}
function stats(){
const A=ALL(),ok=A.filter(d=>mark[key(d)]===1).length,no=A.filter(d=>mark[key(d)]===0).length;
$("nAll").textContent=A.length;$("nOk").textContent=ok;$("nNo").textContent=no;$("nNew").textContent=A.length-ok-no;
$("pg").style.width=(A.length?ok/A.length*100:0)+"%"}
function wCount(){return ALL().filter(d=>wrong[key(d)]).length}
function tabs(){
const t=[["all","全部"],...Object.entries(SEC).map(([k,v])=>[k,k==="mine"&&mine.length?v+" · "+mine.length:v]),["wrong","错题本"+(wCount()?" · "+wCount():"")]];
$("tabs").innerHTML=t.map(([k,v])=>`<button data-t="${k}" class="${k===tab?"on":""}">${v}</button>`).join("")}
function refresh(){tabs();draw()}
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;try{localStorage.setItem("b1vocab-tab",tab)}catch(x){}refresh();window.scrollTo({top:0})});
$("list").addEventListener("click",e=>{
const c=e.target.closest(".card");if(!c)return;
const k=c.dataset.k;
const x=e.target.closest("button[data-x]");
if(x){if(x.dataset.x==="w"){if(wrong[k])delete wrong[k];else wrong[k]={n:1,s:0,last:today()};saveWrong();refresh()}
else openForm(mine.find(m=>"mine|"+m.id===k));return}
const b=e.target.closest("button[data-v]");
if(b){const v=+b.dataset.v;if(mark[k]===v)delete mark[k];else mark[k]=v;save();
c.classList.toggle("known",mark[k]===1);c.querySelectorAll("button[data-v]").forEach(y=>y.classList.toggle("sel",mark[k]===+y.dataset.v));stats();return}
if(document.body.classList.contains("hide"))c.classList.toggle("open")});
$("q").addEventListener("input",draw);
$("onlyNo").addEventListener("change",draw);
$("hide").addEventListener("change",e=>{document.body.classList.toggle("hide",e.target.checked);document.querySelectorAll(".card.open").forEach(c=>c.classList.remove("open"))});

/* ---------- 底部抽屉 ---------- */
let onClose=null;
function openSheet(title,html){$("shT").textContent=title;$("shB").innerHTML=html;$("sheet").scrollTop=0;$("ov").classList.add("on");$("sheet").classList.add("on")}
function closeSheet(){$("ov").classList.remove("on");$("sheet").classList.remove("on");const f=onClose;onClose=null;if(f)f()}
$("ov").addEventListener("click",closeSheet);$("shX").addEventListener("click",closeSheet);

/* ---------- 自己加生词 ---------- */
function openForm(it){
const ed=!!it,o=it||{};
openSheet(ed?"改一下这个词":"加一个生词",`<div class="fm">
<label>冠词<select id="fA"><option value="">无（动词、形容词、副词…）</option>${["der","die","das"].map(a=>`<option${o.a===a?" selected":""}>${a}</option>`).join("")}</select></label>
<label>德语 *<input id="fW" class="de" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(o.w)}"></label>
<div class="uml">${["ä","ö","ü","ß","Ä","Ö","Ü"].map(u=>`<button type="button" data-u="${u}">${u}</button>`).join("")}</div>
<p class="dup" id="fDup"></p>
<label>中文意思 *<input id="fZ" autocomplete="off" value="${esc(o.zh)}"></label>
<label>英文<input id="fE" autocomplete="off" autocapitalize="off" value="${esc(o.en)}"></label>
<label id="fPw">复数<input id="fP" class="de" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="die …" value="${esc(o.pl)}"></label>
<div class="tri" id="fVw"><label>现在时 er/sie<input id="fV0" class="de" autocapitalize="off" spellcheck="false" value="${esc(o.v&&o.v[0])}"></label><label>过去时<input id="fV1" class="de" autocapitalize="off" spellcheck="false" value="${esc(o.v&&o.v[1])}"></label><label>完成时<input id="fV2" class="de" autocapitalize="off" spellcheck="false" placeholder="hat …" value="${esc(o.v&&o.v[2])}"></label></div>
<label>例句<textarea id="fX" class="de" rows="2" autocapitalize="sentences" spellcheck="false">${esc(o.ex)}</textarea></label>
<label>例句翻译<input id="fXZ" autocomplete="off" value="${esc(o.exz)}"></label>
<label>备注（在哪碰到的、容易错在哪）<textarea id="fN" rows="2">${esc(o.n)}</textarea></label>
<label>分类<select id="fL"><option value="">不标</option><option value="r"${o.lv==="r"?" selected":""}>认得就行</option><option value="w"${o.lv==="w"?" selected":""}>要会写</option></select></label>
<div class="fbtn">${ed?`<button type="button" class="danger" id="fDel">删掉</button>`:""}<button type="button" class="pri" id="fOk">${ed?"改好了":"放进词盒"}</button></div>
<p class="hint">只有德语和中文必填，别的空着也行。存在这台手机上，记得偶尔点页面最下面「备份」。</p></div>`);
let lastIn=$("fW");
$("shB").querySelectorAll("input,textarea").forEach(i=>i.addEventListener("focus",()=>lastIn=i));
$("shB").querySelector(".uml").addEventListener("mousedown",e=>e.preventDefault());
$("shB").querySelector(".uml").addEventListener("click",e=>{const b=e.target.closest("button[data-u]");if(!b||!lastIn)return;
const s=lastIn.selectionStart??lastIn.value.length,t=lastIn.selectionEnd??s;lastIn.value=lastIn.value.slice(0,s)+b.dataset.u+lastIn.value.slice(t);lastIn.focus();lastIn.setSelectionRange(s+1,s+1);lastIn.dispatchEvent(new Event("input"))});
const sync=()=>{const noun=$("fA").value!=="";$("fPw").style.display=noun?"":"none";$("fVw").style.display=noun?"none":""};
$("fA").addEventListener("change",sync);sync();
const dup=()=>{const v=$("fW").value.trim().toLowerCase();const h=v&&ALL().find(d=>d.w.toLowerCase()===v&&(!o.id||d.id!==o.id));
$("fDup").textContent=h?`词盒里已经有了：${h.a?h.a+" ":""}${h.w}（${SEC[h.s]}）。还想再加一个也可以。`:""};
$("fW").addEventListener("input",dup);dup();
$("fOk").addEventListener("click",()=>{
const g=id=>$(id).value.trim(),w=g("fW"),zh=g("fZ");
if(!w){$("fW").focus();return}if(!zh){$("fZ").focus();return}
const a=$("fA").value,r={id:o.id||(Date.now().toString(36)+Math.random().toString(36).slice(2,6)),s:"mine",a,w,zh,t:o.t||today()};
const put=(f,v)=>{if(v)r[f]=v};
put("en",g("fE"));put("ex",g("fX"));put("exz",g("fXZ"));put("n",g("fN"));put("lv",$("fL").value);
if(a)put("pl",g("fP"));else{const v=[g("fV0"),g("fV1"),g("fV2")];if(v.some(Boolean))r.v=v}
if(ed){const i=mine.findIndex(m=>m.id===o.id);if(i>=0)mine[i]=r}else mine.unshift(r);
saveMine();onClose=refresh;closeSheet()});
if(ed)$("fDel").addEventListener("click",()=>{if(!confirm(`删掉「${o.w}」？删了就找不回了。`))return;
mine=mine.filter(m=>m.id!==o.id);const k="mine|"+o.id;delete mark[k];delete wrong[k];saveMine();save();saveWrong();onClose=refresh;closeSheet()});
if(!ed)setTimeout(()=>$("fW").focus(),280)}
$("addBtn").addEventListener("click",()=>openForm(null));

/* ---------- 小测 + 错题本 ---------- */
let qcfg={sc:"cur",num:10};
const scopes=()=>{const A=ALL(),cur=tab==="all"?A:tab==="wrong"?A.filter(d=>wrong[key(d)]):A.filter(d=>d.s===tab);
const tname=tab==="all"?"全部":tab==="wrong"?"错题本":SEC[tab];
return [["cur","当前这组 · "+tname,cur],["wrong","错题本",A.filter(d=>wrong[key(d)])],["no","标了还不熟的",A.filter(d=>mark[key(d)]===0)],["new","还没标过的",A.filter(d=>mark[key(d)]===undefined)]]};
function openQuiz(){
const S=scopes();
openSheet("小测一轮",`<p class="hint" style="margin-top:0">答错的自动进错题本；错题本里的词连着答对两次，自动出本。</p>
<p class="qk">考哪些</p><div class="chips" id="qS">${S.map(([k,l,a])=>`<button data-s="${k}" class="${qcfg.sc===k?"on":""}"${a.length?"":" disabled"}>${esc(l)} · ${a.length}</button>`).join("")}</div>
<p class="qk">几道</p><div class="chips" id="qN">${[10,20,0].map(n=>`<button data-n="${n}" class="${qcfg.num===n?"on":""}">${n||"全部"}</button>`).join("")}</div>
<div class="qbtn"><button class="pri" id="qGo">开始</button></div>`);
if(!S.find(s=>s[0]===qcfg.sc)[2].length){const f=S.find(s=>s[2].length);if(f){qcfg.sc=f[0];$("qS").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.s===f[0]))}}
$("qS").addEventListener("click",e=>{const b=e.target.closest("button[data-s]");if(!b||b.disabled)return;qcfg.sc=b.dataset.s;$("qS").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))});
$("qN").addEventListener("click",e=>{const b=e.target.closest("button[data-n]");if(!b)return;qcfg.num=+b.dataset.n;$("qN").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))});
$("qGo").addEventListener("click",()=>{const pool=scopes().find(s=>s[0]===qcfg.sc)[2].slice();
if(!pool.length){$("qGo").textContent="这组是空的，换一组";return}
for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
runQuiz(qcfg.num?pool.slice(0,qcfg.num):pool)});
onClose=refresh}
function runQuiz(items){
let i=0;const res={ok:0,no:0,inn:0,out:0};
const rec=(d,ok,type)=>{const k=key(d);
if(!ok){res.no++;if(!wrong[k])res.inn++;const w=wrong[k]||{n:0,s:0};w.n++;w.s=0;w.last=today();if(type==="art")w.art=1;wrong[k]=w;saveWrong();return ""}
res.ok++;if(wrong[k]){wrong[k].s=(wrong[k].s||0)+1;if(wrong[k].s>=2){delete wrong[k];res.out++;saveWrong();return " · 连对两次，出本了"}saveWrong();return " · 再对一次就出本"}return ""};
const ans=d=>{const vf=d.v?`<div class="vf"><div><small>现在时</small><span class="de">${esc(d.v[0])}</span></div><div><small>过去时</small><span class="de">${esc(d.v[1])}</span></div><div><small>完成时</small><span class="de">${esc(d.v[2])}</span></div></div>`:"";
return `<div class="qr"><div class="top">${d.a?`<span class="art de ${gcls(d.a)}">${esc(d.a)}</span>`:""}<span class="w de">${esc(d.w)}</span></div>${d.pl?`<div class="meta">复数 <span class="de">${esc(d.pl)}</span></div>`:""}${vf}
<div class="mean" style="margin-top:8px">${esc(d.zh)}${d.en?`<span class="en">${esc(d.en)}</span>`:""}</div>${d.ex?`<p class="ex"><span class="de" style="color:var(--ink)">${esc(d.ex)}</span>${d.exz?`<span>${esc(d.exz)}</span>`:""}</p>`:""}${d.n?`<p class="note">${esc(d.n)}</p>`:""}</div>`};
const next=()=>{i++;i<items.length?show():end()};
const nextBtn=t=>`<div class="qbtn"><button class="pri" id="qNx">${i+1<items.length?"下一题":"看结果"}</button></div>`;
function show(){
const d=items[i],wr=wrong[key(d)],types=["zh","de"];if(NOUN(d.a))types.push("art");
const type=wr&&wr.art&&NOUN(d.a)?"art":types[Math.floor(Math.random()*types.length)];
const head=`<p class="qp">第 ${i+1} / ${items.length} 题 · 对 ${res.ok} · 错 ${res.no}${wr?" · 这个词错过 "+wr.n+" 次":""}</p>`;
if(type==="art"){
$("shB").innerHTML=head+`<p class="qk">选冠词</p><p class="qw de">___ ${esc(d.w)}</p><p class="qh">${esc(d.zh)}</p><div class="qa" id="qA">${["der","die","das"].map(a=>`<button data-a="${a}" class="de g-${a}">${a}</button>`).join("")}</div><div id="qF"></div>`;
$("qA").addEventListener("click",e=>{const b=e.target.closest("button[data-a]");if(!b||$("qA").dataset.done)return;$("qA").dataset.done=1;
const ok=b.dataset.a===d.a,extra=rec(d,ok,"art");
$("qA").querySelectorAll("button").forEach(x=>{if(x.dataset.a===d.a)x.classList.add("right");else if(x===b)x.classList.add("bad")});
$("qF").innerHTML=`<p class="qf ${ok?"ok":"no"}">${ok?"对了":"是 "+esc(d.a)+" "+esc(d.w)}${extra}</p>`+ans(d)+nextBtn();$("qNx").addEventListener("click",next)});
}else{
const zh=type==="zh";
$("shB").innerHTML=head+(zh?`<p class="qk">这个词什么意思？</p><p class="qw de">${d.a?`<span class="${gcls(d.a)}">${esc(d.a)}</span> `:""}${esc(d.w)}</p>`:`<p class="qk">德语怎么说？${NOUN(d.a)?"（连冠词一起想）":""}</p><p class="qw">${esc(d.zh)}</p>${d.en?`<p class="qh">${esc(d.en)}</p>`:""}`)+
`<div id="qF"><div class="qbtn"><button class="pri" id="qSee">想好了，看答案</button></div></div>`;
$("qSee").addEventListener("click",()=>{$("qF").innerHTML=ans(d)+`<div class="qbtn"><button id="qNo">没想起来</button><button class="pri" id="qOk">想起来了</button></div>`;
const done=ok=>{const extra=rec(d,ok,type);$("qF").innerHTML=`<p class="qf ${ok?"ok":"no"}">${ok?"记住了":"进错题本了"}${extra}</p>`+ans(d)+nextBtn();$("qNx").addEventListener("click",next)};
$("qNo").addEventListener("click",()=>done(false));$("qOk").addEventListener("click",()=>done(true))})}
$("sheet").scrollTop=0}
function end(){
$("shB").innerHTML=`<div class="qend"><p class="qk">这一轮</p><b>${res.ok} / ${items.length}</b><p class="qh">新进错题本 ${res.inn} 个 · 出本 ${res.out} 个 · 错题本现在 ${wCount()} 个</p></div>
<div class="qbtn"><button id="qWb">去错题本</button><button class="pri" id="qAg">再来一轮</button></div>`;
$("qAg").addEventListener("click",openQuiz);
$("qWb").addEventListener("click",()=>{tab="wrong";try{localStorage.setItem("b1vocab-tab",tab)}catch(x){}onClose=()=>{refresh();window.scrollTo({top:0})};closeSheet()})}
onClose=refresh;show()}
$("quizBtn").addEventListener("click",openQuiz);

/* ---------- 备份 ---------- */
$("bk").addEventListener("click",()=>{
let code="";try{code="B1V1:"+btoa(unescape(encodeURIComponent(JSON.stringify({mark,mine,wrong}))))}catch(e){}
openSheet("备份 / 恢复",`<div class="fm bk"><p class="hint" style="margin-top:0">你的标记、自己加的词、错题本都只存在这台手机上。把下面这串整个复制，存进备忘录，换手机或数据丢了还能找回来。</p>
<label>我的备份码<textarea id="bkO" rows="4" readonly>${esc(code)}</textarea></label>
<div class="fbtn"><button type="button" class="pri" id="bkC">复制备份码</button></div>
<label style="margin-top:22px">恢复：把以前存的备份码粘贴进来<textarea id="bkI" rows="4" spellcheck="false" autocapitalize="off"></textarea></label>
<div class="fbtn"><button type="button" id="bkR">用这份恢复</button></div><p class="dup" id="bkM"></p></div>`);
$("bkC").addEventListener("click",async()=>{const t=$("bkO");try{await navigator.clipboard.writeText(t.value);$("bkC").textContent="复制好了"}catch(e){t.focus();t.select();t.setSelectionRange(0,t.value.length);$("bkC").textContent="已全选，长按拷贝"}});
$("bkR").addEventListener("click",()=>{const s=$("bkI").value.trim().replace(/^B1V1:/,"");let o;
try{o=JSON.parse(decodeURIComponent(escape(atob(s))))}catch(e){$("bkM").textContent="这串码读不出来，检查一下是不是复制全了。";return}
if(!o||typeof o!=="object"){$("bkM").textContent="这串码读不出来。";return}
if(!confirm("会用这份备份替换现在的标记、生词和错题本，确定吗？"))return;
mark=o.mark&&typeof o.mark==="object"?o.mark:{};mine=Array.isArray(o.mine)?o.mine:[];wrong=o.wrong&&typeof o.wrong==="object"?o.wrong:{};
save();saveMine();saveWrong();onClose=refresh;closeSheet()})});

tabs();draw();
}
</script>
</body>
</html>
